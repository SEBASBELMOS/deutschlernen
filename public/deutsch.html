<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschLernen</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
body { background:#080810; color:#e2e8f0; font-family:system-ui,sans-serif; min-height:100vh; }
button,input,textarea { font-family:inherit; cursor:pointer; }
#app { max-width:620px; margin:0 auto; display:flex; flex-direction:column; min-height:100vh; }
.tab-nav { display:flex; align-items:center; padding:14px 8px 0; gap:4px; }
.tab-arrow { flex-shrink:0; background:none; border:none; color:#475569; font-size:20px; padding:0 6px; line-height:1; }
.tab-arrow:hover { color:#94a3b8; }
.tab-bar { display:flex; overflow-x:auto; gap:7px; scrollbar-width:none; flex:1; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab { flex-shrink:0; border:none; border-radius:20px; padding:8px 14px; font-size:12px; font-weight:700; white-space:nowrap; }
.tab.on { background:#F5A623; color:#000; }
.tab.off { background:rgba(255,255,255,0.06); color:#475569; }
.content { flex:1; padding:20px; overflow-y:auto; }
.screen { display:none; }
.screen.active { display:block; }
.card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
.btn-back { background:rgba(255,255,255,0.07); border:none; color:#94a3b8; border-radius:8px; padding:6px 12px; font-size:13px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sit-btn { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px 10px; color:#cbd5e1; font-size:12px; font-weight:600; width:100%; }
.icon-btn { background:none; border:none; font-size:18px; padding:2px 4px; }
.loading-box { text-align:center; padding:48px 0; }
.stat-row { display:flex; justify-content:space-between; align-items:center; border-radius:14px; padding:16px 20px; margin-bottom:10px; background:rgba(255,255,255,0.04); }
.err { color:#ef4444; font-size:13px; text-align:center; margin-top:10px; }
.chat-win { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); border-radius:14px 14px 0 0; padding:14px 12px; height:320px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.chat-bar { display:flex; gap:8px; align-items:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); border-top:none; border-radius:0 0 14px 14px; padding:10px; }
.chat-input { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(78,205,196,0.2); border-radius:10px; padding:10px 13px; font-size:14px; color:#fff; outline:none; }
.send-btn { background:#4ECDC4; color:#000; border:none; border-radius:10px; padding:10px 16px; font-size:15px; font-weight:700; }
.send-btn:disabled { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.2); }
.bubble-row { display:flex; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row.bot { justify-content:flex-start; }
.mic-btn { width:44px; height:44px; border-radius:50%; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; border:2px solid #4ECDC4; background:rgba(78,205,196,0.08); color:#4ECDC4; }
.dots { display:flex; gap:5px; align-items:center; }
.dot { width:7px; height:7px; border-radius:50%; }
#login-screen { position:fixed; inset:0; background:#080810; display:flex; align-items:center; justify-content:center; z-index:999; padding:24px; }
.login-box { width:100%; max-width:360px; }
.login-input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:13px 16px; font-size:15px; color:#fff; outline:none; margin-bottom:10px; display:block; }
.login-input:focus { border-color:rgba(245,166,35,0.5); }
.login-btn { width:100%; background:#F5A623; color:#000; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:800; margin-bottom:10px; }
.login-toggle { width:100%; background:rgba(255,255,255,0.04); color:#94a3b8; border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:12px; font-size:13px; }
.login-err { color:#ef4444; font-size:13px; text-align:center; margin-bottom:10px; min-height:20px; }
@keyframes flipIn { from{transform:rotateY(90deg);opacity:0} to{transform:rotateY(0);opacity:1} }
.flashcard { background:linear-gradient(135deg,rgba(245,166,35,0.08),rgba(245,166,35,0.03)); border:1px solid rgba(245,166,35,0.2); border-radius:20px; padding:32px 24px; text-align:center; margin-bottom:16px; animation:flipIn 0.3s ease; cursor:pointer; }
@keyframes bounce { 0%,80%,100%{transform:scale(0.4);opacity:0.3} 40%{transform:scale(1);opacity:1} }
@keyframes ring { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)} 70%{box-shadow:0 0 0 8px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1 style="font-size:26px;font-weight:800;margin-bottom:4px;">Deutsch<span style="color:#F5A623;">Lernen</span></h1>
    <p style="font-size:11px;color:#334155;letter-spacing:2px;margin-bottom:28px;">GERMAN WITH AI</p>
    <div id="login-err" class="login-err"></div>
    <input id="login-user" class="login-input" placeholder="Username" type="text" autocomplete="username"/>
    <input id="login-pass" class="login-input" placeholder="Password" type="password" autocomplete="current-password"/>
    <button class="login-btn" id="login-btn" onclick="doAuth()">Iniciar sesion</button>
    <button class="login-toggle" onclick="toggleAuthMode()">No tienes cuenta? Registrate</button>
    <p id="auth-mode-lbl" style="text-align:center;font-size:11px;color:#334155;margin-top:10px;">Modo: Login</p>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div style="padding:18px 16px 0;display:flex;align-items:center;gap:10px;">
    <div>
      <h1 style="font-size:22px;font-weight:800;">Deutsch<span style="color:#F5A623;">Lernen</span></h1>
      <p style="font-size:10px;color:#334155;letter-spacing:2px;">GERMAN WITH AI</p>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div id="badge" style="display:none;background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.25);border-radius:20px;padding:4px 10px;">
        <span style="font-size:12px;color:#F5A623;">&#9733; <span id="badge-n">0</span></span>
      </div>
      <div id="user-chip" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:4px 10px 4px 12px;">
        <span id="user-lbl" style="font-size:12px;color:#94a3b8;"></span>
        <button onclick="doLogout()" title="Cerrar sesion" style="background:none;border:none;padding:0;display:flex;align-items:center;opacity:0.5;cursor:pointer;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.5'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div class="tab-nav">
    <button class="tab-arrow" onclick="scrollTabs(-1)">&#8249;</button>
    <div class="tab-bar" id="tabs"></div>
    <button class="tab-arrow" onclick="scrollTabs(1)">&#8250;</button>
  </div>
  <div class="content">
    <div id="s-frases" class="screen"></div>
    <div id="s-conversar" class="screen"></div>
    <div id="s-corrigeme" class="screen"></div>
    <div id="s-noentendi" class="screen"></div>
    <div id="s-flashcards" class="screen"></div>
    <div id="s-guardadas" class="screen"></div>
    <div id="s-resumen" class="screen"></div>
  </div>
</div>

<script>
// ── AI proxy ──────────────────────────────────────────────────────────────────
async function ai(system, messages) {
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({model:"mimo-v2-flash",max_tokens:1000,temperature:0.7,
      messages:[{role:"system",content:system}].concat(messages)})
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  if (!data.choices||!data.choices.length) throw new Error("Empty response");
  return data.choices[0].message.content;
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _deVoice = null;
function loadDeVoice() {
  _deVoice = window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");}) || null;
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadDeVoice;
  loadDeVoice();
}
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE";
  u.rate = 0.82;
  const voice = _deVoice || window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");});
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

// ── AssemblyAI ────────────────────────────────────────────────────────────────
async function transcribe(blob) {
  try {
    const up = await (await fetch("/api/upload",{method:"POST",body:blob})).json();
    const tx = await (await fetch("/api/transcript",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({audio_url:up.upload_url,language_code:"de"})})).json();
    for (let i=0;i<20;i++) {
      await new Promise(function(r){setTimeout(r,2000);});
      const p = await (await fetch("/api/transcript/"+tx.id)).json();
      if (p.status==="completed") return p.text||"";
      if (p.status==="error") return null;
    }
    return null;
  } catch(e){return null;}
}

// ── Mic ───────────────────────────────────────────────────────────────────────
let mr=null, chunks=[];
function makeMicBtn(color, cb) {
  const btn = document.createElement("button");
  btn.className="mic-btn";
  btn.style.borderColor=color||"#4ECDC4";
  btn.style.color=color||"#4ECDC4";
  btn.textContent="MIC";
  btn.onclick=async function(){
    if (mr&&mr.state==="recording") { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      mr=new MediaRecorder(stream);
      mr.ondataavailable=function(e){chunks.push(e.data);};
      mr.onstop=async function(){
        stream.getTracks().forEach(function(t){t.stop();});
        btn.textContent="..."; btn.style.borderColor="#64748b"; btn.style.color="#64748b"; btn.style.animation="none";
        const text = await transcribe(new Blob(chunks,{type:"audio/webm"}));
        btn.textContent="MIC"; btn.style.borderColor=color||"#4ECDC4"; btn.style.color=color||"#4ECDC4";
        if (text&&cb) cb(text);
      };
      mr.start();
      btn.textContent="STOP"; btn.style.borderColor="#ef4444"; btn.style.color="#ef4444"; btn.style.animation="ring 1.2s infinite";
    } catch(e){alert("Allow microphone access.");}
  };
  return btn;
}

function makeDots(color) {
  const d=document.createElement("div"); d.className="dots";
  [0,0.2,0.4].forEach(function(delay){
    const dot=document.createElement("div"); dot.className="dot";
    dot.style.background=color||"#4ECDC4";
    dot.style.animation="bounce 1.2s "+delay+"s infinite";
    d.appendChild(dot);
  });
  return d;
}

function mk(tag,text,style) {
  const el=document.createElement(tag);
  if (text) el.textContent=text;
  if (style) el.style.cssText=style;
  return el;
}

// ── State ─────────────────────────────────────────────────────────────────────
let authToken = localStorage.getItem("dl_token")||null;
let authUser  = localStorage.getItem("dl_user")||null;
let saved=[], chatLogs=[], sessionPhrases=0, sessionMinutes=0;
let chatHistory=[], chatScenario=null, currentTab="frases";
let flashIdx=0, guardadasTab="frases", isRegister=false;
let shownPhrases={}; // {topic: ["de phrase", ...]} — para no repetir en "Generar 5 mas"

// ── Auth ──────────────────────────────────────────────────────────────────────
function toggleAuthMode() {
  isRegister=!isRegister;
  document.getElementById("auth-mode-lbl").textContent=isRegister?"Modo: Registro":"Modo: Login";
  document.querySelector(".login-toggle").textContent=isRegister?"Ya tienes cuenta? Login":"No tienes cuenta? Registrate";
  document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";
}

async function doAuth() {
  const username=document.getElementById("login-user").value.trim();
  const password=document.getElementById("login-pass").value.trim();
  const errEl=document.getElementById("login-err");
  errEl.textContent="";
  if (!username||!password){errEl.textContent="Completa todos los campos.";return;}
  document.getElementById("login-btn").textContent="Cargando...";
  try {
    const res=await fetch(isRegister?"/api/register":"/api/login",{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const data=await res.json();
    if (data.error){errEl.textContent=data.error;document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";return;}
    authToken=data.token; authUser=data.username;
    localStorage.setItem("dl_token",authToken);
    localStorage.setItem("dl_user",authUser);
    if (data.data) applyServerData(data.data);
    showApp();
  } catch(e){errEl.textContent="Error: "+e.message;document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";}
}

async function doLogout() {
  saveChatLog();
  try {await fetch("/api/logout",{method:"POST",headers:{"x-token":authToken||""}});} catch(e){}
  authToken=null; authUser=null;
  saved=[]; chatLogs=[]; sessionPhrases=0; sessionMinutes=0; shownPhrases={};
  chatHistory=[]; chatScenario=null;
  localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
  document.getElementById("app").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("user-chip").style.display="none";
  document.getElementById("login-user").value="";
  document.getElementById("login-pass").value="";
  document.getElementById("login-btn").textContent="Iniciar sesion";
}

function applyServerData(data) {
  if (Array.isArray(data.saved)) saved=data.saved;
  if (Array.isArray(data.chatLogs)) chatLogs=data.chatLogs;
  if (data.totalPhrases) sessionPhrases=data.totalPhrases;
  if (data.totalMinutes) sessionMinutes=data.totalMinutes;
}

async function syncUp() {
  if (!authToken) return;
  try {
    await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json","x-token":authToken},
      body:JSON.stringify({saved,chatLogs,totalPhrases:sessionPhrases,totalMinutes:sessionMinutes})});
  } catch(e){}
}

function showApp() {
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="flex";
  const chip=document.getElementById("user-chip");
  chip.style.display="flex";
  document.getElementById("user-lbl").textContent=authUser;
  updateBadge();
  renderTabs();
  showScreen("frases");
}

function updateBadge() {
  document.getElementById("badge").style.display=saved.length?"block":"none";
  document.getElementById("badge-n").textContent=saved.length;
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
const TABS=[
  {id:"frases",label:"Frases"},
  {id:"conversar",label:"Conversar"},
  {id:"corrigeme",label:"Corrigeme"},
  {id:"noentendi",label:"No entendi"},
  {id:"flashcards",label:"Flashcards"},
  {id:"guardadas",label:"Guardadas"},
  {id:"resumen",label:"Resumen"}
];

function renderTabs() {
  const bar=document.getElementById("tabs");
  bar.innerHTML="";
  TABS.forEach(function(t){
    const btn=document.createElement("button");
    btn.className="tab "+(t.id===currentTab?"on":"off");
    btn.textContent=t.label;
    btn.onclick=function(){currentTab=t.id;renderTabs();showScreen(t.id);};
    bar.appendChild(btn);
  });
}

function scrollTabs(dir) {
  document.getElementById("tabs").scrollBy({left:dir*140,behavior:"smooth"});
}

function showScreen(id) {
  // Save chat if navigating away from conversar
  if (id !== "conversar" && chatScenario) saveChatLog();
  TABS.forEach(function(t){document.getElementById("s-"+t.id).classList.remove("active");});
  document.getElementById("s-"+id).classList.add("active");
  if(id==="frases") renderFrases();
  else if(id==="conversar") renderConversar();
  else if(id==="corrigeme") renderCorrigeme();
  else if(id==="noentendi") renderNoEntendi();
  else if(id==="flashcards") renderFlashcards();
  else if(id==="guardadas") renderGuardadas();
  else if(id==="resumen") renderResumen();
}

// ── FRASES ────────────────────────────────────────────────────────────────────
const SITS=["Mi trabajo en data","Viajes y Europa","Emociones","No entendi repite","Vida diaria","Con amigos","Pedir ayuda","Tecnologia y AI"];

function renderFrases() {
  const el=document.getElementById("s-frases");
  el.innerHTML="";
  el.appendChild(mk("p","Elige un tema:","color:#64748b;font-size:14px;margin-bottom:14px;"));
  const grid=document.createElement("div"); grid.className="grid2";
  SITS.forEach(function(s){
    const btn=document.createElement("button"); btn.className="sit-btn"; btn.textContent=s;
    btn.onclick=function(){loadPhrases(s);};
    grid.appendChild(btn);
  });
  el.appendChild(grid);
}

async function loadPhrases(sit) {
  const el=document.getElementById("s-frases");
  el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:14px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="Back";
  back.onclick=function(){ shownPhrases[sit]=[]; renderFrases(); };
  top.appendChild(back); top.appendChild(mk("span",sit,"font-size:13px;color:#e2e8f0;font-weight:600;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.className="loading-box";
  loading.appendChild(makeDots("#F5A623"));
  loading.appendChild(mk("p","Generando frases...","color:#64748b;font-size:13px;margin-top:12px;"));
  el.appendChild(loading);

  // Build exclusion list so AI doesn't repeat phrases
  const excluded = shownPhrases[sit] || [];
  const exclusionNote = excluded.length
    ? " Do NOT repeat any of these phrases already shown: "+JSON.stringify(excluded)+"."
    : "";

  try {
    const sys="You are a German language expert. Generate exactly 5 complete real German phrases for the given situation. Reply ONLY with a valid JSON array, no markdown: [{\"de\":\"German phrase\",\"es\":\"Spanish translation\",\"tip\":\"short tip\"}]. Level A2-B1."+exclusionNote;
    const text=await ai(sys,[{role:"user",content:"Situation: "+sit}]);
    const phrases=JSON.parse(text.replace(/```json|```/g,"").trim());
    sessionPhrases+=phrases.length;

    // Track shown phrases to avoid repetition
    if (!shownPhrases[sit]) shownPhrases[sit]=[];
    phrases.forEach(function(ph){ shownPhrases[sit].push(ph.de); });

    el.removeChild(loading);

    phrases.forEach(function(ph){
      const card=document.createElement("div"); card.className="card";
      const row=mk("div","","display:flex;justify-content:space-between;align-items:flex-start;gap:8px;");
      const de=mk("p",ph.de,"font-size:16px;font-weight:700;color:#fff;flex:1;line-height:1.4;");
      const btnRow=mk("div","","display:flex;gap:4px;");
      const playBtn=document.createElement("button"); playBtn.className="icon-btn"; playBtn.innerHTML="&#9654;"; playBtn.style.color="#94a3b8";
      playBtn.onclick=function(){speak(ph.de);};
      const isSaved=saved.some(function(x){return x.de===ph.de;});
      const starBtn=document.createElement("button"); starBtn.className="icon-btn"; starBtn.innerHTML="&#9733;";
      starBtn.style.color=isSaved?"#F5A623":"#334155";
      starBtn.onclick=function(){
        if(!saved.some(function(x){return x.de===ph.de;})){
          saved.push(ph); starBtn.style.color="#F5A623"; updateBadge(); syncUp();
        }
      };
      btnRow.appendChild(playBtn); btnRow.appendChild(starBtn);
      row.appendChild(de); row.appendChild(btnRow); card.appendChild(row);
      card.appendChild(mk("p",ph.es,"font-size:13px;color:#94a3b8;margin-top:5px;"));
      if(ph.tip) card.appendChild(mk("p","Tip: "+ph.tip,"font-size:12px;color:#475569;font-style:italic;margin-top:5px;"));
      el.appendChild(card);
    });

    const more=document.createElement("button");
    more.style.cssText="width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.12);color:#475569;border-radius:12px;padding:12px;font-size:13px;margin-top:4px;";
    more.textContent="+ Generar 5 mas";
    more.onclick=function(){loadPhrases(sit);};
    el.appendChild(more);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;"));
  }
}

// ── CONVERSAR ─────────────────────────────────────────────────────────────────
const SCENARIOS=["Talking with a German friend","You explain your data analyst job to a colleague","Asking for clarification when you dont understand","Talking about your day","Job interview in Germany","Talking about your trip to Europe"];

function renderConversar() {
  if (chatScenario) return; // chat in progress — keep existing UI
  const el=document.getElementById("s-conversar");
  el.innerHTML="";
  el.appendChild(mk("p","Elige un escenario:","color:#64748b;font-size:14px;margin-bottom:14px;"));
  SCENARIOS.forEach(function(s){
    const btn=document.createElement("button");
    btn.style.cssText="display:block;width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(78,205,196,0.15);border-radius:14px;padding:14px 16px;text-align:left;color:#e2e8f0;font-size:14px;font-weight:500;margin-bottom:10px;";
    btn.textContent=s;
    btn.onclick=function(){startChat(s);};
    el.appendChild(btn);
  });
}

// Idempotent save: updates today's entry for same scenario, or inserts new
function saveChatLog() {
  if (chatHistory.length>0&&chatScenario) {
    const today=new Date().toLocaleDateString("es-CO");
    const idx=chatLogs.findIndex(function(l){return l.scenario===chatScenario&&l.date===today;});
    if (idx>=0) {
      chatLogs[idx].messages=chatHistory.slice();
    } else {
      chatLogs.unshift({scenario:chatScenario,date:today,messages:chatHistory.slice()});
      if(chatLogs.length>10) chatLogs=chatLogs.slice(0,10);
    }
    syncUp();
  }
}

function addBubble(text, role) {

  wrapper.appendChild(bub); wrapper.appendChild(playBtn);

}

async function doSend(inp, sendBtn) {
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=""; inp.disabled=true; sendBtn.disabled=true;
  addBubble(msg,"user");
  chatHistory.push({role:"user",content:msg});
  const win=document.getElementById("chat-win");
  const typingRow=document.createElement("div"); typingRow.className="bubble-row bot";
  const typingBub=document.createElement("div");
  typingBub.style.cssText="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:16px 16px 16px 4px;padding:12px 16px;";
  typingBub.appendChild(makeDots("#4ECDC4"));
  typingRow.appendChild(typingBub);
  if(win){win.appendChild(typingRow);win.scrollTop=win.scrollHeight;}
  try {
    const sys="You are a German tutor playing the role of the OTHER person in this scenario: "+chatScenario+". The USER (Sebastian) is always the protagonist — a data analyst from Colombia learning German. YOU play the other person: friend, colleague, interviewer, etc. Reply in German at A2-B1 level. After your German reply add one line in parentheses: (Spanish translation). If Sebastian made German errors gently correct: Better: [correction]. Max 3-4 sentences. Keep the conversation going.";
    const reply=await ai(sys,chatHistory);
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble(reply,"bot");
    chatHistory.push({role:"assistant",content:reply});
  } catch(e){
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble("Error: "+e.message,"bot");
  }
  inp.disabled=false; sendBtn.disabled=false;
}

      el.innerHTML+="<div style='text-align:center;padding:40px 0;color:#475569;'><p style='font-size:36px;margin-bottom:12px;'>&#128172;</p><p>No hay chats guardados.</p><p style='font-size:13px;margin-top:8px;'>En Conversar, pulsa Guardar o Cambiar para guardar.</p></div>";
      return;
    }
    chatLogs.forEach(function(log){
      const card=document.createElement("div"); card.className="card"; card.style.cursor="pointer";
      const header=mk("div","","display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;");
      header.appendChild(mk("p",log.scenario,"font-size:14px;font-weight:700;color:#fff;flex:1;"));
      header.appendChild(mk("span",log.date,"font-size:11px;color:#475569;"));
      card.appendChild(header);
      card.appendChild(mk("p",log.messages.length+" mensajes","font-size:12px;color:#64748b;margin-bottom:10px;"));
      const msgs=document.createElement("div"); msgs.style.display="none";
      log.messages.forEach(function(m){
        const isUser=m.role==="user";
        const row=mk("div","","display:flex;justify-content:"+(isUser?"flex-end":"flex-start")+";margin-bottom:6px;");
        const bub=mk("p",m.content,"max-width:90%;padding:8px 12px;font-size:13px;border-radius:12px;line-height:1.5;white-space:pre-wrap;");
        bub.style.background=isUser?"rgba(78,205,196,0.1)":"rgba(255,255,255,0.06)";
        bub.style.border="1px solid "+(isUser?"rgba(78,205,196,0.2)":"rgba(255,255,255,0.08)");
        bub.style.color="#e2e8f0"; row.appendChild(bub); msgs.appendChild(row);
      });
      card.appendChild(msgs);
      let open=false;
      const toggle=mk("button","Ver conversacion","font-size:12px;color:#4ECDC4;background:none;border:none;padding:0;");
      toggle.onclick=function(e){e.stopPropagation();open=!open;msgs.style.display=open?"block":"none";toggle.textContent=open?"Ocultar":"Ver conversacion";};
      card.appendChild(toggle); el.appendChild(card);
    });
    const clearBtn=mk("button","Borrar historial","width:100%;margin-top:8px;font-size:12px;color:#ef4444;background:none;border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:8px;");
    clearBtn.onclick=function(){if(confirm("Borrar historial de chats?")){ chatLogs=[];syncUp();renderGuardadas();}};
    el.appendChild(clearBtn);
  }
}

// ── RESUMEN ───────────────────────────────────────────────────────────────────
function renderResumen() {
  const el=document.getElementById("s-resumen"); el.innerHTML="";
  el.appendChild(mk("h3","Tu progreso total","color:#fff;font-size:20px;margin-bottom:14px;"));
  [{label:"Frases exploradas",value:sessionPhrases,color:"#F5A623"},{label:"Frases guardadas",value:saved.length,color:"#F87171"},{label:"Minutos practicados",value:sessionMinutes,color:"#4ECDC4"},{label:"Chats guardados",value:chatLogs.length,color:"#A78BFA"}].forEach(function(s){
    const row=document.createElement("div"); row.className="stat-row"; row.style.borderColor=s.color+"20";
    row.appendChild(mk("span",s.label,"font-size:14px;color:#cbd5e1;"));
    row.appendChild(mk("span",String(s.value),"font-size:30px;font-weight:800;color:"+s.color+";"));
    el.appendChild(row);
  });
  const tip=mk("div","","background:rgba(78,205,196,0.07);border:1px solid rgba(78,205,196,0.18);border-radius:14px;padding:16px;");
  tip.appendChild(mk("p",sessionPhrases+saved.length+sessionMinutes===0?"Empieza a practicar y aqui veras tu progreso!":"Gut gemacht! La consistencia es la clave. Sigue adelante!","font-size:14px;color:#4ECDC4;"));
  el.appendChild(tip);
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&document.getElementById("login-screen").style.display!=="none") doAuth();
});

if(authToken) {
  fetch("/api/sync",{headers:{"x-token":authToken}}).then(function(r){return r.json();}).then(function(data){
    if(data.ok&&data.data) applyServerData(data.data);
    showApp();
  }).catch(function(){
    authToken=null; authUser=null;
    localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
  });
}
</script>
</body>
</html>
