<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschLernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#131313">
</head>
<body>

<!-- LOADING -->
<div id="loading-screen">
  <div class="loading-skel">
    <div class="sk-bar" style="width:40%;height:10px;"></div>
    <div class="sk-bar" style="width:90%;height:16px;"></div>
    <div class="sk-bar" style="width:70%;height:14px;"></div>
    <div class="sk-bar" style="width:50%;height:12px;"></div>
  </div>
  <div class="loading-text">Cargando...</div>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo">Deutsch<span>Lernen</span></div>
      <div class="login-subtitle">GERMAN WITH AI</div>
    </div>
    <div class="login-card">
      <div id="login-err" class="login-err"></div>
      <input id="login-user" class="login-input" placeholder="Username" type="text" autocomplete="username" aria-label="Usuario"/>
      <input id="login-pass" class="login-input" placeholder="Password" type="password" autocomplete="current-password" aria-label="Contraseña"/>
      <button class="login-btn" id="login-btn" onclick="doAuth()">Iniciar sesión</button>
      <button class="login-toggle" onclick="toggleAuthMode()">No tienes cuenta? Regístrate</button>
      <button class="login-toggle" id="reset-pw-btn" onclick="showResetPassword()" style="margin-top:6px;">¿Olvidaste tu contraseña?</button>
    </div>
  </div>
</div>

<!-- APP HEADER (full-width for desktop tab visibility) -->
<div id="app-header" style="display:none;">

  <!-- HEADER -->
  <div class="app-topbar" style="padding:20px 18px 0;display:flex;align-items:center;gap:10px;">
    <div class="brand-block">
      <h1 id="app-logo" style="font-size:22px;font-weight:900;letter-spacing:-0.03em;line-height:1;">
        Deutsch<span style="color:var(--gold-text);">Lernen</span>
      </h1>
      <p id="app-tagline" style="font-size:9px;color:var(--dim);letter-spacing:3px;font-family:var(--font-label);margin-top:2px;font-weight:600;">GERMAN WITH AI</p>
    </div>
    <div class="topbar-title" aria-live="polite">
      <h2 id="screen-title">Hoy</h2>
      <p id="screen-subtitle">Pro Plan</p>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <span id="sync-chip" style="display:none;font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;"><span id="sync-lbl"></span></span>
      <button id="level-pill" title="Tu nivel actual. Cámbialo en Ajustes." style="font-size:10px;font-weight:700;padding:3px 9px;border-radius:12px;border:1px solid rgba(var(--purple-rgb),0.3);background:rgba(var(--purple-rgb),0.08);color:var(--purple-text);cursor:default;white-space:nowrap;pointer-events:none;">A2–B1</button>
      <span id="tier-badge" style="display:none;font-size:10px;font-weight:800;letter-spacing:0.5px;padding:3px 9px;border-radius:12px;"></span>
      <div id="badge" style="display:none;background:rgba(255,185,85,0.1);border:1px solid rgba(255,185,85,0.25);border-radius:20px;padding:4px 11px;">
        <span style="font-size:12px;color:var(--gold-text);font-weight:700;">&#9733; <span id="badge-n">0</span></span>
      </div>
      <div id="user-chip" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 10px 5px 13px;">
        <span id="user-lbl" style="font-size:12px;color:var(--text2);font-weight:600;"></span>
        <button onclick="doLogout()" title="Cerrar sesion" class="logout-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div style="margin:12px 18px 0;height:1px;background:linear-gradient(90deg,rgba(255,185,85,0.2),rgba(93,217,208,0.1),transparent);"></div>

</div>

<!-- APP CONTENT (centered max-width) -->
<div id="app" style="display:none;">

  <!-- SCREENS -->
  <div class="content">
    <div id="subtab-bar" style="display:none"></div>
    <div id="s-hoy" class="screen"></div>
    <div id="s-practicar" class="screen"></div>
    <div id="s-frases" class="screen"></div>
    <div id="s-conversar" class="screen"></div>
    <div id="s-corrigeme" class="screen"></div>
    <div id="s-noentendi" class="screen"></div>
    <div id="s-lectura" class="screen"></div>
    <div id="s-dictado" class="screen"></div>
    <div id="s-shadowing" class="screen"></div>
    <div id="s-gramatica" class="screen"></div>
    <div id="s-casos" class="screen"></div>
    <div id="s-genero" class="screen"></div>
    <div id="s-conectores" class="screen"></div>
    <div id="s-tempus" class="screen"></div>
    <div id="s-conjugacion" class="screen"></div>
    <div id="s-preposiciones" class="screen"></div>
    <div id="s-perfekt" class="screen"></div>
    <div id="s-satzbau" class="screen"></div>
    <div id="s-adjektive" class="screen"></div>
    <div id="s-ndeklination" class="screen"></div>
    <div id="s-trennbare" class="screen"></div>
    <div id="s-flashcards" class="screen"></div>
    <div id="s-guardadas" class="screen"></div>
    <div id="s-resumen" class="screen"></div>
    <div id="s-leveltest" class="screen"></div>
    <div id="s-config" class="screen"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav"></div>
<!-- BOTTOM SHEET -->
<div id="sheet-overlay" style="display:none" onclick="hideNavSheet()"></div>
<div id="sheet-panel" style="display:none"></div>

<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/sync.js"></script>
<script src="js/srs.js"></script>
<script src="js/level.js"></script>
<script src="js/voice.js"></script>
<script src="js/nav.js"></script>
<script src="js/ui.js"></script>
<script src="js/screens/today.js"></script>
<script src="js/screens/practicar.js"></script>
<script src="js/screens/phrases.js"></script>
<script src="js/screens/conversation.js"></script>
<script src="js/screens/correct_me.js"></script>
<script src="js/screens/didnt_understand.js"></script>
<script src="js/screens/reading.js"></script>
<script src="js/screens/dictado.js"></script>
<script src="js/screens/shadowing.js"></script>
<script src="js/screens/grammar.js"></script>
<script src="js/screens/cases.js"></script>
<script src="js/screens/gender.js"></script>
<script src="js/screens/connectors.js"></script>
<script src="js/screens/tempus.js"></script>
<script src="js/screens/conjugacion.js"></script>
<script src="js/screens/preposiciones.js"></script>
<script src="js/screens/perfekt.js"></script>

<script src="js/screens/adjektive.js"></script>
<script src="js/screens/ndeklination.js"></script>
<script src="js/screens/trennbare.js"></script>
<script src="js/screens/flashcards.js"></script>
<script src="js/screens/saved.js"></script>
<script src="js/screens/summary.js"></script>
<script src="js/screens/leveltest.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/main.js"></script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){});});}</script>
</body>
</html>
