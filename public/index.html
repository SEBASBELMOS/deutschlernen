<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschLernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #F5A623;
  --teal: #4ECDC4;
  --red: #F87171;
  --purple: #A78BFA;
  --green: #4ade80;
  --bg: #07070f;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e2e8f0;
  --muted: #64748b;
  --dim: #334155;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 10%, rgba(245,166,35,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 90% 90%, rgba(78,205,196,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(167,139,250,0.02) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
button,input,textarea { font-family:'Inter',system-ui,sans-serif; cursor:pointer; }
#app {
  max-width:620px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  position:relative;
  z-index:1;
}

/* ── TAB NAV ─────────────────────────────────────────────────────────────── */
.tab-nav { display:flex; align-items:center; padding:12px 8px 0; gap:4px; }
.tab-arrow {
  flex-shrink:0;
  background:none;
  border:none;
  color:var(--muted);
  font-size:22px;
  padding:0 6px;
  line-height:1;
  transition:color 0.2s;
}
.tab-arrow:hover { color:#94a3b8; }
.tab-bar { display:flex; overflow-x:auto; gap:6px; scrollbar-width:none; flex:1; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0;
  border:none;
  border-radius:20px;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
  letter-spacing:0.01em;
}
.tab.on {
  background:var(--gold);
  color:#000;
  box-shadow:0 2px 14px rgba(245,166,35,0.4);
}
.tab.off {
  background:rgba(255,255,255,0.06);
  color:var(--muted);
}
.tab.off:hover { background:rgba(255,255,255,0.1); color:#94a3b8; }
.tab:active { transform:scale(0.95); }

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
.content { flex:1; padding:18px; overflow-y:auto; }
.screen { display:none; }
.screen.active {
  display:block;
  animation:screenIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes screenIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color:rgba(255,255,255,0.13); box-shadow:0 4px 24px rgba(0,0,0,0.2); }

/* ── COMMON BUTTONS ──────────────────────────────────────────────────────── */
.btn-back {
  background:rgba(255,255,255,0.07);
  border:none;
  color:#94a3b8;
  border-radius:10px;
  padding:7px 14px;
  font-size:13px;
  font-weight:600;
  transition:background 0.2s;
}
.btn-back:hover { background:rgba(255,255,255,0.12); }
.icon-btn { background:none; border:none; font-size:18px; padding:2px 4px; transition:transform 0.15s, opacity 0.15s; }
.icon-btn:hover { opacity:0.75; transform:scale(1.15); }

/* ── TOPIC GRID ──────────────────────────────────────────────────────────── */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sit-btn {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:18px 12px 14px;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  line-height:1.3;
}
.sit-btn:hover {
  background:rgba(245,166,35,0.07);
  border-color:rgba(245,166,35,0.25);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.sit-btn:active { transform:scale(0.97); }
.sit-icon { font-size:22px; line-height:1; }

/* ── LOADING ─────────────────────────────────────────────────────────────── */
.loading-box { text-align:center; padding:52px 0; }
.dots { display:flex; gap:6px; align-items:center; justify-content:center; }
.dot { width:8px; height:8px; border-radius:50%; }

/* ── STAT ROWS ───────────────────────────────────────────────────────────── */
.stat-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:16px;
  padding:18px 22px;
  margin-bottom:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:transform 0.2s;
}
.stat-row:hover { transform:translateX(2px); }

/* ── ERROR ───────────────────────────────────────────────────────────────── */
.err { color:#ef4444; font-size:13px; text-align:center; margin-top:10px; }

/* ── CHAT ────────────────────────────────────────────────────────────────── */
.chat-win {
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px 16px 0 0;
  padding:14px 12px;
  height:340px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.chat-bar {
  display:flex;
  gap:8px;
  align-items:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-top:none;
  border-radius:0 0 16px 16px;
  padding:10px;
}
.chat-input {
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(78,205,196,0.2);
  border-radius:10px;
  padding:10px 14px;
  font-size:14px;
  color:#fff;
  outline:none;
  transition:border-color 0.2s;
}
.chat-input:focus { border-color:rgba(78,205,196,0.5); }
.send-btn {
  background:var(--teal);
  color:#000;
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-size:16px;
  font-weight:800;
  transition:background 0.2s, transform 0.1s;
}
.send-btn:hover { background:#5dd8cf; }
.send-btn:active { transform:scale(0.93); }
.send-btn:disabled { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.2); }
.bubble-row { display:flex; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row.bot { justify-content:flex-start; }

/* ── MIC BUTTON ──────────────────────────────────────────────────────────── */
.mic-btn {
  width:44px; height:44px;
  border-radius:50%;
  font-size:9px;
  font-weight:800;
  letter-spacing:0.05em;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:2px solid var(--teal);
  background:rgba(78,205,196,0.08);
  color:var(--teal);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}

/* ── LOGIN SCREEN ────────────────────────────────────────────────────────── */
#login-screen {
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:24px;
}
#login-screen::before {
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 30% 20%, rgba(245,166,35,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 80%, rgba(78,205,196,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.login-box { width:100%; max-width:340px; position:relative; z-index:1; }
.login-logo-wrap {
  margin-bottom:32px;
}
.login-logo {
  font-size:32px;
  font-weight:900;
  letter-spacing:-0.02em;
  line-height:1;
  margin-bottom:6px;
}
.login-logo span { color:var(--gold); }
.login-subtitle {
  font-size:11px;
  color:var(--dim);
  letter-spacing:3px;
  font-weight:600;
}
.login-card {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:20px;
  padding:24px;
  backdrop-filter:blur(12px);
}
.login-input {
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  color:#fff;
  outline:none;
  margin-bottom:10px;
  display:block;
  transition:border-color 0.2s, background 0.2s;
}
.login-input:focus {
  border-color:rgba(245,166,35,0.6);
  background:rgba(255,255,255,0.08);
}
.login-btn {
  width:100%;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
  letter-spacing:0.01em;
  transition:background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow:0 4px 20px rgba(245,166,35,0.3);
}
.login-btn:hover { background:#f7b84b; box-shadow:0 6px 24px rgba(245,166,35,0.4); }
.login-btn:active { transform:scale(0.98); }
.login-toggle {
  width:100%;
  background:rgba(255,255,255,0.04);
  color:#94a3b8;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:12px;
  font-size:13px;
  font-weight:500;
  transition:background 0.2s;
}
.login-toggle:hover { background:rgba(255,255,255,0.08); }
.login-err {
  color:#ef4444;
  font-size:13px;
  text-align:center;
  margin-bottom:12px;
  min-height:18px;
  font-weight:500;
}

/* ── FLASHCARD ───────────────────────────────────────────────────────────── */
@keyframes flipIn { from{transform:rotateY(90deg) scale(0.95);opacity:0} to{transform:rotateY(0) scale(1);opacity:1} }
.flashcard {
  background:linear-gradient(135deg, rgba(245,166,35,0.09) 0%, rgba(245,166,35,0.03) 100%);
  border:1px solid rgba(245,166,35,0.2);
  border-radius:22px;
  padding:36px 28px;
  text-align:center;
  margin-bottom:16px;
  animation:flipIn 0.35s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
  transition:border-color 0.25s, box-shadow 0.25s, transform 0.15s;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.flashcard:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,0.35); }
.flashcard:active { transform:scale(0.98); }

/* ── SECTION HEADER ──────────────────────────────────────────────────────── */
.section-title {
  font-size:20px;
  font-weight:800;
  color:#fff;
  margin-bottom:4px;
  letter-spacing:-0.02em;
}
.section-sub {
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
  font-weight:500;
}

/* ── SCENARIO BUTTONS ────────────────────────────────────────────────────── */
.scenario-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(78,205,196,0.12);
  border-radius:14px;
  padding:14px 16px;
  text-align:left;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  margin-bottom:8px;
  transition:background 0.2s, border-color 0.2s, transform 0.15s;
}
.scenario-btn:hover {
  background:rgba(78,205,196,0.07);
  border-color:rgba(78,205,196,0.3);
  transform:translateX(3px);
}
.scenario-icon { font-size:20px; flex-shrink:0; }

/* ── ANIMATIONS ──────────────────────────────────────────────────────────── */
@keyframes bounce { 0%,80%,100%{transform:scale(0.4);opacity:0.3} 40%{transform:scale(1);opacity:1} }
@keyframes ring { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)} 70%{box-shadow:0 0 0 10px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo">Deutsch<span>Lernen</span></div>
      <div class="login-subtitle">GERMAN WITH AI</div>
    </div>
    <div class="login-card">
      <div id="login-err" class="login-err"></div>

      <input id="login-pass" class="login-input" placeholder="Password" type="password" autocomplete="current-password"/>
      <button class="login-btn" id="login-btn" onclick="doAuth()">Iniciar sesion</button>

</div>

<!-- APP -->
<div id="app" style="display:none;">

  <!-- HEADER -->
  <div style="padding:20px 18px 0;display:flex;align-items:center;gap:10px;">
    <div>
      <h1 style="font-size:22px;font-weight:900;letter-spacing:-0.03em;line-height:1;">
        Deutsch<span style="color:var(--gold);">Lernen</span>
      </h1>
      <p style="font-size:9px;color:var(--dim);letter-spacing:3px;margin-top:2px;font-weight:600;">GERMAN WITH AI</p>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div id="badge" style="display:none;background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.25);border-radius:20px;padding:4px 11px;">
        <span style="font-size:12px;color:var(--gold);font-weight:700;">&#9733; <span id="badge-n">0</span></span>
      </div>
      <div id="user-chip" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 10px 5px 13px;">
        <span id="user-lbl" style="font-size:12px;color:#94a3b8;font-weight:600;"></span>
        <button onclick="doLogout()" title="Cerrar sesion" style="background:none;border:none;padding:0;display:flex;align-items:center;opacity:0.45;cursor:pointer;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>

  </div>

  <!-- DIVIDER -->
  <div style="margin:12px 18px 0;height:1px;background:linear-gradient(90deg,rgba(245,166,35,0.2),rgba(78,205,196,0.1),transparent);"></div>

  <!-- TABS -->
  <div class="tab-nav">
    <button class="tab-arrow" onclick="scrollTabs(-1)">&#8249;</button>

    <div id="s-noentendi" class="screen"></div>

    <div id="s-guardadas" class="screen"></div>
    <div id="s-resumen" class="screen"></div>
  </div>
</div>

<script>
// ── AI proxy ──────────────────────────────────────────────────────────────────
async function ai(system, messages, maxTokens) {
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({model:"mimo-v2-flash",max_tokens:maxTokens||1000,temperature:0.7,
      messages:[{role:"system",content:system}].concat(messages)})
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  if (!data.choices||!data.choices.length) throw new Error("Empty response");
  return data.choices[0].message.content;
}

// Extrae y parsea el primer array JSON válido del texto del AI
function parseJSONArray(text) {
  const clean = text.replace(/```json|```/g,"").trim();
  // Busca el array aunque haya texto extra antes/después
  const match = clean.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("No JSON array found");
  try {
    return JSON.parse(match[0]);
  } catch(e) {
    // Intenta truncar en el último objeto completo si el JSON fue cortado
    const truncated = match[0].replace(/,?\s*\{[^}]*$/, "]");
    const parsed = JSON.parse(truncated);
    if (!parsed.length) throw new Error("JSON vacío después de reparar");
    return parsed;
  }
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _deVoice = null;
function loadDeVoice() {
  _deVoice = window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");}) || null;
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadDeVoice;
  loadDeVoice();
}
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = 0.82;
  const voice = _deVoice || window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");});
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

// ── AssemblyAI ────────────────────────────────────────────────────────────────
async function transcribe(blob, mimeType) {
  if (!blob || blob.size < 1000) throw new Error("Audio muy corto, habla un poco mas.");
  const headers = {"content-type": mimeType || "audio/webm"};

  const upRes = await fetch("/api/upload", {method:"POST", headers:headers, body:blob});
  const up = await upRes.json();
  if (!up.upload_url) throw new Error("Error al subir el audio: "+(up.error||JSON.stringify(up)));

  const txRes = await fetch("/api/transcript", {
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({audio_url:up.upload_url, language_code:"de"})
  });
  const tx = await txRes.json();
  if (!tx.id) throw new Error("Error al iniciar transcripcion: "+(tx.error||JSON.stringify(tx)));

  for (let i=0; i<25; i++) {
    await new Promise(function(r){setTimeout(r,2500);});
    const p = await (await fetch("/api/transcript/"+tx.id)).json();
    if (p.status==="completed") return p.text || "";
    if (p.status==="error") throw new Error("AssemblyAI error: "+(p.error||"desconocido"));
  }
  throw new Error("Timeout: la transcripcion tardo demasiado.");
}

// ── Mic ───────────────────────────────────────────────────────────────────────
let mr=null, chunks=[];

// Elige el mejor formato de audio soportado por este browser/dispositivo
function getBestMimeType() {
  const types = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4","audio/aac",""];
  for (let i=0; i<types.length; i++) {
    if (!types[i] || MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}

function makeMicBtn(color, cb) {
  const btn = document.createElement("button");
  btn.className="mic-btn";
  btn.style.borderColor=color||"#4ECDC4";
  btn.style.color=color||"#4ECDC4";
  btn.style.background="rgba("+hexToRgb(color||"#4ECDC4")+",0.08)";
  btn.textContent="MIC";
  btn.onclick=async function(){
    if (mr&&mr.state==="recording") { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      const mimeType = getBestMimeType();
      mr = mimeType ? new MediaRecorder(stream, {mimeType:mimeType}) : new MediaRecorder(stream);
      mr.ondataavailable=function(e){ if(e.data&&e.data.size>0) chunks.push(e.data); };
      mr.onstop=async function(){
        stream.getTracks().forEach(function(t){t.stop();});
        btn.textContent="..."; btn.style.borderColor="#64748b"; btn.style.color="#64748b"; btn.style.animation="none";
        const usedType = mr.mimeType || mimeType || "audio/webm";
        try {
          const blob = new Blob(chunks, {type:usedType});
          const text = await transcribe(blob, usedType);
          btn.textContent="MIC"; btn.style.borderColor=color||"#4ECDC4"; btn.style.color=color||"#4ECDC4";
          if (text && text.trim() && cb) cb(text.trim());
          else if (!text || !text.trim()) showMicError(btn, color, "No se detecto voz. Intenta de nuevo.");
        } catch(err) {
          showMicError(btn, color, err.message);
        }
      };
      mr.start(250); // timeslice de 250ms para capturar chunks continuamente
      btn.textContent="STOP"; btn.style.borderColor="#ef4444"; btn.style.color="#ef4444"; btn.style.animation="ring 1.2s infinite";
    } catch(e){
      alert("Permite el acceso al microfono en tu browser.");
    }
  };
  return btn;
}

function showMicError(btn, color, msg) {
  btn.textContent="MIC"; btn.style.borderColor=color||"#4ECDC4"; btn.style.color=color||"#4ECDC4";
  // Muestra el error de forma visible sin interrumpir el flujo
  const errEl = document.createElement("div");
  errEl.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e1e2e;border:1px solid rgba(239,68,68,0.4);color:#f87171;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:9999;max-width:300px;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,0.5);";
  errEl.textContent="🎤 "+msg;
  document.body.appendChild(errEl);
  setTimeout(function(){if(errEl.parentNode) errEl.parentNode.removeChild(errEl);}, 4000);
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return r+","+g+","+b;
}

function makeDots(color) {
  const d=document.createElement("div"); d.className="dots";
  [0,0.2,0.4].forEach(function(delay){
    const dot=document.createElement("div"); dot.className="dot";
    dot.style.background=color||"#4ECDC4";
    dot.style.animation="bounce 1.2s "+delay+"s infinite";
    d.appendChild(dot);
  });
  return d;
}

function mk(tag,text,style) {
  const el=document.createElement(tag);
  if (text) el.textContent=text;
  if (style) el.style.cssText=style;
  return el;
}

function toggleAuthMode() {
  isRegister=!isRegister;
  document.getElementById("auth-mode-lbl").textContent=isRegister?"Modo: Registro":"Modo: Login";
  document.querySelector(".login-toggle").textContent=isRegister?"Ya tienes cuenta? Login":"No tienes cuenta? Registrate";
  document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";
}

async function doAuth() {
  const username=document.getElementById("login-user").value.trim();
  const password=document.getElementById("login-pass").value.trim();
  const errEl=document.getElementById("login-err");
  errEl.textContent="";
  if (!username||!password){errEl.textContent="Completa todos los campos.";return;}
  document.getElementById("login-btn").textContent="Cargando...";
  try {
    const res=await fetch(isRegister?"/api/register":"/api/login",{
      method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const data=await res.json();
    if (data.error){errEl.textContent=data.error;document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";return;}
    authToken=data.token; authUser=data.username;
    localStorage.setItem("dl_token",authToken);
    localStorage.setItem("dl_user",authUser);
    if (data.data) applyServerData(data.data);
    showApp();
  } catch(e){errEl.textContent="Error: "+e.message;document.getElementById("login-btn").textContent=isRegister?"Crear cuenta":"Iniciar sesion";}
}

async function doLogout() {
  saveChatLog();
  try {await fetch("/api/logout",{method:"POST",headers:{"x-token":authToken||""}});} catch(e){}
  authToken=null; authUser=null;
  saved=[]; chatLogs=[]; sessionPhrases=0; sessionMinutes=0; shownPhrases={};
  chatHistory=[]; chatScenario=null;
  localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
  document.getElementById("app").style.display="none";
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("user-chip").style.display="none";
  document.getElementById("login-user").value="";
  document.getElementById("login-pass").value="";
  document.getElementById("login-btn").textContent="Iniciar sesion";
}

function applyServerData(data) {
  if (Array.isArray(data.saved)) saved=data.saved;
  if (Array.isArray(data.chatLogs)) chatLogs=data.chatLogs;
  if (data.totalPhrases) sessionPhrases=data.totalPhrases;
  if (data.totalMinutes) sessionMinutes=data.totalMinutes;
}

async function syncUp() {
  if (!authToken) return;
  try {
    await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json","x-token":authToken},
      body:JSON.stringify({saved,chatLogs,totalPhrases:sessionPhrases,totalMinutes:sessionMinutes})});
  } catch(e){}
}

function showApp() {
  document.getElementById("login-screen").style.display="none";

async function loadPhrases(sit) {
  const el=document.getElementById("s-frases"); el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="← Volver";
  back.onclick=function(){shownPhrases[sit]=[];renderFrases();};
  top.appendChild(back);
  top.appendChild(mk("span",sit,"font-size:13px;color:var(--text);font-weight:700;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.className="loading-box";
  const dotsWrap=mk("div","","display:flex;justify-content:center;margin-bottom:12px;");
  dotsWrap.appendChild(makeDots("#F5A623"));
  loading.appendChild(dotsWrap);
  loading.appendChild(mk("p","Generando frases...","color:var(--muted);font-size:13px;font-weight:500;"));
  el.appendChild(loading);

  // Solo las últimas 10 excluidas para no inflar el prompt
  const allExcluded=shownPhrases[sit]||[];
  const excluded=allExcluded.slice(-10);
  const exclusionNote=excluded.length?" Do NOT use these phrases: "+excluded.join(" | ")+".":"";

  try {
    const sys="You are a German language expert. Generate exactly 5 complete real German phrases for the given situation. Reply ONLY with a valid JSON array, no markdown, no extra text: [{\"de\":\"German phrase\",\"es\":\"Spanish translation\",\"tip\":\"short tip\"}]. Level A2-B1. Each tip must be under 8 words."+exclusionNote;
    const text=await ai(sys,[{role:"user",content:"Situation: "+sit}], 1400);
    const phrases=parseJSONArray(text);
    sessionPhrases+=phrases.length;
    if(!shownPhrases[sit]) shownPhrases[sit]=[];
    phrases.forEach(function(ph){shownPhrases[sit].push(ph.de);});
    el.removeChild(loading);

    phrases.forEach(function(ph,i){
      const card=document.createElement("div"); card.className="card";
      card.style.animation="fadeUp 0.25s "+( i*0.05)+"s both";
      const row=mk("div","","display:flex;justify-content:space-between;align-items:flex-start;gap:8px;");
      const de=mk("p",ph.de,"font-size:16px;font-weight:700;color:#fff;flex:1;line-height:1.45;letter-spacing:-0.01em;");
      const btnRow=mk("div","","display:flex;gap:2px;flex-shrink:0;");
      const playBtn=document.createElement("button"); playBtn.className="icon-btn"; playBtn.innerHTML="&#9654;"; playBtn.style.color="#64748b"; playBtn.style.fontSize="16px";
      playBtn.onclick=function(){speak(ph.de);};
      const isSaved=saved.some(function(x){return x.de===ph.de;});
      const starBtn=document.createElement("button"); starBtn.className="icon-btn"; starBtn.innerHTML="&#9733;"; starBtn.style.fontSize="18px";
      starBtn.style.color=isSaved?"#F5A623":"#334155";
      starBtn.onclick=function(){
        if(!saved.some(function(x){return x.de===ph.de;})){
          saved.push(ph); starBtn.style.color="#F5A623"; updateBadge(); syncUp();
        }
      };
      btnRow.appendChild(playBtn); btnRow.appendChild(starBtn);
      row.appendChild(de); row.appendChild(btnRow); card.appendChild(row);
      card.appendChild(mk("p",ph.es,"font-size:13px;color:#94a3b8;margin-top:5px;font-weight:500;"));
      if(ph.tip){
        const tipEl=mk("p","💡 "+ph.tip,"font-size:12px;color:#475569;font-style:italic;margin-top:6px;");
        card.appendChild(tipEl);
      }
      el.appendChild(card);
    });

    const more=document.createElement("button");
    more.style.cssText="width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.1);color:var(--muted);border-radius:14px;padding:13px;font-size:13px;font-weight:600;margin-top:4px;transition:background 0.2s,border-color 0.2s;";
    more.textContent="+ Generar 5 mas";
    more.onmouseover=function(){this.style.background="rgba(255,255,255,0.04)";this.style.borderColor="rgba(255,255,255,0.18)";};
    more.onmouseout=function(){this.style.background="transparent";this.style.borderColor="rgba(255,255,255,0.1)";};
    more.onclick=function(){loadPhrases(sit);};
    el.appendChild(more);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
  }
}

function saveChatLog() {
  if(chatHistory.length>0&&chatScenario){
    const today=new Date().toLocaleDateString("es-CO");
    const idx=chatLogs.findIndex(function(l){return l.scenario===chatScenario&&l.date===today;});
    if(idx>=0){chatLogs[idx].messages=chatHistory.slice();}
    else{chatLogs.unshift({scenario:chatScenario,date:today,messages:chatHistory.slice()});if(chatLogs.length>10)chatLogs=chatLogs.slice(0,10);}
    syncUp();

function startChat(scenario) {
  chatScenario=scenario; chatHistory=[];
  const el=document.getElementById("s-conversar"); el.innerHTML="";

function addBubble(text, role) {
  const win=document.getElementById("chat-win"); if(!win) return;
  const row=document.createElement("div"); row.className="bubble-row "+role;
  const wrapper=document.createElement("div");
  wrapper.style.cssText="display:flex;flex-direction:column;align-items:"+(role==="user"?"flex-end":"flex-start")+";gap:4px;max-width:86%;animation:fadeUp 0.2s ease;";
  const bub=document.createElement("div");
  bub.style.cssText="padding:10px 14px;font-size:14px;line-height:1.65;white-space:pre-wrap;max-width:100%;border-radius:"+(role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px")+";background:"+(role==="user"?"rgba(78,205,196,0.1)":"rgba(255,255,255,0.06)")+";border:1px solid "+(role==="user"?"rgba(78,205,196,0.2)":"rgba(255,255,255,0.08)")+";color:var(--text);font-weight:500;";
  bub.textContent=text;
  const playBtn=document.createElement("button");
  playBtn.style.cssText="background:none;border:none;font-size:11px;color:#475569;padding:0 4px;cursor:pointer;font-weight:600;transition:color 0.15s;";
  playBtn.textContent="▶ escuchar";
  playBtn.onmouseover=function(){this.style.color="#94a3b8";};
  playBtn.onmouseout=function(){this.style.color="#475569";};
  playBtn.onclick=function(){speak(text);};
  wrapper.appendChild(bub); wrapper.appendChild(playBtn);
  row.appendChild(wrapper); win.appendChild(row);
  win.scrollTop=win.scrollHeight;
}

async function doSend(inp, sendBtn) {
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=""; inp.disabled=true; sendBtn.disabled=true;
  addBubble(msg,"user"); chatHistory.push({role:"user",content:msg});
  const win=document.getElementById("chat-win");
  const typingRow=document.createElement("div"); typingRow.className="bubble-row bot";
  const typingBub=document.createElement("div");
  typingBub.style.cssText="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:16px 16px 16px 4px;padding:12px 16px;";
  typingBub.appendChild(makeDots("#4ECDC4")); typingRow.appendChild(typingBub);
  if(win){win.appendChild(typingRow);win.scrollTop=win.scrollHeight;}
  try {
    const sys="You are a German tutor playing the role of the OTHER person in this scenario: "+chatScenario+". The USER (Sebastian) is always the protagonist — a data analyst from Colombia learning German. YOU play the other person: friend, colleague, interviewer, etc. Reply in German at A2-B1 level. After your German reply add one line in parentheses: (Spanish translation). If Sebastian made German errors gently correct: Better: [correction]. Max 3-4 sentences. Keep the conversation going.";
    const reply=await ai(sys,chatHistory);
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble(reply,"bot"); chatHistory.push({role:"assistant",content:reply});
  } catch(e){
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble("Error: "+e.message,"bot");
  }
  inp.disabled=false; sendBtn.disabled=false;
}

async function doFix(ta, fixBtn, el) {
  const text=ta.value.trim(); if(!text) return;
  fixBtn.disabled=true; fixBtn.textContent=""; fixBtn.appendChild(makeDots("#F87171"));
  const old=el.querySelector("#fix-result"); if(old) el.removeChild(old);
  try {
    const sys="You are a friendly German corrector. Reply ONLY with valid JSON, no markdown: {\"correcto\":\"correct German phrase\",\"errores\":\"what was wrong in Spanish max 2 lines\",\"alternativa\":\"more natural version\",\"pronunciacion\":\"simplified pronunciation\"}";
    const reply=await ai(sys,[{role:"user",content:text}]);
    const r=JSON.parse(reply.replace(/```json|```/g,"").trim());
    const result=document.createElement("div"); result.id="fix-result"; result.style.marginTop="16px";

    const box1=document.createElement("div");
    box1.style.cssText="background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.18);border-radius:16px;padding:18px;margin-bottom:10px;";
    box1.appendChild(mk("p","✅  CORRECTO","font-size:10px;color:#4ade80;letter-spacing:2px;margin-bottom:8px;font-weight:700;"));
    const rowC=mk("div","","display:flex;justify-content:space-between;align-items:center;gap:8px;");
    rowC.appendChild(mk("p",r.correcto,"font-size:20px;font-weight:800;color:#fff;flex:1;letter-spacing:-0.01em;"));

async function doExplain(ta, btn, el) {
  const text=ta.value.trim(); if(!text) return;

    {label:"Frases exploradas", value:sessionPhrases, color:"#F5A623", icon:"📖"},
    {label:"Frases guardadas",  value:saved.length,   color:"#F87171", icon:"⭐"},
    {label:"Minutos practicados",value:sessionMinutes, color:"#4ECDC4", icon:"⏱️"},
    {label:"Chats guardados",   value:chatLogs.length, color:"#A78BFA", icon:"💬"}
  ].forEach(function(s,i){
    const row=document.createElement("div"); row.className="stat-row";
    row.style.borderColor=s.color+"22";
    row.style.animation="fadeUp 0.25s "+(i*0.07)+"s both";
    const left=mk("div","","display:flex;align-items:center;gap:10px;");
    left.appendChild(mk("span",s.icon,"font-size:20px;"));
    left.appendChild(mk("span",s.label,"font-size:14px;color:#cbd5e1;font-weight:600;"));
    const val=mk("span",String(s.value),"font-size:32px;font-weight:900;color:"+s.color+";letter-spacing:-0.03em;");
    row.appendChild(left); row.appendChild(val);
    el.appendChild(row);
  });

  const msg=sessionPhrases+saved.length+sessionMinutes===0
    ?"Empieza a practicar y aqui veras tu progreso!"
    :"Gut gemacht! La consistencia es la clave. Sigue adelante!";
  const tip=mk("div","","background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.18);border-radius:16px;padding:18px;margin-top:4px;display:flex;gap:12px;align-items:flex-start;");
  tip.appendChild(mk("span","💡","font-size:20px;flex-shrink:0;margin-top:1px;"));
  tip.appendChild(mk("p",msg,"font-size:14px;color:#4ECDC4;font-weight:600;line-height:1.55;"));
  el.appendChild(tip);
}

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&document.getElementById("login-screen").style.display!=="none") doAuth();
});

if(authToken) {
  fetch("/api/sync",{headers:{"x-token":authToken}}).then(function(r){return r.json();}).then(function(data){
    if(data.ok&&data.data) applyServerData(data.data);
    showApp();
  }).catch(function(){
    authToken=null; authUser=null;
    localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
  });
}
</script>
</body>
</html>
