<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschLernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #F5A623;
  --teal: #4ECDC4;
  --red: #F87171;
  --purple: #A78BFA;
  --green: #4ade80;
  --bg: #07070f;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e2e8f0;
  --muted: #64748b;
  --dim: #334155;
  /* ── Design tokens (SKILL_UI_UX) ── */
  --t-xs:11px; --t-sm:13px; --t-base:15px; --t-md:17px; --t-lg:20px; --t-xl:25px; --t-2xl:32px; --t-3xl:42px;
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;
  --e-1:0 1px 2px rgba(0,0,0,.3); --e-2:0 4px 16px rgba(0,0,0,.35); --e-3:0 12px 40px rgba(0,0,0,.5);
  --ease-out:cubic-bezier(.16,1,.3,1); --ease-in-out:cubic-bezier(.65,0,.35,1); --ease-spring:cubic-bezier(.34,1.56,.64,1);
  --d-fast:120ms; --d-base:220ms; --d-slow:380ms;
}
html.light-mode {
  --bg: #f4f6f9;
  --surface: rgba(0,0,0,0.03);
  --border: rgba(0,0,0,0.08);
  --text: #1e293b;
  --dim: #94a3b8;
}
html.light-mode body::before { opacity:0.35; }
html.light-mode .card { background:rgba(255,255,255,0.7); border-color:rgba(0,0,0,0.06); }
html.light-mode input,html.light-mode textarea,html.light-mode .chat-input { background:#fff;color:var(--text);border-color:rgba(0,0,0,0.1); }
html.light-mode .bubble-bot .bubble-content { background:rgba(0,0,0,0.05);border-color:rgba(0,0,0,0.08); }
html.light-mode .bubble-user .bubble-content { background:rgba(78,205,196,0.08);border-color:rgba(78,205,196,0.2); }
html.light-mode .sit-btn { background:rgba(0,0,0,0.03);border-color:rgba(0,0,0,0.08);color:var(--text); }
html.light-mode .sit-btn:hover { background:rgba(0,0,0,0.06); }
html.light-mode .send-btn { background:rgba(78,205,196,0.12);color:#4ECDC4; }
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 10%, rgba(245,166,35,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 90% 90%, rgba(78,205,196,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(167,139,250,0.02) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
button,input,textarea { font-family:'Inter',system-ui,sans-serif; cursor:pointer; }
#app {
  max-width:620px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  position:relative;
  z-index:1;
}
/* Wider on laptop/desktop — phone stays comfortable */
@media (min-width:760px)  { #app { max-width:760px; } }
@media (min-width:1024px) { #app { max-width:920px; } .content { padding:24px 28px; } }
@media (min-width:1440px) { #app { max-width:1040px; } }

/* Full-width header on desktop so all tabs are visible without scrolling */
#app-header { width:100%; }
@media (min-width:1024px) { #app-header .tab-arrow { display:none; } }
/* Mobile header: smaller logo, hide username (keep logout icon) to save space */
@media (max-width:560px) {
  #app-logo { font-size:17px; }
  #app-tagline { font-size:8px; letter-spacing:2px; }
  #user-lbl { display:none; }
  #user-chip { padding:5px 8px; }
}
/* Accessibility: honor reduced-motion across all animations (SKILL_UI_UX §3) */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ── BOTTOM NAV ──────────────────────────────────────────────────────────── */
#bottom-nav {
  position:fixed;bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;
  background:var(--surface);border-top:1px solid var(--border);
  padding:6px 0 env(safe-area-inset-bottom,4px);
  z-index:100;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.nav-item {
  flex:1;text-align:center;background:none;border:none;
  cursor:pointer;padding:4px 2px;
  transition:opacity 0.15s;
  -webkit-tap-highlight-color:transparent;
}
.nav-item:active .nav-item-icon{transform:scale(0.85);}
.nav-item-icon{font-size:20px;display:block;line-height:1.2;transition:transform 0.1s;}
.nav-item-lbl{font-size:9px;font-weight:600;display:block;margin-top:2px;color:var(--muted);}
.nav-item.active .nav-item-lbl{color:var(--gold);}
.nav-item.active .nav-item-icon{filter:drop-shadow(0 0 6px rgba(245,166,35,0.35));}
/* ── BOTTOM SHEET ────────────────────────────────────────────────────────── */
#sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:200;animation:fadeIn 0.15s ease;
}
#sheet-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--bg);border-radius:16px 16px 0 0;
  padding:20px 18px calc(env(safe-area-inset-bottom,10px) + 60px);
  z-index:201;
  animation:slideUp 0.25s var(--ease-out);
  max-height:70vh;overflow-y:auto;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.sheet-title{font-size:16px;font-weight:800;color:var(--text);}
.sheet-close{background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;padding:4px 8px;line-height:1;}
.sheet-btn{
  display:block;width:100%;text-align:left;
  padding:13px 14px;border-radius:12px;
  border:none;background:rgba(255,255,255,0.04);
  color:var(--text);font-size:14px;font-weight:600;
  cursor:pointer;margin-bottom:6px;
  transition:background 0.12s;
}
.sheet-btn:hover{background:rgba(255,255,255,0.08);}
.sheet-btn:active{transform:scale(0.98);background:rgba(255,255,255,0.1);}
.sheet-btn.active{color:var(--gold);box-shadow:inset 3px 0 0 var(--gold);font-weight:800;}
.light-mode .sheet-btn{background:rgba(0,0,0,0.04);}
.light-mode .sheet-btn:hover{background:rgba(0,0,0,0.08);}
.light-mode #sheet-panel{border:1px solid rgba(0,0,0,0.08);}
/* ── PADDING para que el contenido no quede detras del bottom nav ────────── */
#app { padding-bottom:64px; }

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
.content { flex:1; padding:18px; overflow-y:auto; }
.screen { display:none; }
.screen.active {
  display:block;
  /* opacity-only: el movimiento lo maneja el View Transition (evita el doble-slide) */
  animation:screenIn var(--d-base) var(--ease-out);
}
@keyframes screenIn {
  from { opacity:0; }
  to   { opacity:1; }
}
::view-transition-old(root),
::view-transition-new(root) {
  animation-duration:var(--d-base);
  animation-timing-function:var(--ease-out);
}
::view-transition-old(root) { animation-name:fadeSlideOut; }
::view-transition-new(root) { animation-name:fadeSlideIn; }
@keyframes fadeSlideOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-3px)} }
@keyframes fadeSlideIn  { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

/* ── CELEBRATIONS ─────────────────────────────────────────────────────────── */
@keyframes celebratePop {
  0%   { transform:scale(1); }
  40%  { transform:scale(1.08); }
  100% { transform:scale(1); }
}
@keyframes celebrateFlash {
  0%   { box-shadow:0 0 0 0 rgba(74,222,128,0.5); }
  70%  { box-shadow:0 0 0 12px rgba(74,222,128,0); }
  100% { box-shadow:0 0 0 0 rgba(74,222,128,0); }
}
@keyframes counterPop {
  0%   { transform:scale(1); }
  50%  { transform:scale(1.25); color:#F5A623; }
  100% { transform:scale(1); }
}
@keyframes flameGrow {
  0%   { transform:scale(1); }
  50%  { transform:scale(1.25) rotate(5deg); }
  100% { transform:scale(1); }
}
@keyframes winPop {
  0%   { transform:scale(0.85); opacity:0; }
  60%  { transform:scale(1.04); }
  100% { transform:scale(1); opacity:1; }
}
@media (prefers-reduced-motion:reduce) {
  @keyframes celebratePop   { 0%,100%{transform:none} }
  @keyframes celebrateFlash { 0%,100%{box-shadow:none} }
  @keyframes counterPop     { 0%,100%{transform:none} }
  @keyframes flameGrow      { 0%,100%{transform:none} }
  @keyframes winPop         { 0%,100%{transform:none;opacity:1} }
}

/* ── UTILITY CLASSES ───────────────────────────────────────────────────────── */
.surface-modal { position:fixed;inset:0;z-index:9002;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:24px; }
.surface-modal.post { background:rgba(6,6,14,0.85);backdrop-filter:blur(8px);z-index:9000;align-items:flex-start;padding:24px 14px;overflow-y:auto; }
.modal-box { background:#1a1a2e;border:1px solid rgba(255,255,255,0.1);border-radius:18px;padding:24px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,0.6); }
.modal-box.post { background:#0c0c18;border-color:rgba(245,166,35,0.25);max-width:560px;margin-top:30px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,0.5); }

.btn-solid { border:none;border-radius:10px;padding:10px;font-size:14px;font-weight:800;transition:background 0.2s,transform 0.1s,box-shadow 0.2s;cursor:pointer; }
.btn-solid:active { transform:scale(0.97); }
.btn-solid.gold { background:var(--gold);color:#000; }
.btn-solid.gold:hover { background:#f7b84b; }
.btn-solid.red { background:#F87171;color:#000; }
.btn-solid.red:hover { background:#fa8585; }
.btn-solid.teal { background:#4ECDC4;color:#000; }
.btn-solid.teal:hover { background:#5dd8cf; }
.btn-solid.purple { background:#A78BFA;color:#000; }
.btn-solid.purple:hover { background:#b69cff; }

.btn-ghost { background:rgba(255,255,255,0.06);border:none;color:#94a3b8;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;transition:background 0.2s;cursor:pointer; }
.btn-ghost:hover { background:rgba(255,255,255,0.1); }

.bubble-play-btn { background:none;border:none;font-size:11px;color:#475569;padding:0 4px;cursor:pointer;font-weight:600;transition:color 0.15s; }
.bubble-play-btn:hover { color:#94a3b8; }
.bubble-save-btn { background:none;border:none;font-size:11px;color:#F5A623;padding:0 4px;cursor:pointer;font-weight:600;transition:color 0.15s; }
.bubble-save-btn:hover { color:#f7b84b; }

.lectura-topic-btn { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#cbd5e1;border-radius:var(--r-pill,999px);padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s; }
.lectura-topic-btn:hover { border-color:rgba(167,139,250,0.4);color:var(--text); }

.gen-btn-teal { background:rgba(78,205,196,0.08);border:1px solid rgba(78,205,196,0.2);color:#4ECDC4; }
.gen-btn-teal:hover { background:rgba(78,205,196,0.15); }
.gen-btn-muted { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#94a3b8; }
.gen-btn-muted:hover { background:rgba(255,255,255,0.08); }

.lectura-save-btn { width:100%;background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.3);color:#F5A623;border-radius:var(--r-pill,999px);padding:10px;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.2s; }
.lectura-save-btn:hover { background:rgba(245,166,35,0.2); }

.cat-edit-btn { background:none;border:none;font-size:12px;cursor:pointer;padding:0;opacity:0.5;transition:opacity 0.15s; }
.cat-edit-btn:hover { opacity:1; }

.btn-danger { background:none;border:1px solid rgba(239,68,68,0.25);color:#ef4444;border-radius:10px;padding:9px;font-weight:600;font-size:14px;transition:background 0.2s;cursor:pointer; }
.btn-danger:hover { background:rgba(239,68,68,0.06); }

.input-field { width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 13px;font-size:14px;color:var(--text);outline:none;font-family:inherit; }
.input-field:focus { border-color:rgba(245,166,35,0.5); }

.hover-lift { transition:transform 0.15s var(--ease-out),box-shadow 0.2s;cursor:pointer; }
.hover-lift:hover { transform:scale(1.015);box-shadow:0 8px 32px rgba(245,166,35,0.15); }
.hover-lift:active { transform:scale(0.98); }

.hover-glow { transition:all 0.15s var(--ease-out); }
.hover-glow:hover { box-shadow:0 0 12px var(--btn-color);background:var(--btn-bg);border-color:var(--btn-border); }
.hover-glow:active { transform:scale(0.97) !important; }

.result-box { border-radius:16px;padding:18px;margin-bottom:10px; }
.result-box.green { background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.18); }
.result-box.red { background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.18); }
.result-box.purple { background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.18); }
.result-box.dark { background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08); }
.result-box.teal { background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.18); }
.result-box.gold { background:rgba(245,166,35,0.06);border:1px solid rgba(245,166,35,0.18); }
.result-box.surface { background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px; }

.text-muted { color:var(--muted);font-size:12px;font-weight:500; }
.chip { display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px; }

.logout-btn { background:none;border:none;padding:0;display:flex;align-items:center;opacity:0.45;cursor:pointer;transition:opacity 0.2s; }
.logout-btn:hover { opacity:1; }
.logout-btn svg { width:15px;height:15px; }

.reset-btn { width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;border-radius:12px;padding:11px;font-size:13px;font-weight:600;transition:background 0.2s;cursor:pointer; }
.reset-btn:hover { background:rgba(255,255,255,0.08); }

.more-btn { width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.1);color:var(--muted);border-radius:14px;padding:13px;font-size:13px;font-weight:600;margin-top:4px;transition:background 0.2s,border-color 0.2s;cursor:pointer; }
.more-btn:hover { background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.18); }

.stat-row-bg { background:rgba(255,255,255,0.03); }
.stat-row-hover:hover { background:rgba(255,255,255,0.03); }

.pill-btn { font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--muted);cursor:pointer;transition:all 0.15s; }
.pill-btn.on { background:#fff;color:#000;border-color:var(--text); }

.grade-btn { border-radius:12px;padding:10px 6px;font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;transition:background 0.15s,border-color 0.15s;cursor:pointer; }

.fix-btn-lg { width:100%;color:#000;border:none;border-radius:14px;padding:14px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:0.01em;transition:background 0.2s,transform 0.1s,box-shadow 0.2s;cursor:pointer; }
.fix-btn-lg:active { transform:scale(0.97); }
.fix-btn-lg.red { background:#F87171;box-shadow:0 4px 16px rgba(248,113,113,0.3); }
.fix-btn-lg.red:hover { background:#fa8585;box-shadow:0 6px 20px rgba(248,113,113,0.4); }
.fix-btn-lg.teal { background:#4ECDC4;box-shadow:0 4px 16px rgba(78,205,196,0.3); }
.fix-btn-lg.teal:hover { background:#5dd8cf;box-shadow:0 6px 20px rgba(78,205,196,0.4); }

.send-btn-flat { width:100%;color:#000;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;box-shadow:0 4px 16px rgba(78,205,196,0.3);margin-bottom:12px; }
.check-btn-flat { flex:1;color:#000;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;box-shadow:0 4px 14px rgba(245,166,35,0.3); }
.gen-btn { width:100%;border-radius:var(--r-md,12px);padding:12px;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.2s;margin-bottom:10px; }

.info-chip { background:rgba(78,205,196,0.1);border:1px solid rgba(78,205,196,0.25);color:#4ECDC4;border-radius:10px;padding:6px 13px;font-size:12px;font-weight:700; }

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color:rgba(255,255,255,0.13); box-shadow:0 4px 24px rgba(0,0,0,0.2); }

/* ── COMMON BUTTONS ──────────────────────────────────────────────────────── */
.btn-back {
  background:rgba(255,255,255,0.07);
  border:none;
  color:#94a3b8;
  border-radius:10px;
  padding:7px 14px;
  font-size:13px;
  font-weight:600;
  transition:background 0.2s;
}
.btn-back:hover { background:rgba(255,255,255,0.12); }
.btn-back:active { transform:scale(.97); }
.icon-btn { background:none; border:none; font-size:18px; padding:2px 4px; transition:transform 0.15s, opacity 0.15s; }
.icon-btn:hover { opacity:0.75; transform:scale(1.15); }
.icon-btn:active { transform:scale(.9); }

/* ── TOPIC GRID ──────────────────────────────────────────────────────────── */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sit-btn {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:18px 12px 14px;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  line-height:1.3;
}
.sit-btn:hover {
  background:rgba(245,166,35,0.07);
  border-color:rgba(245,166,35,0.25);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.sit-btn:active { transform:scale(0.97); }
.sit-icon { font-size:22px; line-height:1; }

/* ── LOADING ─────────────────────────────────────────────────────────────── */
.loading-box { text-align:center; padding:52px 0; }
.dots { display:flex; gap:6px; align-items:center; justify-content:center; }
.dot { width:8px; height:8px; border-radius:50%; }

/* ── STAT ROWS ───────────────────────────────────────────────────────────── */
.stat-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:16px;
  padding:18px 22px;
  margin-bottom:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:transform 0.2s;
}
.stat-row:hover { transform:translateX(2px); }

/* ── ERROR ───────────────────────────────────────────────────────────────── */
.err { color:#ef4444; font-size:13px; text-align:center; margin-top:10px; }

/* ── CHAT ────────────────────────────────────────────────────────────────── */
.chat-win {
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px 16px 0 0;
  padding:14px 12px;
  height:max(200px,40vh);
  max-height:55vh;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.08) transparent;

/* ── CASOS (4-case trainer, dark-adapted) ───────────────────────────────────── */

<script>
// ── AI proxy ──────────────────────────────────────────────────────────────────
async function ai(system, messages, maxTokens) {
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({model:"mimo-v2-flash",max_tokens:maxTokens||1000,temperature:0.7,
      messages:[{role:"system",content:system}].concat(messages)})
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  if (!data.choices||!data.choices.length) throw new Error("Empty response");
  return data.choices[0].message.content;
}

// Extrae y parsea el primer array JSON válido del texto del AI
function parseJSONArray(text) {
  const clean = text.replace(/```json|```/g,"").trim();
  // Busca el array aunque haya texto extra antes/después
  const match = clean.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("No JSON array found");
  try {
    return JSON.parse(match[0]);
  } catch(e) {
    // Intenta truncar en el último objeto completo si el JSON fue cortado
    const truncated = match[0].replace(/,?\s*\{[^}]*$/, "]");
    const parsed = JSON.parse(truncated);
    if (!parsed.length) throw new Error("JSON vacío después de reparar");
    return parsed;
  }
}

// ── Namespaced State ──────────────────────────────────────────────────────────
const state = {
  app:{}, session:{}, flashcards:{}, guardadas:{},
  chat:{}, lectura:{}, dictado:{}, grammar:{}, casos:{}
};

// ── TTS ───────────────────────────────────────────────────────────────────────
state.app._deVoice = null;
function loadDeVoice() {
  const voices = window.speechSynthesis.getVoices();
  // Prioriza una voz alemana real: de-DE exacta → cualquier de* → null
  state.app._deVoice = voices.find(function(v){return /^de[-_]DE/i.test(v.lang);})

// ── AssemblyAI ────────────────────────────────────────────────────────────────
async function transcribe(blob, mimeType) {
  if (!blob || blob.size < 1000) throw new Error("Audio muy corto, habla un poco mas.");
  const headers = {"content-type": mimeType || "audio/webm"};

  const upRes = await fetch("/api/upload", {method:"POST", headers:headers, body:blob});
  const up = await upRes.json();
  if (!up.upload_url) throw new Error("Error al subir el audio: "+(up.error||JSON.stringify(up)));

  const txRes = await fetch("/api/transcript", {
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({audio_url:up.upload_url, language_code:"de"})
  });
  const tx = await txRes.json();
  if (!tx.id) throw new Error("Error al iniciar transcripcion: "+(tx.error||JSON.stringify(tx)));

  for (let i=0; i<25; i++) {
    await new Promise(function(r){setTimeout(r,2500);});
    const p = await (await fetch("/api/transcript/"+tx.id)).json();
    if (p.status==="completed") return p.text || "";
    if (p.status==="error") throw new Error("AssemblyAI error: "+(p.error||"desconocido"));
  }
  throw new Error("Timeout: la transcripcion tardo demasiado.");
}

function renderPronScore(host, target, transcript, color){

function hexToRgb(hex) {
  if(typeof hex!=="string") return "0,0,0";
  hex=hex.replace("#","");
  if(!/^[0-9a-f]{6}$/i.test(hex)){
    if(/^[0-9a-f]{3}$/i.test(hex)) hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    else return "0,0,0";
  }
  const r=parseInt(hex.slice(0,2),16), g=parseInt(hex.slice(2,4),16), b=parseInt(hex.slice(4,6),16);
  return r+","+g+","+b;
}

function todayKey(){
  const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
function addDays(dateStr, n){
  const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
const BOX_INTERVALS=[0,1,3,7,14,30];
function ensureSrsFields(ph){
  if(typeof ph.box!=="number") ph.box=0;
  if(!ph.nextReview) ph.nextReview=todayKey();
  if(typeof ph.lapses!=="number") ph.lapses=0;
  if(!ph.added) ph.added=new Date().toISOString();
  if(!ph.source) ph.source="manual";
  if(typeof ph.category!=="string") ph.category="";
  return ph;
}
function srsUpdate(ph, grade){
  // grade: "fail" | "hard" | "good" | "easy"
  ensureSrsFields(ph);
  if(grade==="fail"){ ph.box=0; ph.lapses=(ph.lapses||0)+1; }
  else if(grade==="hard"){ /* same box */ }
  else if(grade==="good"){ ph.box=Math.min(5, ph.box+1); }
  else if(grade==="easy"){ ph.box=Math.min(5, ph.box+2); }
  const interval=BOX_INTERVALS[ph.box]||0;
  ph.nextReview=addDays(todayKey(), interval);
  ph.lastReviewed=new Date().toISOString();
  return ph;
}
function logActivity(kind, amount){
  // kind: "minutes" | "phrasesReviewed" | "drillsDone"
  const k=todayKey();
  if(!state.session.dailyLog[k]) state.session.dailyLog[k]={minutes:0,phrasesReviewed:0,drillsDone:0};
  state.session.dailyLog[k][kind]=(state.session.dailyLog[k][kind]||0)+(amount||1);

  if(state.session.errorJournal.length>200) state.session.errorJournal=state.session.errorJournal.slice(0,200);

function computeStreak(){
  let streak=0; let cursor=todayKey();
  // If today has activity, count it; else start from yesterday
  const todayHas=state.session.dailyLog[cursor]&&(state.session.dailyLog[cursor].minutes>0||state.session.dailyLog[cursor].phrasesReviewed>0||state.session.dailyLog[cursor].drillsDone>0);
  if(!todayHas){ cursor=addDays(cursor,-1); }
  for(let i=0;i<400;i++){
    const e=state.session.dailyLog[cursor];
    if(e&&(e.minutes>0||e.phrasesReviewed>0||e.drillsDone>0)){ streak++; cursor=addDays(cursor,-1); }
    else break;
  }
  return streak;
}
function weeklyMinutes(){

  for(let i=0;i<7;i++){
    const e=state.session.dailyLog[cursor]; if(e) sum+=(e.minutes||0);

function reviewDueCount(){

function computeLevelProgress(){
  var saved=state.session.saved, slen=saved.length;
  if(!slen) return 0;
  // Vocabulary depth (40%) — words in box 2+ are "learning", cap at 400 for B1
  var effectiveVocab=0, totalBox=0;
  saved.forEach(function(p){
    ensureSrsFields(p);
    var b=p.box||0; totalBox+=b;
    if(b>=2) effectiveVocab++;
  });
  var vocabScore=Math.min(effectiveVocab/400,1)*40;
  // Grammar mastery (25%) — average accuracy across all topics
  var gStats=state.grammar.grammarStats||{}, gramSum=0, gramCount=0;
  Object.keys(gStats).forEach(function(k){
    var s=gStats[k];
    if(s.right+s.wrong>0){gramSum+=s.right/(s.right+s.wrong);gramCount++;}
  });
  var gramScore=gramCount>0?(gramSum/GRAMMAR_TOPICS.length)*25:0;
  // SRS retention (20%) — avg box weighted by volume
  var avgBox=slen>0?totalBox/slen:0;
  var srsScore=(avgBox/5)*Math.min(slen/50,1)*20;
  // Consistency (15%) — streak + weekly reviews
  var str=computeStreak();
  var streakScore=Math.min(str/21,1)*8;
  var weekReviews=0;
  for(var i=0;i<7;i++){
    var d=addDays(todayKey(),-i);
    weekReviews+=(state.session.dailyLog[d]&&state.session.dailyLog[d].phrasesReviewed)||0;
  }
  var reviewScore=Math.min(weekReviews/100,1)*7;
  return Math.min(100,Math.round(vocabScore+gramScore+srsScore+streakScore+reviewScore));
}
function getStudyRecommendation(){

    ensureSrsFields(p);
    var b=p.box||0; totalBox+=b;
    if(b>=2) effectiveVocab++;

  var gramPct=gramCount>0?gramSum/GRAMMAR_TOPICS.length:0;
  var avgBox=slen>0?totalBox/slen:0;
  var srsPct=(avgBox/5)*Math.min(slen/50,1);
  var str=computeStreak();
  var weekReviews=0;
  for(var i=0;i<7;i++){var d=addDays(todayKey(),-i);weekReviews+=(state.session.dailyLog[d]&&state.session.dailyLog[d].phrasesReviewed)||0;}
  var consistencyPct=Math.min(str/21,1)*0.53+Math.min(weekReviews/100,1)*0.47;
  var scores=[
    {key:"vocab", pct:vocabPct, max:400, label:"Vocabulario", icon:"📖", color:"#F5A623",
     msg: effectiveVocab<400 ? "Te faltan "+(400-effectiveVocab)+" palabras en caja 2+ para B1. Guardá y repasá 10 por d\u00eda." : null},
    {key:"grammar", pct:gramPct, max:GRAMMAR_TOPICS.length, label:"Gram\u00e1tica", icon:"📐", color:"#A78BFA",
     msg: gramCount===0 ? "Todav\u00eda no practicaste gram\u00e1tica. Hac\u00e9 un drill hoy." : null},
    {key:"srs", pct:srsPct, max:1, label:"Retenci\u00f3n SRS", icon:"🔄", color:"#4ECDC4",

     msg: str<5 ? "Tu racha es corta. Intent\u00e1 5 min por d\u00eda para mantenerla." : weekReviews<50 ? "Tus revisiones semanales son bajas. Aument\u00e1 el ritmo." : null}
  ];
  // Fill grammar specific message
  if(gramCount===0){
    scores[1].msg="Todav\u00eda no practicaste gram\u00e1tica. Hac\u00e9 un drill de Art\u00edculos hoy.";
  } else {
    var worstKey=null, worstAcc=1;
    Object.keys(gStats).forEach(function(k){
      var s=gStats[k];
      if(s.right+s.wrong===0){worstKey=k;worstAcc=0;}
      else{var acc=s.right/(s.right+s.wrong);if(acc<worstAcc){worstKey=k;worstAcc=acc;}}
    });
    var tname=({articles:"Art\u00edculos",perfekt:"Perfekt",wortstellung:"Orden",adjendings:"Adjetivos",separable:"Separables",praeteritum:"Pr\u00e4teritum",conectores:"Conectores",conjugacion:"Conjugaci\u00f3n",konjunktiv2:"Konjunktiv II"})[worstKey]||worstKey;
    scores[1].msg="Tu punto d\u00e9bil es Gram\u00e1tica: **"+tname+"**. Practicalo hoy \u2192 +4%.";
  }
  // Elegir el más débil QUE tenga un consejo accionable (no solo el más débil a secas)
  scores.sort(function(a,b){return a.pct-b.pct;});
  var weakest=null;
  for(var j=0;j<scores.length;j++){ if(scores[j].msg && scores[j].pct<0.8){ weakest=scores[j]; break; } }
  return weakest;
}
function getContextualTip(){
  // Based on real user data, returns a tip object or null
  var saved=state.session.saved;
  // 1. High-lapse words (≥3 lapses) — most actionable
  var highLapse=saved.filter(function(p){return (p.lapses||0)>=3;}).sort(function(a,b){return (b.lapses||0)-(a.lapses||0);});
  if(highLapse.length){
    var w=highLapse[0];
    return {icon:"\ud83d\udd01",msg:"Te cuesta recordar <b>"+w.de+"</b> ("+w.es+")<br><span style='font-size:11px;color:var(--muted);'>Lleva "+w.lapses+" fallos. Prest\u00e1 atenci\u00f3n extra al repasarla.</span>",color:"#F87171"};
  }
  // 2. Weak grammar topic (accuracy < 50%)
  var gStats=state.grammar.grammarStats||{};
  var weakTopics=Object.keys(gStats).filter(function(k){
    var s=gStats[k]; if(!s.right&&!s.wrong) return true;
    return s.right/(s.right+s.wrong)<0.5;
  }).map(function(k){
    var s=gStats[k];
    var total=s.right+s.wrong;
    return {key:k,acc:total?s.right/total:0};
  }).sort(function(a,b){return a.acc-b.acc;});
  if(weakTopics.length){
    var tname=({articles:"Art\u00edculos",perfekt:"Perfekt",wortstellung:"Orden",adjendings:"Adjetivos",separable:"Separables",praeteritum:"Pr\u00e4teritum",conectores:"Conectores",conjugacion:"Conjugaci\u00f3n",konjunktiv2:"Konjunktiv II"})[weakTopics[0].key]||weakTopics[0].key;
    return {icon:"\ud83d\udcd0",msg:tname+" te est\u00e1 costando (<b>"+Math.round(weakTopics[0].acc*100)+"%</b> de aciertos).<br><span style='font-size:11px;color:var(--muted);'>Toc\u00e1 para practicar un drill de gram\u00e1tica.</span>",color:"#A78BFA",tab:"gramatica"};
  }
  // 3. Fehlerjournal pattern — recent errors
  var ej=state.session.errorJournal||[];
  var recent=ej.filter(function(e){
    return e.date===todayKey()||e.date===addDays(todayKey(),-1);
  });
  if(recent.length>=3){
    return {icon:"\ud83d\udcd3",msg:"Ten\u00e9s "+recent.length+" errores registrados hoy/ayer.<br><span style='font-size:11px;color:var(--muted);'>Revisalos en Resumen para ver patrones.</span>",color:"#F5A623",tab:"resumen"};
  }
  // 4. Streak at risk — no activity today
  var todayL=state.session.dailyLog[todayKey()];
  var str=computeStreak();
  if(str>0&&(!todayL||(!todayL.minutes&&!todayL.phrasesReviewed&&!todayL.drillsDone))){
    return {icon:"\u26a0\ufe0f",msg:"Hoy todav\u00eda no practicaste.<br><span style='font-size:11px;color:var(--muted);'>Un minuto alcanza para mantener tu racha de "+str+" d\u00edas.</span>",color:"#F87171"};
  }
  return null;
}
function getDailyGoal(){
  var total=0, days=0;
  for(var i=1;i<=7;i++){
    var d=addDays(todayKey(),-i);
    var mins=(state.session.dailyLog[d]&&state.session.dailyLog[d].minutes)||0;
    if(mins>0){total+=mins;days++;}
  }
  if(days===0) return 5; // default 5 min if no history
  var avg=total/days;
  return Math.round(Math.max(5,Math.min(avg*1.15,60))); // +15% buffer, cap 60, entero
}
function getWeakWords(){
  if(!state.session.saved.length) return null;
  var weak=state.session.saved.filter(function(p){return p.lapses>=2||p.box<=1;});
  if(!weak.length) return null;
  weak.sort(function(a,b){return (b.lapses||0)-(a.lapses||0);});
  var top=weak.slice(0,5);
  return top.map(function(p){return p.de+" → "+p.es;});
}

var _hvState=null; // {dialog, questions, answers, score, step, container}

function startHörverstehen(container){
  _hvState={step:"generating",dialog:[],questions:[],answers:[],score:0,container:container};
  container.innerHTML="";
  var skelDiv=mk("div","","padding:20px;");
  for(var si=0;si<4;si++) skelDiv.appendChild(skelCard(4));
  container.appendChild(skelDiv);
  var lvl=state.app.level||"B1";
  var lvlRng=lvl==="A2"?"A2":lvl==="B1"?"A2-B1":"B1-B2";
  ai("You are a German teacher. Reply ONLY with valid JSON, no markdown.",
    [{role:"user",content:'Generate a short natural German dialog ('+lvlRng+' level) between two people (3-4 exchanges). Then 2 multiple-choice comprehension questions in German. Format: {"dialog":[{"speaker":"PersonA","text":"..."},...],"questions":[{"q":"...","options":["...","...","..."],"correct":0},...]}. Each question has 3 options, correct is 0-indexed.'}],2000)
    .then(function(raw){
      var m=raw.match(/\{[\s\S]*\}/);
      if(!m){showToast("Error: respuesta inválida","error");renderHörverstehenFallback(container);return;}
      try{
        var data=JSON.parse(m[0]);
        if(!data.dialog||!data.questions||!data.questions.length){showToast("Error: datos inválidos","error");renderHörverstehenFallback(container);return;}
        _hvState.dialog=data.dialog;
        _hvState.questions=data.questions;
        _hvState.answers=[];
        renderHörverstehenPlay(container);

// ── REPASO DEL DÍA ──
function startDailyReview(){
  var steps=[];
  // Step 1: flashcards if due
  if(reviewDueCount()>0) steps.push({type:"flashcards"});
  // Step 2: grammar — weakest topic
  var gStats=state.grammar.grammarStats||{};
  var weakTopics=Object.keys(gStats).filter(function(k){
    var s=gStats[k]; return s.right+s.wrong>0 && s.right/(s.right+s.wrong)<0.6;
  }).sort(function(a,b){
    var sa=gStats[a],sb=gStats[b];
    return (sa.right/(sa.right+sa.wrong))-(sb.right/(sb.right+sb.wrong));
  });
  if(weakTopics.length) steps.push({type:"grammar",topic:weakTopics[0]});
  else if(Object.keys(gStats).length<GRAMMAR_TOPICS.length) steps.push({type:"grammar",topic:null}); // try new topic
  // Step 3: dictado
  steps.push({type:"dictado"});
  state.app._reviewPlan={steps:steps,currentStep:0,done:false};
  goToReviewStep(0);
}
function goToReviewStep(idx){
  var plan=state.app._reviewPlan;
  if(!plan||idx>=plan.steps.length){ showReviewComplete(); return; }
  plan.currentStep=idx;
  var step=plan.steps[idx];
  if(step.type==="flashcards") { state.app.currentTab="flashcards";renderTabs();showScreen("flashcards"); }
  else if(step.type==="grammar") {
    state.app.currentTab="gramatica";renderTabs();showScreen("gramatica");
    // Auto-select topic if specified
    if(step.topic && typeof step.topic==="string"){
      var found=GRAMMAR_TOPICS.findIndex(function(t){return t.key===step.topic;});
      if(found>=0) setTimeout(function(){loadGrammarDrills(GRAMMAR_TOPICS[found]);},200);
    }
  }
  else if(step.type==="dictado") { state.app.currentTab="dictado";renderTabs();showScreen("dictado"); }
}
function nextReviewStep(){
  var plan=state.app._reviewPlan;
  if(!plan) return;
  goToReviewStep(plan.currentStep+1);
}
function showReviewComplete(){
  var plan=state.app._reviewPlan;
  var el=document.getElementById("s-hoy");
  state.app.currentTab="hoy";renderTabs();showScreen("hoy");

    c.className="card";
    c.style.cssText="background:linear-gradient(135deg,rgba(74,222,128,0.12),rgba(78,205,196,0.06));border:1px solid rgba(74,222,128,0.25);border-radius:var(--r-lg,16px);padding:24px;text-align:center;margin-bottom:10px;animation:winPop 0.45s var(--ease-spring) both;";
    c.appendChild(mk("p","🎉","font-size:40px;margin-bottom:6px;"));
    c.appendChild(mk("p","¡Repaso completo!","font-size:18px;font-weight:800;color:#4ade80;margin-bottom:4px;"));
    c.appendChild(mk("p","Hiciste todas las actividades del plan.","font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px;"));
    var stepsDone=mk("div","","display:flex;justify-content:center;gap:10px;font-size:12px;");
    plan.steps.forEach(function(s){
      var icons={flashcards:"🃏",grammar:"📐",dictado:"✍️"};
      stepsDone.appendChild(mk("span",(icons[s.type]||"✅")+" "+s.type,"color:#94a3b8;font-weight:600;"));
    });

    resetBtn.onclick=function(){c.remove();state.app._reviewPlan=null;};
    c.appendChild(resetBtn);

async function doAuth() {

function applyServerData(data) {
  if (Array.isArray(data.saved)) { state.session.saved=data.saved; state.session.saved.forEach(ensureSrsFields); }
  if (Array.isArray(data.chatLogs)) state.session.chatLogs=data.chatLogs;
  if (data.totalPhrases) state.session.sessionPhrases=data.totalPhrases;
  if (data.totalMinutes) state.session.sessionMinutes=data.totalMinutes;
  if (data.dailyLog && typeof data.dailyLog==="object") state.session.dailyLog=data.dailyLog;
  if (data.shownPhrases && typeof data.shownPhrases==="object") state.session.shownPhrases=data.shownPhrases;
  if (data.weeklyGoal) state.session.weeklyGoal=Number(data.weeklyGoal)||60;
  if (data.level&&["A2","B1","B2"].includes(data.level)) state.app.level=data.level;
  if (data.grammarStats && typeof data.grammarStats==="object") state.grammar.grammarStats=data.grammarStats;
  if (Array.isArray(data.errorJournal)) state.session.errorJournal=data.errorJournal;
}

function lvlRange(){

state.app.syncTimer=null;
function syncPayload(){
  return JSON.stringify({saved:state.session.saved,chatLogs:state.session.chatLogs,totalPhrases:state.session.sessionPhrases,totalMinutes:state.session.sessionMinutes,dailyLog:state.session.dailyLog,shownPhrases:state.session.shownPhrases,weeklyGoal:state.session.weeklyGoal,level:state.app.level,grammarStats:state.grammar.grammarStats,errorJournal:state.session.errorJournal});
}
function setSyncChip(state){
  const el=document.getElementById("sync-status"); if(!el) return;
  // Solo íconos — el símbolo comunica el estado sin texto. title= da el detalle al hover.
  if(state==="saving"){ el.style.display="inline-block"; el.innerHTML='<span style="display:inline-block;animation:spin 0.8s linear infinite;">⟳</span>'; el.title="Guardando…"; el.style.color="#94a3b8"; el.style.background="rgba(255,255,255,0.06)"; }
  else if(state==="done"){ el.style.display="inline-block"; el.textContent="✓"; el.title="Guardado"; el.style.color="#4ade80"; el.style.background="rgba(74,222,128,0.1)"; setTimeout(function(){ if(el.textContent==="✓") el.style.display="none"; },2000); }
  else if(state==="error"){ el.style.display="inline-block"; el.textContent="⚠"; el.title="Sin guardar"; el.style.color="#F87171"; el.style.background="rgba(248,113,113,0.1)"; }
}
// Debounced: agrupa ráfagas de cambios en un solo POST tras 1200ms de pausa.
function syncUp() {
  if (!state.app.authToken) return;
  setSyncChip("saving");
  clearTimeout(state.app.syncTimer);
  state.app.syncTimer=setTimeout(syncNow,1200);
}
// Flush inmediato con 3 reintentos (backoff 1s/2s/4s). Usado por logout y beforeunload.
async function syncNow() {
  if (!state.app.authToken) return false;
  clearTimeout(state.app.syncTimer); state.app.syncTimer=null;
  for (let attempt=0; attempt<3; attempt++) {
    try {
      const r=await fetch("/api/sync",{method:"POST",headers:{"content-type":"application/json","x-token":state.app.authToken},body:syncPayload()});
      const data=await r.json();
      if(data.ok){ setSyncChip("done"); return true; }
      console.error("sync rejected",data.error); setSyncChip("error"); showToast(data.error||"No se pudo guardar","error"); return false;
    } catch(e){
      if(attempt<2){ await new Promise(function(res){setTimeout(res,1000*Math.pow(2,attempt));}); }
      else { console.error("sync failed",e); setSyncChip("error"); showToast("Sin conexión — cambios no guardados","error"); return false; }
    }
  }
}

state.app._lastStreakSeen=-1;
function renderHoy(){
  const el=document.getElementById("s-hoy"); el.innerHTML="";
  const streak=computeStreak();
  const due=reviewDueCount();
  const t=todayKey();
  const todayLog=state.session.dailyLog[t]||{minutes:0,phrasesReviewed:0,drillsDone:0};
  const todayTotal=(todayLog.minutes||0)+(todayLog.phrasesReviewed||0)+(todayLog.drillsDone||0);
  const allDone=due===0&&state.session.saved.length>0;

  // ── Streak hero ──
  const streakBox=document.createElement("div");
  streakBox.style.cssText="text-align:center;padding:28px 20px 20px;margin-bottom:6px;";
  const flameScale=streak>=30?1.3:streak>=14?1.2:streak>=7?1.15:streak>=3?1.08:1;
  const flameOpacity=streak>0?1:0.3;
  // Solo celebra cuando la racha CRECIÓ (no en cada visita al tab) — evita animation fatigue
  const streakGrew = streak > state.app._lastStreakSeen;
  const flameEl=mk("span","🔥","font-size:"+(48*flameScale)+"px;display:inline-block;opacity:"+flameOpacity+";filter:"+(streak>=7?"drop-shadow(0 0 12px rgba(245,166,35,0.6))":"none")+";");
  if(streak>0&&streakGrew){
    flameEl.style.animation="flameGrow 0.6s var(--ease-spring) 1";
  }
  streakBox.appendChild(flameEl);
  if(streak>0){
    const streakNum=mk("p",String(streak),"font-size:42px;font-weight:900;color:var(--text);letter-spacing:-0.03em;margin-top:4px;line-height:1;font-variant-numeric:tabular-nums;");

async function renderPotd(host, forceFetch){
  host.innerHTML="";
  host.appendChild(mk("p","✨  FRASE DEL DIA","font-size:10px;color:#F5A623;letter-spacing:2.5px;margin-bottom:8px;font-weight:700;"));
  const key="dl_potd_"+todayKey();
  let cached=null;
  if(!forceFetch){ try { cached=JSON.parse(localStorage.getItem(key)||"null"); } catch(e){console.error("potd cache",e);} }
  if(cached){ paintPotd(host, cached); return; }
  var skel=mk("div","","display:flex;flex-direction:column;gap:10px;");
  skel.appendChild(skelLine("40%","10px"));
  skel.appendChild(skelLine("90%","20px"));
  skel.appendChild(skelLine("70%","14px"));
  skel.appendChild(skelLine("50%","12px"));
  host.appendChild(skel);
  try {
    var _ww=getWeakWords();
    var _theme=_ww ? "The user struggles with: "+_ww.join(", ") : "Random theme.";
    const sys='Reply ONLY with valid JSON: {"de":"...","es":"...","tip":"short note <8 words"}. Generate ONE useful '+lvlRange()+' German phrase for daily life, varied each day. No markdown.';
    const text=await ai(sys,[{role:"user",content:"Date seed: "+todayKey()+". "+_theme}], 200);
    const clean=text.replace(/```json|```/g,"").trim();
    const m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error("no JSON");
    const obj=JSON.parse(m[0]);
    localStorage.setItem(key, JSON.stringify(obj));
    paintPotd(host, obj);
  } catch(e){
    host.removeChild(skel);
    host.appendChild(mk("p","No pude cargar la frase del dia.","font-size:12px;color:var(--muted);"));
  }
}

function paintPotd(host, ph){
  // Clear loading children but keep header
  while(host.childNodes.length>1) host.removeChild(host.lastChild);
  const row=mk("div","","display:flex;justify-content:space-between;align-items:flex-start;gap:8px;");
  row.appendChild(mk("p",ph.de,"font-size:17px;font-weight:800;color:var(--text);flex:1;line-height:1.4;letter-spacing:-0.01em;"));
  const btns=mk("div","","display:flex;gap:2px;flex-shrink:0;");
  const play=document.createElement("button"); play.className="icon-btn"; play.innerHTML="&#9654;"; play.style.color="#F5A623"; play.style.fontSize="18px";
  play.onclick=function(){speak(ph.de);};
  const isSaved=state.session.saved.some(function(x){return x.de===ph.de;});
  const star=document.createElement("button"); star.className="icon-btn"; star.innerHTML="&#9733;"; star.style.fontSize="20px"; star.style.color=isSaved?"#F5A623":"#334155";
  star.onclick=function(){
    if(!state.session.saved.some(function(x){return x.de===ph.de;})){
      state.session.saved.push(ensureSrsFields({de:ph.de,es:ph.es,tip:ph.tip||"",source:"frases"}));
      star.style.color="#F5A623"; updateBadge(); syncUp();
    }
  };
  const refresh=document.createElement("button"); refresh.className="icon-btn"; refresh.innerHTML="&#x21bb;"; refresh.style.fontSize="16px"; refresh.style.color="#64748b";
  refresh.title="Generar otra";
  refresh.onclick=function(){ localStorage.removeItem("dl_potd_"+todayKey()); renderPotd(host, true); };
  btns.appendChild(play); btns.appendChild(star); btns.appendChild(refresh);
  row.appendChild(btns); host.appendChild(row);
  host.appendChild(mk("p",ph.es,"font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;"));
  if(ph.tip) host.appendChild(mk("p","💡 "+ph.tip,"font-size:12px;color:#475569;font-style:italic;margin-top:6px;"));
}

async function loadPhrases(sit) {
  const el=document.getElementById("s-frases"); el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="← Volver";
  back.onclick=function(){renderFrases();};
  top.appendChild(back);
  top.appendChild(mk("span",sit,"font-size:13px;color:var(--text);font-weight:700;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;";
  for(var si=0;si<4;si++){loading.appendChild(skelCard(3));}
  el.appendChild(loading);

  // Solo las últimas 10 excluidas para no inflar el prompt
  const allExcluded=state.session.shownPhrases[sit]||[];
  const excluded=allExcluded.slice(-10);
  const exclusionNote=excluded.length?" Do NOT use these phrases: "+excluded.join(" | ")+".":"";

  try {
    const sys="You are a German language expert. Generate exactly 5 complete real German phrases for the given situation. Reply ONLY with a valid JSON array, no markdown, no extra text: [{\"de\":\"German phrase\",\"es\":\"Spanish translation\",\"tip\":\"short tip\"}]. Level "+lvlRange()+". Each tip must be under 8 words."+exclusionNote;
    const text=await ai(sys,[{role:"user",content:"Situation: "+sit}], 1400);

      playBtn.onclick=function(){speak(ph.de);};

      const starBtn=document.createElement("button"); starBtn.className="icon-btn"; starBtn.innerHTML="&#9733;"; starBtn.style.fontSize="18px";
      starBtn.style.color=isSaved?"#F5A623":"#334155";

        if(!state.session.saved.some(function(x){return x.de===ph.de;})){

          state.session.saved.push(item); starBtn.style.color="#F5A623"; updateBadge(); syncUp();
        }
      };
      btnRow.appendChild(playBtn); btnRow.appendChild(starBtn);
      row.appendChild(de); row.appendChild(btnRow); card.appendChild(row);
      card.appendChild(mk("p",ph.es,"font-size:13px;color:#94a3b8;margin-top:5px;font-weight:500;"));
      if(ph.tip){
        const tipEl=mk("p","💡 "+ph.tip,"font-size:12px;color:#475569;font-style:italic;margin-top:6px;");
        card.appendChild(tipEl);
      }
      el.appendChild(card);
    });

    const more=document.createElement("button");
    more.className="more-btn";
    more.textContent="+ Generar 5 mas";
    more.onclick=function(){loadPhrases(sit);};
    el.appendChild(more);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error al cargar frases. Intenta de nuevo.","color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
  }
}

function saveChatLog() {
  if(state.chat.chatHistory.length>0&&state.chat.chatScenario){
    const today=new Date().toLocaleDateString("es-CO");
    const idx=state.session.chatLogs.findIndex(function(l){return l.scenario===state.chat.chatScenario&&l.date===today;});
    if(idx>=0){state.session.chatLogs[idx].messages=state.chat.chatHistory.slice();}
    else{state.session.chatLogs.unshift({scenario:state.chat.chatScenario,date:today,messages:state.chat.chatHistory.slice()});if(state.session.chatLogs.length>10)state.session.chatLogs=state.session.chatLogs.slice(0,10);}

function startChat(scenario) {
  state.chat.chatScenario=scenario; state.chat.chatHistory=[];
  const el=document.getElementById("s-conversar"); el.innerHTML="";

  startMinTimer();

    clearInterval(state.session.minTimer);
    runPostChatAnalysis();

  };

  const bar=document.createElement("div"); bar.className="chat-bar";

function addBubble(text, role) {
  const win=document.getElementById("chat-win"); if(!win) return;
  const row=document.createElement("div"); row.className="bubble-row "+role;
  const wrapper=document.createElement("div");
  wrapper.style.cssText="display:flex;flex-direction:column;align-items:"+(role==="user"?"flex-end":"flex-start")+";gap:4px;max-width:86%;animation:fadeUp 0.2s ease;";
  const bub=document.createElement("div");
  bub.className=role==="user"?"bubble-user bubble-base":"bubble-bot bubble-base";
  bub.style.borderRadius=role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px";
  bub.textContent=text;
  const playBtn=document.createElement("button");
  playBtn.className="bubble-play-btn";
  playBtn.textContent="▶ escuchar";
  playBtn.onclick=function(){speakGerman(text);};
  wrapper.appendChild(bub); wrapper.appendChild(playBtn);
  // Mostrar 💾 cuando el bot corrige. El prompt del chat usa "Better: [corrección]";
  // soportamos también "En alemán se dice" y "→" por si cambia el formato.
  if(role==="bot"&&(/better:/i.test(text)||text.includes("En alemán se dice")||text.includes("→"))){
    var saveBtn=document.createElement("button");
    saveBtn.textContent="💾 Guardar";
    saveBtn.className="bubble-save-btn";
    saveBtn.onclick=function(){
      var de=text;
      var m=text.match(/Better:?\s*([^.\n(]+)/i);
      if(m) de=m[1].trim();
      else if((m=text.match(/En alemán se dice:\s*([^.\n(]+)/))) de=m[1].trim();
      else if((m=text.match(/→\s*([^.\n(]+)/))) de=m[1].trim();
      showSaveCardModal(de,"",saveBtn);
    };
    wrapper.appendChild(saveBtn);
  }
  row.appendChild(wrapper); win.appendChild(row);
  win.scrollTop=win.scrollHeight;
}

async function doSend(inp, sendBtn) {
  const msg=inp.value.trim(); if(!msg) return;
  inp.value=""; inp.disabled=true; sendBtn.disabled=true;
  addBubble(msg,"user"); state.chat.chatHistory.push({role:"user",content:msg});
  const win=document.getElementById("chat-win");
  const typingRow=document.createElement("div"); typingRow.className="bubble-row bot";
  const typingBub=document.createElement("div");
  typingBub.className="bubble-bot";
  typingBub.style.cssText="border-radius:16px 16px 16px 4px;padding:12px 16px;";
  typingBub.appendChild(skelLine("70%","13px")); typingBub.appendChild(skelLine("45%","13px")); typingRow.appendChild(typingBub);
  if(win){win.appendChild(typingRow);win.scrollTop=win.scrollHeight;}
  try {
    var duePhrases="";
    if(state.session.saved.length){
      var today=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}();
      var pending=state.session.saved.filter(function(p){return p.nextReview<=today&&p.box<5;});
      if(pending.length){
        var pick=[];
        var shuffled=[...pending].sort(function(){return Math.random()-0.5;});
        for(var i=0;i<3&&i<shuffled.length;i++) pick.push(shuffled[i].de);
        duePhrases="\n\nTry to naturally use these German phrases in the conversation: "+pick.join(", ");
      }
    }
    const sys="You are a German tutor playing the role of the OTHER person in this scenario: "+state.chat.chatScenario+". The USER (Sebastian) is always the protagonist — a data analyst from Colombia learning German. YOU play the other person: friend, colleague, interviewer, etc. Reply in German at "+lvlRange()+" level. After your German reply add one line in parentheses: (Spanish translation). If Sebastian made German errors gently correct: Better: [correction]. Max 3-4 sentences. Keep the conversation going."+duePhrases;
    const reply=await ai(sys,state.chat.chatHistory);
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble(reply,"bot"); state.chat.chatHistory.push({role:"assistant",content:reply});
    var _bm=reply.match(/Better:?\s*([^.\n(]+)/i);
    if(_bm) logError("chat", msg, _bm[1].trim(), "");
  } catch(e){
    if(win&&typingRow.parentNode) win.removeChild(typingRow);
    addBubble("Error al enviar mensaje. Intenta de nuevo.","bot");
  }
  inp.disabled=false; sendBtn.disabled=false;
}

function buildReviewQueue(){
  const t=todayKey();
  const indices=[];
  state.session.saved.forEach(function(p,i){ ensureSrsFields(p); if(p.nextReview<=t) indices.push(i); });
  // Order: lowest box first, then oldest nextReview
  indices.sort(function(a,b){
    const A=state.session.saved[a], B=state.session.saved[b];
    if(A.box!==B.box) return A.box-B.box;
    return (A.nextReview||"").localeCompare(B.nextReview||"");
  });
  return indices;
}

function renderGuardadasList(host){
  host.innerHTML="";
  const q=state.guardadas.guardadasFilter.trim().toLowerCase();
  const filtered=state.session.saved.filter(function(ph){
    ensureSrsFields(ph);
    const catMatch=state.guardadas.guardadasFilterCat==="Todas"||(state.guardadas.guardadasFilterCat==="Sin categoría"?(!ph.category):ph.category===state.guardadas.guardadasFilterCat);
    if(!catMatch) return false;
    if(!q) return true;
    return (ph.de||"").toLowerCase().indexOf(q)>=0 || (ph.es||"").toLowerCase().indexOf(q)>=0;
  });
  if(!filtered.length){
    host.appendChild(mk("p","Sin resultados para \""+q+"\"","color:var(--muted);font-size:13px;text-align:center;padding:30px 0;font-weight:500;"));
    return;

  filtered.forEach(function(ph,i){
    ensureSrsFields(ph);
    const card=document.createElement("div"); card.className="card";
    card.style.borderColor="rgba(245,166,35,0.12)";
    card.style.animation="fadeUp 0.2s "+(Math.min(i,10)*0.04)+"s both";
    const topRow=mk("div","","display:flex;justify-content:space-between;align-items:center;gap:12px;");
    const txt=mk("div","","flex:1;min-width:0;");
    txt.appendChild(mk("p",ph.de,"font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.01em;"));
    txt.appendChild(mk("p",ph.es,"font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;"));
    txt.appendChild(mk("p","caja "+ph.box+" · "+ph.nextReview,"font-size:10px;color:#475569;margin-top:4px;font-weight:600;letter-spacing:0.5px;"));
    const right=mk("div","","display:flex;align-items:center;gap:4px;flex-shrink:0;");
    const play=document.createElement("button"); play.className="icon-btn"; play.innerHTML="&#9654;"; play.style.color="#F5A623"; play.style.fontSize="20px";

    del.title="Eliminar";
    del.onclick=function(){
      const idx=state.session.saved.indexOf(ph); if(idx>=0){ state.session.saved.splice(idx,1); updateBadge(); syncUp(); renderGuardadas(); }
    };
    right.appendChild(play); right.appendChild(del);
    topRow.appendChild(txt); topRow.appendChild(right); card.appendChild(topRow);
    // Category row
    const catRow=mk("div","","display:flex;align-items:center;gap:6px;margin-top:8px;");
    const catLbl=mk("span",ph.category||"Sin categoría","font-size:11px;font-weight:700;color:"+(ph.category?"var(--gold)":"var(--muted)")+";background:"+(ph.category?"rgba(245,166,35,0.1)":"rgba(255,255,255,0.04)")+";padding:2px 10px;border-radius:20px;");
    const catBtn=document.createElement("button");
    catBtn.className="cat-edit-btn";
    catBtn.textContent="✏️";
    catRow.appendChild(catLbl); catRow.appendChild(catBtn);
    // Inline category select (hidden by default)
    var catSelect=document.createElement("select");
    catSelect.style.cssText="display:none;font-size:11px;font-weight:600;background:rgba(255,255,255,0.06);border:1px solid rgba(245,166,35,0.3);border-radius:8px;padding:4px 6px;color:#e2e8f0;outline:none;font-family:inherit;";
    [""].concat(CATEGORIES).forEach(function(c){
      var o=document.createElement("option");o.value=c;o.textContent=c||"Sin categoría";
      if(c===ph.category)o.selected=true;catSelect.appendChild(o);
    });
    catSelect.onchange=function(){
      ph.category=this.value;state.session.saved[state.session.saved.indexOf(ph)]=ph;syncUp();renderGuardadas();
    };
    catRow.appendChild(catSelect);
    catBtn.onclick=function(){
      var showing=catSelect.style.display==="inline-block";
      catSelect.style.display=showing?"none":"inline-block";
      catLbl.style.display=showing?"inline-block":"none";
    };
    // If select visible and user clicks outside, close it
    catSelect.onblur=function(){
      catSelect.style.display="none";catLbl.style.display="inline-block";
    };
    card.appendChild(catRow);
    host.appendChild(card);
  });
}

// ── VOCAB TABLE ───────────────────────────────────────────────────────────────
function renderVocabTable(host){
  host.innerHTML="";
  const today=todayKey();
  const sortField={cat:"category",de:"de",es:"es",box:"box",nextReview:"nextReview",lapses:"lapses"}[state.guardadas.vocabSortCol]||state.guardadas.vocabSortCol;
  const list=[...state.session.saved].sort(function(a,b){
    let va=a[sortField]||"", vb=b[sortField]||"";
    if(state.guardadas.vocabSortCol==="box"||state.guardadas.vocabSortCol==="lapses"){ va=Number(va)||0; vb=Number(vb)||0; }
    if(state.guardadas.vocabSortCol==="nextReview"){ va=String(va); vb=String(vb); }
    if(va<vb) return state.guardadas.vocabSortAsc?-1:1;
    if(va>vb) return state.guardadas.vocabSortAsc?1:-1;
    return 0;
  });
  const table=document.createElement("table");
  table.style.cssText="width:100%;border-collapse:collapse;font-size:13px;";
  const thead=document.createElement("thead");
  const hrow=document.createElement("tr");
  ["de","es","cat","box","nextReview","lapses"].forEach(function(col){
    const th=document.createElement("th");
    th.style.cssText="padding:8px 10px;text-align:left;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;user-select:none;white-space:nowrap;";
    const arrow=state.guardadas.vocabSortCol===col?(state.guardadas.vocabSortAsc?" ▲":" ▼"):"";
    th.textContent=col.toUpperCase()+arrow;

function generateLectura(topicId,host){
  const ta=host.querySelector("#lectura-text");
  ta.innerHTML=""; ta.style.cssText="padding:20px;";
  ta.appendChild(skelCard(6));
  const topicLabels={daily:"daily life",travel:"traveling in Germany",work:"at the workplace",food:"ordering food at a restaurant",nature:"a walk in nature",feelings:"expressing emotions"};
  var topicLabel=topicLabels[topicId]||"daily life";
  var sys='You are a German language teacher. Generate a short German text about '+topicLabel+' at '+state.app.level+' level. Reply ONLY with valid JSON, no markdown: {"text":"the German text (3-5 sentences, natural, no translations in the text)","words":[{"de":"German word","es":"Spanish meaning"}]}. Include 8-12 key words in the words array. Level '+state.app.level+'.';
  ai(sys,[{role:"user",content:"Generate a reading passage."}],1200).then(function(reply){
    var clean=reply.replace(/```json|```/g,"").trim();
    var m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error("no JSON");
    var obj=JSON.parse(m[0]);
    ta.innerHTML="";
    // Build word lookup
    var wordMap={};
    (obj.words||[]).forEach(function(w){wordMap[w.de.toLowerCase()]=w.es;});
    // Render text with clickable words
    var textEl=mk("div","","font-size:17px;line-height:1.8;color:var(--text);font-weight:500;margin-bottom:16px;");
    var words=obj.text.split(/(\s+)/);
    state.lectura._lecturaWords=[];
    state.lectura._lecturaTarget=-1;
    words.forEach(function(w,i){
      if(/^\s+$/.test(w)){textEl.appendChild(document.createTextNode(w));return;}
      var cleanW=w.replace(/[.,!?;:"'()]/g,"");
      var span=document.createElement("span");
      span.textContent=w;
      span.style.cssText="cursor:pointer;border-bottom:1px dashed rgba(167,139,250,0.3);transition:all 0.15s;padding:0 1px;border-radius:2px;";
      span.onmouseover=function(){this.style.background="rgba(167,139,250,0.12)";};
      span.onmouseout=function(){if(state.lectura._lecturaTarget!==i){this.style.background="";}};
      span.onclick=function(){
        if(state.lectura._lecturaTarget===i){state.lectura._lecturaTarget=-1;span.style.background="";span.style.borderBottomColor="rgba(167,139,250,0.3)";hideLecturaTranslation();return;}
        if(state.lectura._lecturaTarget>=0){var prev=textEl.querySelectorAll("span")[state.lectura._lecturaTarget];if(prev){prev.style.background="";prev.style.borderBottomColor="rgba(167,139,250,0.3)";}}
        state.lectura._lecturaTarget=i;
        span.style.background="rgba(167,139,250,0.2)";
        span.style.borderBottomColor="var(--purple)";
        var trans=wordMap[cleanW.toLowerCase()]||state.lectura._wordCache[cleanW.toLowerCase()]||null;
        // Find sentence containing this word for context
        var contextSentence="";
        var sentences=obj.text.split(/[.!?]+/);
        for(var si=0;si<sentences.length;si++){
          if(sentences[si].toLowerCase().indexOf(cleanW.toLowerCase())>=0){
            contextSentence=sentences[si].trim()+".";
            break;
          }
        }
        showLecturaTranslation(w,cleanW,trans,host,contextSentence,this);
      };
      state.lectura._lecturaWords.push(cleanW);
      textEl.appendChild(span);
    });
    ta.appendChild(textEl);
    // Audio button
    var playBtn=document.createElement("button");
    playBtn.className="gen-btn gen-btn-teal";
    playBtn.textContent="🔊 Escuchar texto";
    playBtn.onclick=function(){speak(obj.text);};
    ta.appendChild(playBtn);
    // Copy button
    var copyBtn=document.createElement("button");
    copyBtn.className="gen-btn gen-btn-muted";
    copyBtn.textContent="📋 Copiar texto";
    copyBtn.onclick=function(){navigator.clipboard.writeText(obj.text).then(function(){showToast("Texto copiado","success");}).catch(function(){showToast("No se pudo copiar","error");});};
    // New text button
    var newBtn=document.createElement("button");
    newBtn.className="gen-btn gen-btn-muted";
    newBtn.textContent="🔄 Otro texto";
    newBtn.onclick=function(){generateLectura(topicId,host);};
    ta.appendChild(newBtn);
  }).catch(function(e){
    ta.innerHTML="";
    ta.appendChild(mk("p","Error al generar texto. Intenta de nuevo.","color:#ef4444;font-size:13px;text-align:center;margin-top:20px;font-weight:500;"));
    var retry=mk("button","Reintentar","margin-top:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;");
    retry.onclick=function(){generateLectura(topicId,host);};
    ta.appendChild(retry);
  });
}
function showLecturaTranslationManual(rawWord,host,contextSentence){
  var popup=mk("div","","background:rgba(167,139,250,0.08);border:1px solid rgba(167,139,250,0.2);border-radius:var(--r-lg,16px);padding:16px;margin-bottom:14px;");
  popup.id="lectura-popup";
  popup.appendChild(mk("p","📖 "+rawWord,"font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px;"));
  var askWrap=mk("div","","margin-bottom:10px;");

  var inp=document.createElement("input"); inp.placeholder="Traduccion en español...";
  inp.style.cssText="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(167,139,250,0.3);border-radius:10px;padding:9px 12px;font-size:13px;color:var(--text);outline:none;font-family:inherit;font-weight:500;";

function renderDictado() {

  const card=document.createElement("div"); card.className="card";

  const newBtn=mk("button","Otra frase","background:rgba(255,255,255,0.05);color:#94a3b8;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;");

    result.innerHTML="";

    try {
      if(state.session.saved.length>=5 && Math.random()<0.6){
        // Prefer cards with lower box (más difíciles para Sebastian)
        const pool=state.session.saved.slice().sort(function(a,b){ensureSrsFields(a);ensureSrsFields(b);return a.box-b.box;}).slice(0, Math.max(5, Math.floor(state.session.saved.length/2)));
        state.dictado._dictadoTarget=pool[Math.floor(Math.random()*pool.length)];
      } else {
        const sys='Reply ONLY with valid JSON: {"de":"...","es":"..."}. Generate ONE '+lvlRange()+' German phrase, 4-9 words, useful, common. No markdown.';
        const text=await ai(sys,[{role:"user",content:"random topic, seed: "+Date.now()}], 200);
        const m=text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);

    } catch(e){

      result.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));

  newBtn.onclick=pickTarget;
  checkBtn.onclick=function(){

    const user=ta.value.trim();
    if(!user) return;
    result.innerHTML="";
    const target=state.dictado._dictadoTarget.de.trim();
    // Word-level comparison (normalize: lowercase, strip punctuation)
    function norm(s){ return s.toLowerCase().replace(/[.,!?¿¡;:"'()]/g,"").replace(/\s+/g," ").trim(); }
    const tWords=norm(target).split(" "); const uWords=norm(user).split(" ");

      sp.style.color=ok?"#4ade80":"#F87171";
      sp.style.textDecoration=ok?"none":"underline";
      wrapWords.appendChild(sp);

    wrap.appendChild(wrapWords);
    result.appendChild(wrap);

    const score=Math.round((correct/total)*100);
    const sBox=document.createElement("div");
    sBox.style.cssText="background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;";
    sBox.appendChild(mk("div","Score","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;"));
    sBox.appendChild(mk("span",score+"%","font-size:28px;font-weight:900;color:"+(score>=80?"#4ade80":score>=50?"#fbbf24":"#F87171")+";"));
    result.appendChild(sBox);

    const orig=document.createElement("div");
    orig.style.cssText="background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.2);border-radius:14px;padding:14px;";
    orig.appendChild(mk("p","ORIGINAL","font-size:10px;color:#4ECDC4;letter-spacing:2px;font-weight:700;margin-bottom:6px;"));
    orig.appendChild(mk("p",target,"font-size:16px;font-weight:800;color:var(--text);letter-spacing:-0.01em;"));
    if(state.dictado._dictadoTarget.es) orig.appendChild(mk("p",state.dictado._dictadoTarget.es,"font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;"));
    result.appendChild(orig);

    logActivity("phrasesReviewed",1);
    syncUp();
    if(state.app._reviewPlan&&!state.app._reviewPlan.done){
      var cont=mk("button","✅  Siguiente →","width:100%;padding:14px;border-radius:12px;border:none;background:rgba(78,205,196,0.12);color:#4ECDC4;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;");
      cont.onclick=function(){nextReviewStep();};
      result.appendChild(cont);
    }
  };

  pickTarget();
}

async function loadGrammarDrills(topic){
  const el=document.getElementById("s-gramatica"); el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="← Volver";
  back.onclick=renderGramatica;
  top.appendChild(back);
  top.appendChild(mk("span",topic.label,"font-size:13px;color:var(--text);font-weight:700;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.style.cssText="display:flex;flex-direction:column;gap:12px;";
  for(var gi=0;gi<3;gi++){loading.appendChild(skelCard(5));}
  el.appendChild(loading);

  try {
    const sys='Generate 5 German grammar multiple-choice drills for topic: '+topic.label+'. Reply ONLY with a valid JSON array, no markdown: [{"prompt":"German sentence with ___ blank","options":["a","b","c","d"],"answer":"correct option exactly","explain":"<15 words Spanish"}]. Level '+lvlRange()+'. Options must be plausible distractors.';
    const text=await ai(sys,[{role:"user",content:"topic: "+topic.label}], 1400);
    state.grammar._gramDrills=parseJSONArray(text);
    state.grammar._gramIdx=0; state.grammar._gramCorrect=0; state.grammar._gramMissed=[];
    el.removeChild(loading);
    renderDrillStep(el, topic);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
  }
}

function renderDrillStep(el, topic){
  // Clear all but the top nav
  while(el.children.length>1) el.removeChild(el.lastChild);

  if(state.grammar._gramIdx>=state.grammar._gramDrills.length){
    const done=document.createElement("div");
    done.style.cssText="background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:16px;padding:24px;text-align:center;";
    done.appendChild(mk("div","🎉","font-size:48px;margin-bottom:8px;"));
    done.appendChild(mk("p","Terminaste!","font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;"));
    done.appendChild(mk("p",state.grammar._gramCorrect+" / "+state.grammar._gramDrills.length+" correctas","font-size:14px;color:#A78BFA;font-weight:700;"));
    el.appendChild(done);
    // Save per-topic grammar stats
    var prev=state.grammar.grammarStats[topic.key]||{right:0,wrong:0,lastPracticed:"",streak:0};
    var wrong=state.grammar._gramDrills.length-state.grammar._gramCorrect;
    state.grammar.grammarStats[topic.key]={
      right: prev.right+state.grammar._gramCorrect,
      wrong: prev.wrong+wrong,
      lastPracticed: todayKey(),
      streak: (state.grammar._gramCorrect/state.grammar._gramDrills.length)>=0.6 ? prev.streak+1 : 0
    };
    // Log wrong answers to Fehlerjournal
    if(state.grammar._gramMissed.length){
      state.grammar._gramMissed.forEach(function(d){
        logError("grammar", d.prompt, d.answer, d.explain);
      });
    }
    // Generate grammar-review state.session.saved[] entries if wrong > right (no duplicates per topic+day)
    if(state.grammar.grammarStats[topic.key].wrong>state.grammar.grammarStats[topic.key].right){
      var hasToday=state.session.saved.some(function(p){return p.source==="grammar"&&p.tip==="grammar:"+topic.key&&p.nextReview===todayKey();});
      if(!hasToday){
        state.grammar._gramMissed.forEach(function(drill){
          state.session.saved.push(ensureSrsFields({de:drill.prompt,es:drill.answer+" — "+drill.explain,tip:"grammar:"+topic.key,source:"grammar",box:0,nextReview:todayKey()}));
        });
      }
    }
    const again=mk("button","Otra ronda","width:100%;background:#A78BFA;color:#000;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:800;margin-top:12px;");
    again.onclick=function(){loadGrammarDrills(topic);};
    el.appendChild(again);
    if(state.app._reviewPlan&&!state.app._reviewPlan.done){
      var cont=mk("button","✅  Siguiente →","width:100%;padding:13px;border-radius:14px;border:none;background:rgba(78,205,196,0.12);color:#4ECDC4;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;");
      cont.onclick=function(){nextReviewStep();};
      el.appendChild(cont);
    }
    logActivity("drillsDone", state.grammar._gramDrills.length); syncUp();
    return;
  }

  const d=state.grammar._gramDrills[state.grammar._gramIdx];
  const counter=mk("p","Ejercicio "+(state.grammar._gramIdx+1)+" / "+state.grammar._gramDrills.length,"color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px;letter-spacing:0.5px;");
  el.appendChild(counter);

  const card=document.createElement("div"); card.className="card"; card.style.padding="18px"; card.style.borderColor="rgba(167,139,250,0.2)";
  card.appendChild(mk("p",d.prompt,"font-size:18px;font-weight:800;color:var(--text);line-height:1.4;margin-bottom:14px;letter-spacing:-0.01em;"));
  const opts=mk("div","","display:flex;flex-direction:column;gap:8px;");
  let answered=false;
  d.options.forEach(function(opt){
    const b=document.createElement("button");
    b.style.cssText="text-align:left;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;transition:background 0.15s,border-color 0.15s;cursor:pointer;";
    b.textContent=opt;
    b.onclick=function(){
      if(answered) return; answered=true;
      const ok=opt===d.answer;
      if(ok){ state.grammar._gramCorrect++; b.style.background="rgba(74,222,128,0.12)"; b.style.borderColor="#4ade80"; b.style.color="#4ade80"; }
      else { state.grammar._gramMissed.push(d); b.style.background="rgba(248,113,113,0.12)"; b.style.borderColor="#F87171"; b.style.color="#F87171"; }
      // Mark correct option green
      Array.prototype.slice.call(opts.children).forEach(function(other){
        if(other.textContent===d.answer && other!==b){ other.style.background="rgba(74,222,128,0.12)"; other.style.borderColor="#4ade80"; other.style.color="#4ade80"; }
      });
      const ex=mk("p","💡 "+(d.explain||""),"font-size:12px;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.5;font-weight:500;");
      card.appendChild(ex);
      const next=mk("button",(state.grammar._gramIdx+1<state.grammar._gramDrills.length?"Siguiente →":"Ver resultado"),"width:100%;background:#A78BFA;color:#000;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:800;margin-top:10px;");
      next.onclick=function(){ state.grammar._gramIdx++; renderDrillStep(el, topic); };
      card.appendChild(next);
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  el.appendChild(card);
}

function paintCasosTable(out, note){
  const n=CASOS_NOUNS[state.casos.casosNounIdx];
  const arts=CASOS_ART[state.casos.casosArt][n.gen];
  const genName={m:'masculino',f:'femenino',n:'neutro'}[n.gen];
  note.innerHTML="Género: <b style='color:#cbd5e1'>"+genName+"</b>"
    +(n.weak?" · ojo, sustantivo débil (-n en Akk/Dat/Gen)":"")
    +(n.gen==='f'?" · el femenino casi no cambia":"");
  const frames=[
    function(a){return {de:cap(a)+" "+n.f[0]+" ist hier.", es:capEs(n.es)+" está aquí."};},
    function(a){return {de:"Ich sehe "+a+" "+n.f[1]+".", es:"Veo "+n.es+"."};},
    function(a){return {de:"Ich arbeite mit "+a+" "+n.f[2]+".", es:"Trabajo con "+n.es+"."};},
    function(a){return {de:"die Idee "+a+" "+n.f[3], es:"la idea de "+n.es};}
  ];
  out.innerHTML="";
  CASOS_CASES.forEach(function(cs,i){
    const fr=frames[i](arts[i]);
    const row=document.createElement("div"); row.className="cs-trow";
    row.innerHTML='<div class="cs-tlbl" style="background:var(--'+cs.cls+'-bg);color:var(--'+cs.cls+');">'
      +'<span class="cs-dot" style="background:'+cs.dot+';"></span>'+cs.name+'</div>'
      +'<div class="cs-tval"><div class="cs-bigword">'+arts[i]+' '+n.f[i]+'</div>'
      +'<div class="cs-exde">'+fr.de+'</div><div class="cs-exes">'+fr.es+'</div></div>';
    out.appendChild(row);
  });
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function capEs(s){return s.charAt(0).toUpperCase()+s.slice(1);}
