      fb.style.cssText="padding:16px;margin-bottom:10px;border-radius:var(--r-lg,14px);background:"+(correct?"rgba(74,222,128,0.08)":"rgba(248,113,113,0.08)")+";border:1px solid "+(correct?"rgba(74,222,128,0.2)":"rgba(248,113,113,0.2)")+";animation:fadeUp 0.2s ease;";
      fb.appendChild(mk("p",correct?"✓ Correcto! — "+d.sentence.replace("___",d.correct):"✗ Incorrecto — "+d.sentence.replace("___",d.correct),"font-size:14px;font-weight:700;color:"+(correct?"var(--green-text)":"var(--red-text)")+";margin-bottom:6px;line-height:1.5;"));
      fb.appendChild(mk("p","💡 "+d.tip,"font-size:12px;color:var(--text);font-weight:500;line-height:1.5;background:rgba(245,166,35,0.08);padding:8px 12px;border-radius:8px;"));
      el.removeChild(row);
      if(skip&&skip.parentNode) skip.parentNode.removeChild(skip);
      el.insertBefore(fb,card.nextSibling);
      var nextBtn=mk("button",(idx+1<data.length?"Siguiente →":"Ver resultado"),"width:100%;padding:12px;border-radius:12px;border:none;background:rgba(245,166,35,0.12);color:var(--gold-text);font-size:13px;font-weight:800;cursor:pointer;margin-top:6px;");
      nextBtn.setAttribute("aria-label",(idx+1<data.length?"Siguiente pregunta":"Ver resultado"));
      nextBtn.onclick=function(){state.tempo.tempusIdx++;renderTempusCard(el,hdr);};
      el.insertBefore(nextBtn,fb.nextSibling);
    };
    row.appendChild(btn);
  });
  el.appendChild(row);
  // Skip
  var skip=mk("button","Saltar →","background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;display:block;margin:0 auto;");
  skip.setAttribute("aria-label","Saltar pregunta");
  skip.onclick=function(){state.tempo.tempusResults[idx]=false;state.tempo.tempusSkipped[idx]=true;state.tempo.tempusWrong++;state.tempo.tempusIdx++;renderTempusCard(el,hdr);};
  el.appendChild(skip);
}

function renderTempusResults(el){
  el.innerHTML="";
  var hdr=mk("div","","margin-bottom:16px;");
  hdr.appendChild(mk("p","ALEMÁN · ANTES / DESPUÉS","font-size:10px;color:var(--gold-text);letter-spacing:2px;font-weight:700;margin-bottom:2px;"));
  hdr.appendChild(mk("h2","⏳ Resultados","font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.02em;"));
  el.appendChild(hdr);
  var data=state.tempo.tempusData;
  var total=state.tempo.tempusRight+state.tempo.tempusWrong;
  var pct=total>0?Math.round(state.tempo.tempusRight/total*100):0;
  var scoreColor=pct>=80?"var(--green-text)":pct>=50?"var(--gold-text)":"var(--red-text)";
  var resultCard=document.createElement("div"); resultCard.className="card";
  resultCard.style.cssText="text-align:center;padding:28px;margin-bottom:16px;";
  resultCard.appendChild(mk("p",state.tempo.tempusRight+"/"+total,"font-size:42px;font-weight:900;color:"+scoreColor+";line-height:1;font-variant-numeric:tabular-nums;"));
  resultCard.appendChild(mk("p","Aciertos","font-size:13px;color:var(--muted);font-weight:600;margin-top:4px;"));
  resultCard.appendChild(mk("p",pct+"%","font-size:14px;font-weight:700;color:"+scoreColor+";margin-top:2px;"));
  el.appendChild(resultCard);

  // Save wrong answers as flashcards
  data.forEach(function(d,i){
    if(state.tempo.tempusResults[i]===false&&!state.tempo.tempusSkipped[i]){
      var fullDe=d.sentence.replace("___",d.correct);
      var phr=ensureSrsFields({de:fullDe,es:d.tip,tip:d.correct,source:"antes-despues"});
      if(!state.session.saved.some(function(x){return x.de===phr.de;})){
        state.session.saved.push(phr);
      }
    }
  });
  updateBadge();

  // Summary
  var sumCard=document.createElement("div"); sumCard.className="card";
  sumCard.style.cssText="margin-bottom:16px;";
  sumCard.appendChild(mk("p","Lo que practicaste:","font-size:11px;color:var(--gold-text);letter-spacing:1.5px;font-weight:700;margin-bottom:8px;"));
  data.forEach(function(d,i){
    var color=state.tempo.tempusResults[i]?"var(--green-text)":"var(--red-text)";
    var row=mk("div","","display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;");
    var full=d.sentence.replace("___",d.correct);
    var mark=state.tempo.tempusResults[i]?"✓ ":"✗ ";
    if(state.tempo.tempusSkipped[i]) mark="Saltada · ";
    row.appendChild(mk("span",mark+(i+1)+". "+full,"font-weight:600;color:"+color+";flex:1;line-height:1.4;"));
    sumCard.appendChild(row);
  });
  el.appendChild(sumCard);

  // Restart
  var restart=mk("button","← Reiniciar","width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--muted);border-radius:12px;padding:12px;font-size:13px;font-weight:600;margin-top:12px;cursor:pointer;");
  restart.onclick=function(){state.tempo.tempusData=null;state.tempo.tempusDone=false;state.tempo.tempusIdx=0;state.tempo.tempusRight=0;state.tempo.tempusWrong=0;state.tempo.tempusResults=[];state.tempo.tempusSkipped=[];state.tempo.tempusLogged=false;renderTempus();};
  el.appendChild(restart);

  if(!state.tempo.tempusLogged){
    state.tempo.tempusLogged=true;
    logActivity("drillsDone",1); syncUp();
  }
}

function renderFlashcards() {
  const el=document.getElementById("s-flashcards"); el.innerHTML="";
  if(!state.session.saved.length){
    var empty=mk("div","","text-align:center;padding:70px 0;color:var(--muted);");
    var emptyIcon=mk("div","","font-size:48px;margin-bottom:16px;color:var(--gold-text);display:flex;justify-content:center;");
    emptyIcon.appendChild(ico("cards",48));
    empty.appendChild(emptyIcon);
    empty.appendChild(mk("p","Sin tarjetas aun","font-weight:700;font-size:15px;margin-bottom:8px;color:#94a3b8;"));
    empty.appendChild(mk("p","Ve a Frases o No entendi y guarda algunas.","font-size:13px;font-weight:500;"));
    el.appendChild(empty);
    return;
  }

  // Mode toggle
  const modeRow=mk("div","","display:flex;gap:8px;margin-bottom:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:4px;");
  const dueN=reviewDueCount();
  [{k:true,lbl:"🎯 Pendientes ("+dueN+")"},{k:false,lbl:"📚 Todas ("+state.session.saved.length+")"}].forEach(function(o){
    const b=document.createElement("button");
    b.style.cssText="flex:1;padding:9px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:background 0.2s,color 0.2s,box-shadow 0.2s;";
    b.textContent=o.lbl;
    if(state.flashcards.flashReviewMode===o.k){ b.style.background="#F5A623"; b.style.color="#000"; b.style.boxShadow="0 2px 10px rgba(245,166,35,0.3)"; }
    else { b.style.background="transparent"; b.style.color="#64748b"; }
    b.onclick=function(){ state.flashcards.flashReviewMode=o.k; state.flashcards.flashIdx=0; state.flashcards.reviewQueue=[]; state.flashcards._shuffledIdx=false; renderFlashcards(); };
    modeRow.appendChild(b);
  });
  el.appendChild(modeRow);

  let workingSet;
  if(state.flashcards.flashReviewMode){
    if(!state.flashcards.reviewQueue.length) state.flashcards.reviewQueue=buildReviewQueue();
    workingSet=state.flashcards.reviewQueue;
    if(!workingSet.length){
      const winBox=document.createElement("div");
      winBox.style.cssText="text-align:center;padding:60px 0;color:var(--muted);animation:winPop 0.45s var(--ease-spring) both;";
      winBox.appendChild(mk("div","🎉","font-size:48px;margin-bottom:16px;"));
      winBox.appendChild(mk("p","Por hoy terminaste","font-weight:700;font-size:15px;color:#94a3b8;margin-bottom:6px;"));
      winBox.appendChild(mk("p","Vuelve mañana o cambia a Todas.","font-size:13px;font-weight:500;"));
      el.appendChild(winBox);
      if(state.app._reviewPlan&&!state.app._reviewPlan.done){
        var cont=mk("button","✅  Siguiente →","width:calc(100% - 40px);margin:0 20px;padding:14px;border-radius:12px;border:none;background:rgba(78,205,196,0.12);color:#4ECDC4;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;");
        cont.onclick=function(){nextReviewStep();};
        el.appendChild(cont);
      }
      return;
    }
  } else {
    workingSet=state.session.saved.map(function(_,i){return i;});
    if(state.flashcards._shuffledIdx) workingSet=workingSet.sort(function(){return Math.random()-0.5;});
  }

  state.flashcards.flashIdx=state.flashcards.flashIdx%workingSet.length;
  const phIdx=workingSet[state.flashcards.flashIdx];
  const ph=state.session.saved[phIdx];
  ensureSrsFields(ph);
  let flipped=false;
  function stopPracticingCurrent(){
    if(!ph) return;
    if(!confirm('¿Borrar esta tarjeta de tus guardadas? Ya no aparecerá para practicar.')) return;
    var removed=state.session.saved.splice(phIdx,1)[0];
    if(state.flashcards.flashReviewMode){
      state.flashcards.reviewQueue=state.flashcards.reviewQueue.filter(function(i){return i!==phIdx;}).map(function(i){return i>phIdx?i-1:i;});
      state.flashcards.flashIdx=0;
    } else {
      state.flashcards.flashIdx=Math.min(state.flashcards.flashIdx, Math.max(0,state.session.saved.length-1));
      state.flashcards._shuffledIdx=false;
    }
    updateBadge(); syncUp(); showToast('Tarjeta borrada: '+(removed&&removed.de?removed.de:''),'success');
    renderFlashcards();
  }

  const counter=mk("p",(state.flashcards.flashIdx+1)+" de "+workingSet.length+(state.flashcards.flashReviewMode?" pendientes":"")+"  ·  Caja "+ph.box+"/5","color:var(--muted);font-size:12px;text-align:center;margin-bottom:14px;font-weight:600;letter-spacing:0.02em;");
  el.appendChild(counter);

  const card=document.createElement("div"); card.className="flashcard";
  state.flashcards._flashcardEl=card;
  const inner=document.createElement("div"); inner.className="flashcard-inner";
  card.appendChild(inner);

  const front=mk("div","",""); front.className="flashcard-face flashcard-front";
  var deMark=mk("div","","display:flex;justify-content:center;margin-bottom:20px;color:rgba(245,166,35,0.75);");
  deMark.appendChild(langBadge("DE","rgba(245,166,35,0.75)"));
  front.appendChild(deMark);
  front.appendChild(mk("p",ph.de,"font-size:22px;font-weight:900;color:var(--text);line-height:1.4;margin-bottom:16px;letter-spacing:-0.02em;"));
  const playF=document.createElement("button");
  playF.style.cssText="background:rgba(245,166,35,0.12);border:1px solid rgba(245,166,35,0.3);color:#F5A623;border-radius:20px;padding:7px 18px;font-size:13px;font-weight:700;transition:background 0.2s;";
  playF.textContent="▶ Escuchar";
  playF.onclick=function(e){e.stopPropagation();speak(ph.de);};
  front.appendChild(playF); inner.appendChild(front);

  const back=mk("div","",""); back.className="flashcard-face flashcard-back";
  var esMark=mk("div","","display:flex;justify-content:center;margin-bottom:20px;color:rgba(78,205,196,0.75);");
  esMark.appendChild(langBadge("ES","rgba(78,205,196,0.75)"));
  back.appendChild(esMark);
  back.appendChild(mk("p",ph.es,"font-size:20px;color:var(--text);line-height:1.45;margin-bottom:10px;font-weight:600;"));
  if(ph.tip) back.appendChild(mk("p","💡 "+ph.tip,"font-size:13px;color:var(--muted);font-style:italic;font-weight:500;"));
  inner.appendChild(back);

  card.onclick=function(){
    flipped=!flipped;
    card.classList.toggle("flipped",flipped);
    card.style.borderColor=flipped?"rgba(78,205,196,0.35)":"rgba(245,166,35,0.2)";
    card.style.background=flipped?"linear-gradient(135deg,rgba(78,205,196,0.07),rgba(78,205,196,0.02))":"linear-gradient(135deg,rgba(245,166,35,0.09),rgba(245,166,35,0.03))";
    if(flipped){
      gradeRow.style.opacity="1";
      gradeRow.style.pointerEvents="auto";
      gradeRow.style.filter="blur(0)";
    } else {
      gradeRow.style.opacity="0.3";
      gradeRow.style.pointerEvents="none";
      gradeRow.style.filter="blur(2px)";
    }
  };
  el.appendChild(card);
  el.appendChild(mk("p","Toca para ver la traducción y calificar","color:var(--dim);font-size:12px;text-align:center;margin-bottom:14px;font-weight:500;"));

  // Grade row (visible after flip)
  const gradeRow=document.createElement("div");
  gradeRow.style.cssText="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;opacity:0.3;pointer-events:none;filter:blur(2px);transition:opacity 0.25s cubic-bezier(.16,1,.3,1),filter 0.25s";
  const grades=[
    {k:"fail",  lbl:"Fallé",   col:"#F87171", days:"hoy"},
    {k:"hard",  lbl:"Dificil", col:"#fbbf24", days:BOX_INTERVALS[ph.box]+"d"},
    {k:"good",  lbl:"Bien",    col:"#4ade80", days:BOX_INTERVALS[Math.min(5,ph.box+1)]+"d"},
    {k:"easy",  lbl:"Fácil",   col:"#4ECDC4", days:BOX_INTERVALS[Math.min(5,ph.box+2)]+"d"}
  ];
  state.flashcards._gradeBtns=[];
  grades.forEach(function(g){
    const b=document.createElement("button");
    b.className="grade-btn";
    b.style.cssText="border-radius:12px;padding:10px 6px;font-size:12px;font-weight:800;display:flex;flex-direction:column;gap:2px;transition:background 0.15s,transform 0.1s;";
    b.style.setProperty("--grade-color",g.col);
    b.style.background="rgba("+hexToRgb(g.col)+",0.1)";
    b.style.borderColor=g.col+"55";
    b.style.color=g.col;
    b.innerHTML=g.lbl+"<span style='font-size:10px;font-weight:600;opacity:0.7;'>"+g.days+"</span>";
    b.onclick=function(){
      // Celebrate: bounce card on easy/good
      if(g.k==="easy"||g.k==="good") celebrate(card,"celebratePop","0.35s");
      // Flash the grade button
      celebrate(b,"celebrateFlash","0.4s");
      srsUpdate(ph, g.k);
      logActivity("phrasesReviewed",1);
      syncUp();
      // advance: in review mode, remove this index from queue; in all-mode, just next
      if(state.flashcards.flashReviewMode){
        state.flashcards.reviewQueue=state.flashcards.reviewQueue.filter(function(i){return i!==phIdx;});
        state.flashcards.flashIdx=0;
      } else {
        state.flashcards.flashIdx=(state.flashcards.flashIdx+1)%state.session.saved.length;
      }
      renderFlashcards();
    };
    state.flashcards._gradeBtns.push(b);
    gradeRow.appendChild(b);
  });
  el.appendChild(gradeRow);

  // Always-on navigation (small)
  const nav=mk("div","","display:flex;gap:10px;margin-top:6px;");
  const skip=mk("button","Saltar →","flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;border-radius:12px;padding:10px;font-size:13px;font-weight:700;");
  skip.onclick=function(){
    if(state.flashcards.flashReviewMode){ state.flashcards.reviewQueue.push(state.flashcards.reviewQueue.shift()); }
    else { state.flashcards.flashIdx=(state.flashcards.flashIdx+1)%state.session.saved.length; }
    renderFlashcards();
  };
  const remove=mk("button","Borrar / Ya no practicar","flex:1;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.22);color:#F87171;border-radius:12px;padding:10px;font-size:13px;font-weight:800;");
  remove.title="Borrar esta tarjeta de guardadas";
  remove.setAttribute("aria-label","Borrar esta tarjeta y dejar de practicarla");
  remove.onclick=stopPracticingCurrent;
  nav.appendChild(skip); nav.appendChild(remove); el.appendChild(nav);

  const shuffle=mk("button","🔀  Mezclar","width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.1);color:var(--muted);border-radius:14px;padding:10px;font-size:13px;font-weight:600;margin-top:10px;");
  shuffle.onclick=function(){
    if(state.flashcards.flashReviewMode) state.flashcards.reviewQueue=[...state.flashcards.reviewQueue].sort(function(){return Math.random()-0.5;});
    else state.flashcards._shuffledIdx=true;
    state.flashcards.flashIdx=0; renderFlashcards();
  };
  el.appendChild(shuffle);
}

function renderVocabTable(host){
  host.innerHTML="";
  const today=todayKey();
  const sortField={cat:"category",de:"de",es:"es",box:"box",nextReview:"nextReview",lapses:"lapses"}[state.guardadas.vocabSortCol]||state.guardadas.vocabSortCol;
  const list=[...state.session.saved].sort(function(a,b){
    let va=a[sortField]||"", vb=b[sortField]||"";
    if(state.guardadas.vocabSortCol==="box"||state.guardadas.vocabSortCol==="lapses"){ va=Number(va)||0; vb=Number(vb)||0; }
    if(state.guardadas.vocabSortCol==="nextReview"){ va=String(va); vb=String(vb); }
    if(va<vb) return state.guardadas.vocabSortAsc?-1:1;
    if(va>vb) return state.guardadas.vocabSortAsc?1:-1;
    return 0;
  });
  host.style.overflowX="auto"; host.style.webkitOverflowScrolling="touch";
  const table=document.createElement("table");
  table.style.cssText="width:100%;min-width:520px;border-collapse:collapse;font-size:13px;";
  const thead=document.createElement("thead");
  const hrow=document.createElement("tr");
  ["de","es","cat","box","nextReview","lapses"].forEach(function(col){
    const th=document.createElement("th");
    th.style.cssText="padding:8px 10px;text-align:left;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.08);cursor:pointer;user-select:none;white-space:nowrap;";
    const arrow=state.guardadas.vocabSortCol===col?(state.guardadas.vocabSortAsc?" ▲":" ▼"):"";
    th.textContent=col.toUpperCase()+arrow;
    th.onclick=function(){
      if(state.guardadas.vocabSortCol===col) state.guardadas.vocabSortAsc=!state.guardadas.vocabSortAsc;
      else{ state.guardadas.vocabSortCol=col; state.guardadas.vocabSortAsc=true; }
      renderVocabTable(host);
    };
    hrow.appendChild(th);
  });
  thead.appendChild(hrow); table.appendChild(thead);

  const tbody=document.createElement("tbody");
  list.forEach(function(ph){
    ensureSrsFields(ph);
    const tr=document.createElement("tr");
    tr.className="stat-row-hover";
    tr.style.cssText="border-bottom:1px solid rgba(255,255,255,0.04);";
    const boxColors=["#F87171","#F5A623","#4ECDC4","#4ade80","#A78BFA","#F5A623"];
    const vals=[
      {text:ph.de, style:"font-weight:700;color:var(--text);"},
      {text:ph.es, style:"color:var(--text);"},
      {text:ph.category||"-", style:"color:var(--gold-text);font-weight:600;font-size:11px;"},
      {text:String(ph.box), style:"color:"+(boxColors[ph.box]||"#94a3b8")+";font-weight:800;text-align:center;"},
      {text:ph.nextReview, style:(ph.nextReview<=today?"color:var(--red-text);font-weight:700;":"color:var(--muted);")},
      {text:String(ph.lapses||0), style:"color:var(--muted);text-align:center;"}
    ];
    vals.forEach(function(v){
      const td=document.createElement("td");
      td.style.cssText="padding:8px 10px;"+v.style;
      td.textContent=v.text;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  host.appendChild(table);
  host.appendChild(mk("p",list.length+" frase(s)","margin-top:8px;font-size:12px;color:var(--muted);font-weight:600;"));
}

function exportSavedCsv(){
  if(!state.session.saved.length) return;
  function esc(s){ s=String(s||""); if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"'; return s; }
  const lines=["de,es,tip,category,box,nextReview,lapses"];
  state.session.saved.forEach(function(p){ ensureSrsFields(p); lines.push([esc(p.de),esc(p.es),esc(p.tip||""),esc(p.category||""),p.box,p.nextReview,p.lapses||0].join(",")); });
  const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="deutschlernen-frases-"+todayKey()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

// ── Full Progress JSON Export ────────────────────────────────────────────────
function exportFullProgress(){
  const _t=todayKey();
  const str=computeStreak();
  const lvlPct=computeLevelProgress();
  var weekMins=weeklyMinutes();
  var due=reviewDueCount();

  // dailyLog → 30-day window for readability
  var recentLog={};
  var recentLevelLog={};
  for(var i=29;i>=0;i--){
    var dk=addDays(_t,-i);
    if(state.session.dailyLog[dk]) recentLog[dk]=state.session.dailyLog[dk];
    else recentLog[dk]={minutes:0,phrasesReviewed:0,drillsDone:0};
    if(state.session.levelLog&&typeof state.session.levelLog[dk]==="number") recentLevelLog[dk]=state.session.levelLog[dk];
  }

  var payload={
    exportDate: _t,
    level: state.app.level,
    levelProgressPercent: lvlPct,
    streak: str,
    streakLabel: str+(str===1?" dia":" dias")+" seguidos",
    weeklyMinutes: weekMins,
    weeklyGoal: state.session.weeklyGoal,
    totalPhrases: state.session.sessionPhrases,
    totalMinutes: state.session.sessionMinutes,
    savedPhrases: state.session.saved.length,
    reviewDueCount: due,
    grammarStats: state.grammar.grammarStats||{},
    errorJournalCount: (state.session.errorJournal||[]).length,
    errorJournal: (state.session.errorJournal||[]).slice(0,100),
    chatLogsCount: state.session.chatLogs.length,
    shownPhrasesTopics: Object.keys(state.session.shownPhrases||{}).length,
    dailyLog: state.session.dailyLog,
    dailyLogLast30Days: recentLog,
    levelLog: state.session.levelLog||{},
    levelLogLast30Days: recentLevelLog
  };

  var json=JSON.stringify(payload,null,2);
  var blob=new Blob([json],{type:"application/json;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="deutschlernen-progreso-"+_t+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  showToast("Progreso exportado → deutschlernen-progreso-"+_t+".json","success");
}

state.chat._postChatRunning=false;
async function runPostChatAnalysis(){
  if(state.chat._postChatRunning) return;
  if(!state.chat.chatHistory||state.chat.chatHistory.length<4) return; // need at least 2 user turns + 2 bot
  const userTurns=state.chat.chatHistory.filter(function(m){return m.role==="user";});
  if(userTurns.length<2) return;
  state.chat._postChatRunning=true;
  // Build modal overlay
  const overlay=document.createElement("div");
  overlay.className="modal-overlay";
  overlay.style.cssText="position:fixed;inset:0;background:rgba(6,6,14,0.85);backdrop-filter:blur(8px);z-index:9000;display:flex;align-items:flex-start;justify-content:center;padding:24px 14px;overflow-y:auto;";
  let releaseFocus=null;
  function closeModal(){ if(releaseFocus) releaseFocus(); if(overlay.parentNode) overlay.remove(); }
  overlay._closeModal=closeModal;
  overlay.onclick=function(e){ if(e.target===overlay) closeModal(); };
  const box=document.createElement("div");
  box.style.cssText="background:var(--modal-post-bg);border:1px solid rgba(245,166,35,0.25);border-radius:18px;padding:20px;max-width:560px;width:100%;margin-top:30px;box-shadow:0 12px 40px rgba(0,0,0,0.5);";

  const closeBtn=mk("button","✕","background:none;border:none;color:#64748b;font-size:18px;font-weight:700;");

  loading.appendChild(skelCard(3));

  overlay.appendChild(box); document.body.appendChild(overlay);
  releaseFocus=trapFocus(box,closeModal);

  try {
    const transcript=state.chat.chatHistory.map(function(m){return (m.role==="user"?"Sebastian":"Otro")+": "+m.content;}).join("\n");
    const sys='Analyze this German conversation. Sebastian is the learner (Spanish speaker, '+state.app.level+'). Reply ONLY with valid JSON, no markdown: {"errors":[{"wrong":"","right":"","why":"short Spanish explanation"}],"vocab":[{"de":"","es":""}],"suggestedPhrases":[{"de":"","es":"","tip":"<8 words"}]}. Max 4 errors, 5 vocab items, 3 suggested phrases. If no errors, return empty array.';
    const reply=await ai(sys,[{role:"user",content:transcript}], 1200);
    const clean=reply.replace(/```json|```/g,"").trim();
    const m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error("no JSON");

    if(Array.isArray(r.errors) && r.errors.length){
      const b=document.createElement("div");
      b.style.cssText="background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.2);border-radius:14px;padding:14px;margin-bottom:10px;";
      b.appendChild(mk("p","⚠️  QUE MEJORAR","font-size:10px;color:var(--red-text);letter-spacing:2px;font-weight:700;margin-bottom:8px;"));
      r.errors.forEach(function(e){
        const row=mk("div","","padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05);");
        row.appendChild(mk("p","✗ "+e.wrong,"font-size:13px;color:var(--red-text);font-weight:600;text-decoration:line-through;"));
        row.appendChild(mk("p","✓ "+e.right,"font-size:14px;color:var(--green-text);font-weight:700;margin-top:2px;"));
        if(e.why) row.appendChild(mk("p",e.why,"font-size:11px;color:var(--muted);margin-top:3px;font-weight:500;"));
        b.appendChild(row);

    }
    if(Array.isArray(r.vocab) && r.vocab.length){
      const b=document.createElement("div");
      b.style.cssText="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:10px;";
      b.appendChild(mk("p","🔑  VOCABULARIO","font-size:10px;color:#94a3b8;letter-spacing:2px;font-weight:700;margin-bottom:8px;"));

        row.appendChild(mk("span",w.es,"font-size:12px;color:#94a3b8;font-weight:500;"));
        b.appendChild(row);
      });

      const b=document.createElement("div");
      b.style.cssText="background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:14px;padding:14px;margin-bottom:10px;";
      b.appendChild(mk("p","💬  FRASES PARA GUARDAR","font-size:10px;color:#A78BFA;letter-spacing:2px;font-weight:700;margin-bottom:8px;"));
      r.suggestedPhrases.forEach(function(ph){
        const card=mk("div","","background:rgba(255,255,255,0.03);border-radius:10px;padding:10px;margin-top:6px;display:flex;gap:8px;align-items:center;");

        t.appendChild(mk("p",ph.es,"font-size:12px;color:#94a3b8;margin-top:2px;font-weight:500;"));
        const star=document.createElement("button"); star.className="icon-btn"; star.setAttribute("aria-label","Guardar"); star.style.fontSize="18px";
        var phraseSaved=state.session.saved.some(function(x){return x.de===ph.de;});
        star.style.color=phraseSaved?"#F5A623":"#334155";
        setSaveIcon(star,phraseSaved);
        star.onclick=function(){
          if(!state.session.saved.some(function(x){return x.de===ph.de;})){
            state.session.saved.push(ensureSrsFields({de:ph.de,es:ph.es,tip:ph.tip||"",source:"conversar"}));
            star.style.color="#F5A623"; setSaveIcon(star,true); updateBadge(); syncUp();
          }
        };
        card.appendChild(t); card.appendChild(star); b.appendChild(card);
      });
      box.appendChild(b);
    }
    if(!(r.errors||[]).length && !(r.vocab||[]).length && !(r.suggestedPhrases||[]).length){
      box.appendChild(mk("p","🎉 Sin observaciones. Sigue asi.","color:var(--green-text);font-size:14px;text-align:center;padding:20px 0;font-weight:600;"));
    }
    const ok=mk("button","Cerrar","width:100%;background:#F5A623;color:#000;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;margin-top:8px;");
    ok.onclick=closeModal; box.appendChild(ok);
  } catch(e){
    loading.remove();
    box.appendChild(mk("p","No pude analizar: "+e.message,"color:#ef4444;font-size:13px;text-align:center;padding:20px 0;font-weight:500;"));
    const ok=mk("button","Cerrar","width:100%;background:rgba(255,255,255,0.06);color:#94a3b8;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;margin-top:4px;");
    ok.onclick=closeModal; box.appendChild(ok);
  }
  state.chat._postChatRunning=false;
}

function generateLectura(topicId,host){
  const ta=host.querySelector("#lectura-text");
  ta.innerHTML=""; ta.style.cssText="padding:20px;";
  ta.appendChild(skelCard(6));
  const topicLabels={daily:"daily life",travel:"traveling in Germany",work:"at the workplace",tech:"technology and IT",food:"ordering food at a restaurant",nature:"a walk in nature",feelings:"expressing emotions"};
  var topicLabel=topicLabels[topicId]||"daily life";
  var sys='You are a German language teacher. Generate a short German text about '+topicLabel+' at '+state.app.level+' level. Reply ONLY with valid JSON, no markdown: {"text":"the German text (3-5 sentences, natural, no translations in the text)","words":[{"de":"German word","es":"Spanish meaning"}]}. Include 8-12 key words in the words array. Level '+state.app.level+'.';
  ai(sys,[{role:"user",content:"Generate a reading passage."}],1200).then(function(reply){
    var clean=reply.replace(/```json|```/g,"").trim();
    var m=clean.match(/\{[\s\S]*\}/); if(!m) throw new Error("no JSON");
    var obj=JSON.parse(m[0]);
    ta.innerHTML="";
    // Build word lookup
    var wordMap={};
    (obj.words||[]).forEach(function(w){wordMap[w.de.toLowerCase()]=w.es;});
    // Render text with clickable words
    var textEl=mk("div","","font-size:17px;line-height:1.8;color:var(--text);font-weight:500;margin-bottom:16px;");
    var words=obj.text.split(/(\s+)/);
    state.lectura._lecturaWords=[];
    state.lectura._lecturaTarget=-1;
    words.forEach(function(w,i){
      if(/^\s+$/.test(w)){textEl.appendChild(document.createTextNode(w));return;}
      var cleanW=w.replace(/[.,!?;:"'()]/g,"");
      var btn=document.createElement("button");
      btn.type="button";
      btn.className="lectura-word";
      btn.textContent=w;
      btn.onclick=function(e){
        e.stopPropagation();
        var wasActive=btn.classList.contains("active");
        var prevActive=textEl.querySelector(".lectura-word.active");
        if(prevActive) prevActive.classList.remove("active");
        if(wasActive){ state.lectura._lecturaTarget=-1; hideLecturaTranslation(); return; }
        btn.classList.add("active");
        state.lectura._lecturaTarget=i;
        var trans=wordMap[cleanW.toLowerCase()]||state.lectura._wordCache[cleanW.toLowerCase()]||null;
        // Find sentence containing this word for context
        var contextSentence="";
        var sentences=obj.text.split(/[.!?]+/);
        for(var si=0;si<sentences.length;si++){
          if(sentences[si].toLowerCase().indexOf(cleanW.toLowerCase())>=0){
            contextSentence=sentences[si].trim()+".";
            break;
          }
        }
        showLecturaTranslation(w,cleanW,trans,host,contextSentence,this);
      };
      state.lectura._lecturaWords.push(cleanW);
      textEl.appendChild(btn);
    });
    ta.appendChild(textEl);
    // Audio button
    var playBtn=document.createElement("button");
    playBtn.className="gen-btn gen-btn-teal";
    playBtn.textContent="🔊 Escuchar texto";
    playBtn.onclick=function(){speak(obj.text);};
    ta.appendChild(playBtn);
    // Copy button
    var copyBtn=document.createElement("button");
    copyBtn.className="gen-btn gen-btn-muted";
    copyBtn.textContent="📋 Copiar texto";
    copyBtn.onclick=function(){navigator.clipboard.writeText(obj.text).then(function(){showToast("Texto copiado","success");}).catch(function(){showToast("No se pudo copiar","error");});};
    ta.appendChild(copyBtn);
    // New text button
    var newBtn=document.createElement("button");
    newBtn.className="gen-btn gen-btn-muted";
    newBtn.textContent="🔄 Otro texto";
    newBtn.onclick=function(){generateLectura(topicId,host);};
    ta.appendChild(newBtn);
  }).catch(function(e){
    ta.innerHTML="";
    ta.appendChild(mk("p","Error al generar texto. Intenta de nuevo.","color:#ef4444;font-size:13px;text-align:center;margin-top:20px;font-weight:500;"));
    var retry=mk("button","Reintentar","margin-top:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;border-radius:12px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;");
    retry.onclick=function(){generateLectura(topicId,host);};
    ta.appendChild(retry);
  });
}

function showLecturaTranslation(rawWord,cleanWord,knownTranslation,host,contextSentence,spanEl){

function renderGramatica() {

  GRAMMAR_TOPICS.forEach(function(t){

    // Progress bar
    var gs=state.grammar.grammarStats[t.key];
    var pct=gs ? Math.round(gs.right/(gs.right+gs.wrong)*100) : 0;
    var barColor=!gs ? "var(--muted)" : pct>=80 ? "#4ade80" : pct>=40 ? "#F5A623" : "#F87171";
    var barOuter=document.createElement("div");
    barOuter.style.cssText="width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:6px;overflow:hidden;";

async function loadGrammarDrills(topic){
  const el=document.getElementById("s-gramatica"); el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="← Volver";
  back.onclick=renderGramatica;
  top.appendChild(back);
  top.appendChild(mk("span",topic.label,"font-size:13px;color:var(--text);font-weight:700;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.style.cssText="display:flex;flex-direction:column;gap:12px;";
  for(var gi=0;gi<3;gi++){loading.appendChild(skelCard(5));}
  el.appendChild(loading);

  try {
    const sys='Generate 5 German grammar multiple-choice drills for topic: '+topic.label+'. Reply ONLY with a valid JSON array, no markdown: [{"prompt":"German sentence with ___ blank","options":["a","b","c","d"],"answer":"correct option exactly","explain":"<15 words Spanish"}]. Level '+lvlRange()+'. Options must be plausible distractors.';
    const text=await ai(sys,[{role:"user",content:"topic: "+topic.label}], 1400);
    state.grammar._gramDrills=parseJSONArray(text);
    state.grammar._gramIdx=0; state.grammar._gramCorrect=0; state.grammar._gramMissed=[];
    el.removeChild(loading);
    renderDrillStep(el, topic);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
  }
}

function renderDrillStep(el, topic){
  // Clear all but the top nav
  while(el.children.length>1) el.removeChild(el.lastChild);

  if(state.grammar._gramIdx>=state.grammar._gramDrills.length){
    const done=document.createElement("div");
    done.style.cssText="background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:16px;padding:24px;text-align:center;";
    done.appendChild(mk("div","🎉","font-size:48px;margin-bottom:8px;"));
    done.appendChild(mk("p","Terminaste!","font-size:18px;font-weight:800;color:var(--text);margin-bottom:6px;"));
    done.appendChild(mk("p",state.grammar._gramCorrect+" / "+state.grammar._gramDrills.length+" correctas","font-size:14px;color:#A78BFA;font-weight:700;"));
    el.appendChild(done);
    // Save per-topic grammar stats
    var prev=state.grammar.grammarStats[topic.key]||{right:0,wrong:0,lastPracticed:"",streak:0};
    var wrong=state.grammar._gramDrills.length-state.grammar._gramCorrect;
    state.grammar.grammarStats[topic.key]={
      right: prev.right+state.grammar._gramCorrect,
      wrong: prev.wrong+wrong,
      lastPracticed: todayKey(),
      streak: (state.grammar._gramCorrect/state.grammar._gramDrills.length)>=0.6 ? prev.streak+1 : 0
    };
    // Log wrong answers to Fehlerjournal
    if(state.grammar._gramMissed.length){
      state.grammar._gramMissed.forEach(function(d){
        logError("grammar", d.prompt, d.answer, d.explain);
      });
    }
    // Generate grammar-review state.session.saved[] entries if wrong > right (no duplicates per topic+day)
    if(state.grammar.grammarStats[topic.key].wrong>state.grammar.grammarStats[topic.key].right){
      var hasToday=state.session.saved.some(function(p){return p.source==="grammar"&&p.tip==="grammar:"+topic.key&&p.nextReview===todayKey();});
      if(!hasToday){
        state.grammar._gramMissed.forEach(function(drill){
          state.session.saved.push(ensureSrsFields({de:drill.prompt,es:drill.answer+" — "+drill.explain,tip:"grammar:"+topic.key,source:"grammar",box:0,nextReview:todayKey()}));
        });
      }
    }
    const again=mk("button","Otra ronda","width:100%;background:#A78BFA;color:#000;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:800;margin-top:12px;");
    again.onclick=function(){loadGrammarDrills(topic);};
    el.appendChild(again);
    if(state.app._reviewPlan&&!state.app._reviewPlan.done){
      var cont=mk("button","✅  Siguiente →","width:100%;padding:13px;border-radius:14px;border:none;background:rgba(78,205,196,0.12);color:#4ECDC4;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;");
      cont.onclick=function(){nextReviewStep();};
      el.appendChild(cont);
    }
    logActivity("drillsDone", state.grammar._gramDrills.length); syncUp();
    return;
  }

  const d=state.grammar._gramDrills[state.grammar._gramIdx];
  const counter=mk("p","Ejercicio "+(state.grammar._gramIdx+1)+" / "+state.grammar._gramDrills.length,"color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px;letter-spacing:0.5px;");
  el.appendChild(counter);

  const card=document.createElement("div"); card.className="card"; card.style.padding="18px"; card.style.borderColor="rgba(167,139,250,0.2)";
  card.appendChild(mk("p",d.prompt,"font-size:18px;font-weight:800;color:var(--text);line-height:1.4;margin-bottom:14px;letter-spacing:-0.01em;"));
  const opts=mk("div","","display:flex;flex-direction:column;gap:8px;");
  let answered=false;
  d.options.forEach(function(opt){
    const b=document.createElement("button");
    b.style.cssText="text-align:left;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:var(--text);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;transition:background 0.15s,border-color 0.15s;cursor:pointer;";
    b.textContent=opt;
    b.dataset.option=opt;
    b.onclick=function(){
      if(answered) return; answered=true;
      const ok=opt===d.answer;
      if(ok){ state.grammar._gramCorrect++; b.textContent="✓ Correcta: "+opt; b.style.background="rgba(74,222,128,0.12)"; b.style.borderColor="#4ade80"; b.style.color="#4ade80"; }
      else { state.grammar._gramMissed.push(d); b.textContent="✗ Tu respuesta: "+opt; b.style.background="rgba(248,113,113,0.12)"; b.style.borderColor="#F87171"; b.style.color="#F87171"; }
      // Mark correct option green with text, not just color
      Array.prototype.slice.call(opts.children).forEach(function(other){
        if(other.dataset.option===d.answer && other!==b){ other.textContent="✓ Correcta: "+d.answer; other.style.background="rgba(74,222,128,0.12)"; other.style.borderColor="#4ade80"; other.style.color="#4ade80"; }
      });
      const ex=mk("p","💡 "+(d.explain||""),"font-size:12px;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.5;font-weight:500;");
      card.appendChild(ex);
      const next=mk("button",(state.grammar._gramIdx+1<state.grammar._gramDrills.length?"Siguiente →":"Ver resultado"),"width:100%;background:#A78BFA;color:#000;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:800;margin-top:10px;");
      next.onclick=function(){ state.grammar._gramIdx++; renderDrillStep(el, topic); };
      card.appendChild(next);
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  el.appendChild(card);
}

const CASOS_TIPS = {
  nom:"Tip: Nominativ es el sujeto: ¿quién hace o es algo? Es el artículo de diccionario.",
  akk:"Tip: Akkusativ es el objeto directo: ¿qué recibe la acción? En masculino der cambia a den.",
  dat:"Tip: Dativ aparece con mit/zu/bei y con el receptor: ¿a quién o para quién?",
  gen:"Tip: Genitiv marca posesión o 'de': des en masc/neutro y normalmente añade -s al sustantivo."
};
function casosCaseForQuestion(q){
  if(q.caso) return q.caso;
  var src=(q.de||q.frase||q.why||"");
  var m=src.match(/c-(nom|akk|dat|gen)|\b(Nominativ|Akkusativ|Dativ|Genitiv)\b/i);
  if(!m) return "";
  if(m[1]) return m[1];
  return {nominativ:"nom",akkusativ:"akk",dativ:"dat",genitiv:"gen"}[m[2].toLowerCase()]||"";
}
function casosFailureTip(q){
  var cs=casosCaseForQuestion(q);
  if(!cs || !CASOS_TIPS[cs]) return "";
  if(state.casos.casosWrongStreak>=2 || (state.casos.casosCaseMisses[cs]||0)>=2) return CASOS_TIPS[cs];
  return "";
}

  const legend=document.createElement("div"); legend.className="cs-legend";
  [

  });
  el.appendChild(legend);

  // Sub-tabs
  const sub=document.createElement("div"); sub.className="cs-subbar";
  [

    {id:"transformar",lbl:"2 · Transformar"},
    {id:"reglas",lbl:"3 · Reglas"},
    {id:"practicar",lbl:"4 · Practicar"}

    const b=document.createElement("button"); b.className="cs-subtab"+(state.casos.casosSubtab===s.id?" on":"");
    b.textContent=s.lbl;

}

function paintCasosTable(out, note){
  const n=CASOS_NOUNS[state.casos.casosNounIdx];
  const arts=CASOS_ART[state.casos.casosArt][n.gen];
  const genName={m:'masculino',f:'femenino',n:'neutro'}[n.gen];
  note.innerHTML="Género: <b style='color:var(--text2)'>"+genName+"</b>"
    +(n.weak?" · ojo, sustantivo débil (-n en Akk/Dat/Gen)":"")
    +(n.gen==='f'?" · el femenino casi no cambia":"");
  const frames=[
    function(a){return {de:cap(a)+" "+n.f[0]+" ist hier.", es:capEs(n.es)+" está aquí."};},
    function(a){return {de:"Ich sehe "+a+" "+n.f[1]+".", es:"Veo "+n.es+"."};},
    function(a){return {de:"Ich arbeite mit "+a+" "+n.f[2]+".", es:"Trabajo con "+n.es+"."};},
    function(a){return {de:"die Idee "+a+" "+n.f[3], es:"la idea de "+n.es};}
  ];
  out.innerHTML="";
  CASOS_CASES.forEach(function(cs,i){
    const fr=frames[i](arts[i]);
    const row=document.createElement("div"); row.className="cs-trow";
    row.innerHTML='<div class="cs-tlbl" style="background:var(--'+cs.cls+'-bg);color:var(--'+cs.cls+');">'
      +'<span class="cs-dot" style="background:'+cs.dot+';"></span>'+cs.name+'</div>'
      +'<div class="cs-tval"><div class="cs-bigword">'+arts[i]+' '+n.f[i]+'</div>'
      +'<div class="cs-exde">'+fr.de+'</div><div class="cs-exes">'+fr.es+'</div></div>';
    out.appendChild(row);
  });
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function capEs(s){return s.charAt(0).toUpperCase()+s.slice(1);}

function casosPracticar(host){

function casosShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function casosBuildPool(){ state.casos.casosPool=casosShuffle(state.casos.casosQuizModo==='all'?CASOS_Q:CASOS_Q.filter(function(q){return q.modo===state.casos.casosQuizModo;})); state.casos.casosIdx=0; }
function casosUpdateScore(){
  var h=document.getElementById("cs-hit"); if(!h) return;
  h.textContent=state.casos.casosHits; document.getElementById("cs-tot").textContent=state.casos.casosTotal;
  document.getElementById("cs-streak").textContent=state.casos.casosStreak;
  document.getElementById("cs-pct").textContent=state.casos.casosTotal?Math.round(state.casos.casosHits/state.casos.casosTotal*100)+'%':'—';
}
function casosNextQ(){ if(state.casos.casosIdx>=state.casos.casosPool.length){ state.casos.casosPool=casosShuffle(state.casos.casosPool); state.casos.casosIdx=0; } var m=document.getElementById("cs-quiz-mount"); if(m) casosRenderQ(m); }

function casosRenderQ(mount){
  if(!state.casos.casosPool.length){ mount.innerHTML="<p style='color:var(--muted);font-size:13px;text-align:center;padding:20px;'>Sin preguntas en este modo.</p>"; return; }
  if(state.casos.casosIdx>=state.casos.casosPool.length){ state.casos.casosPool=casosShuffle(state.casos.casosPool); state.casos.casosIdx=0; }
  const q=state.casos.casosPool[state.casos.casosIdx]; state.casos.casosAnswered=false;
  if(q.modo==='traduccion'){ casosRenderTrad(q,mount); return; }
  const modoLbl={articulo:'Elige el artículo',caso:'¿Qué caso es?',mov:'Movimiento o ubicación'}[q.modo];
  const frase=q.frase.replace('___','<span class="cs-blank">___</span>');
  mount.innerHTML='<div style="border:1px solid var(--border);border-radius:14px;padding:16px;background:rgba(255,255,255,0.03);">'
    +'<div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">'+modoLbl+'</div>'
    +'<p style="font-size:18px;line-height:1.5;margin-bottom:4px;color:var(--text);">'+frase+'</p>'

    +'<div class="cs-opts" id="cs-opts"></div>'
    +'<div id="cs-hint" style="margin-top:8px;display:none;padding:10px 12px;border-radius:10px;background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);color:var(--text);font-size:12px;font-weight:600;line-height:1.45;animation:fadeUp 0.15s ease;"></div>'
    +'<div id="cs-fb" style="margin-top:14px;display:none;"></div>'
    +'<div id="cs-next" style="margin-top:14px;display:none;justify-content:flex-end;">'
    +'<button id="cs-nextbtn" style="font-size:14px;font-weight:700;padding:10px 18px;border-radius:11px;border:0;background:var(--gold);color:#000;">Siguiente →</button></div>'
    +'</div>';
  const opts=document.getElementById("cs-opts");
  q.op.forEach(function(o){
    const b=document.createElement("button"); b.className="cs-opt"; b.textContent=o;
    b.onclick=function(){casosChoose(q,o,opts,b);};
    opts.appendChild(b);
  });
  // Hint button
  var hintBtn=mk("button","💡 Pista","margin-top:8px;background:transparent;border:1px dashed rgba(245,166,35,0.3);color:var(--gold-text);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;");
  hintBtn.setAttribute("aria-expanded","false");

    var h=document.getElementById("cs-hint");
    if(h.style.display==="block"){h.style.display="none";hintBtn.setAttribute("aria-expanded","false");return;}
    var css=casosCaseForQuestion(q);
    var tip=casosFailureTip(q)||(CASOS_TIPS[css]||"Pista: mira el verbo y la preposición para decidir el caso.");
    h.innerHTML="💡 "+tip; h.style.display="block"; hintBtn.setAttribute("aria-expanded","true");
  };
  opts.parentNode.insertBefore(hintBtn,opts.nextSibling);
  const nb=document.getElementById("cs-nextbtn"); if(nb) nb.onclick=function(){state.casos.casosIdx++;casosNextQ();};
}

function casosChoose(q,o,opts,btn){
  if(state.casos.casosAnswered) return; state.casos.casosAnswered=true;
  const correct=o===q.ok;
  state.casos.casosTotal++; if(correct){state.casos.casosHits++;state.casos.casosStreak++;state.casos.casosWrongStreak=0;} else {state.casos.casosStreak=0;state.casos.casosWrongStreak=(state.casos.casosWrongStreak||0)+1; var missCase=casosCaseForQuestion(q); if(missCase) state.casos.casosCaseMisses[missCase]=(state.casos.casosCaseMisses[missCase]||0)+1;}
  logActivity("drillsDone",1); syncUp();
  casosUpdateScore();
  Array.prototype.forEach.call(opts.children,function(b){
    if(b.textContent===q.ok) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
    b.style.pointerEvents="none";
  });
  const fb=document.getElementById("cs-fb");
  const caseNames={nom:'Nominativ',akk:'Akkusativ',dat:'Dativ',gen:'Genitiv'};
  const tag=q.caso?'<span class="cs-tag '+q.caso+'">'+caseNames[q.caso]+'</span> ':'';
  fb.style.display="block";
  fb.style.cssText="margin-top:14px;display:block;border-radius:12px;padding:13px;font-size:14px;background:"+(correct?"var(--akk-bg)":"rgba(248,113,113,0.08)")+";border:1px solid "+(correct?"var(--akk-line)":"rgba(248,113,113,0.25)")+";";
  var tip=correct?"":casosFailureTip(q);
  fb.innerHTML='<div style="font-weight:800;color:'+(correct?"#4ade80":"#F87171")+';margin-bottom:5px;">'+(correct?'✓ Correcto':'✗ Casi · la respuesta es '+q.ok)+'</div>'
    +'<div style="color:var(--text2);line-height:1.5;">'+tag+q.why+'</div>'
    +(tip?'<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(245,166,35,0.10);border:1px solid rgba(245,166,35,0.24);color:var(--text);font-size:13px;line-height:1.45;font-weight:600;">💡 '+tip+'</div>':'');
  document.getElementById("cs-next").style.display="flex";
}

function casosRenderTrad(q,mount){
  mount.innerHTML="";
  var targetText=q.de.replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
  var targetWords=targetText.replace(/[.!?]$/g,"").split(" ").filter(Boolean);
  var distractors=["ich","du","wir","der","die","das","ein","eine","einen","dem","den","mit","für","auf","neben","ist","bin","habe","mache","lerne","arbeite","suche","gut","wichtig"];
  var used={}; targetWords.forEach(function(w){used[w.toLowerCase()]=true;});
  var extras=distractors.filter(function(w){return !used[w.toLowerCase()];}).slice(0,4);
  var bank=casosShuffle(targetWords.concat(extras));
  var chosen=[];
  var card=mk("div","","border:1px solid var(--border);border-radius:14px;padding:16px;background:rgba(255,255,255,0.03);");
  card.appendChild(mk("div","Ordena las palabras","font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;"));
  card.appendChild(mk("p",q.es,"font-size:18px;line-height:1.5;margin-bottom:14px;color:var(--text);"));
  var answer=mk("div","","min-height:48px;border:1px dashed rgba(167,139,250,0.35);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;background:rgba(167,139,250,0.05);");
  var bankEl=mk("div","","display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;");
  var fb=mk("div","","display:none;margin-top:12px;padding:13px;border-radius:12px;font-size:14px;");
  var row=mk("div","","display:flex;gap:8px;margin-top:12px;");
  var check=mk("button","Comprobar","flex:1;font-size:14px;font-weight:800;padding:10px 16px;border-radius:11px;border:0;background:var(--gold);color:#000;");
  var clear=mk("button","Limpiar","font-size:14px;font-weight:700;padding:10px 16px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);");
  function normalize(s){return s.toLowerCase().replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();}
  function makeChip(word,fromAnswer){
    var b=document.createElement("button"); b.textContent=word;
    b.style.cssText="font-size:14px;font-weight:800;padding:9px 12px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,0.12);";
    b.onclick=function(){
      if(state.casos.casosAnswered) return;
      if(fromAnswer){ chosen.splice(chosen.indexOf(word),1); render(); }
      else { chosen.push(word); b.disabled=true; b.style.opacity="0.35"; renderAnswer(); }
    };
    return b;
  }
  function renderAnswer(){ answer.innerHTML=""; chosen.forEach(function(w){answer.appendChild(makeChip(w,true));}); }
  function render(){ bankEl.innerHTML=""; bank.forEach(function(w){var chip=makeChip(w,false); if(chosen.indexOf(w)>=0){chip.disabled=true;chip.style.opacity="0.35";} bankEl.appendChild(chip);}); renderAnswer(); }
  check.onclick=function(){
    if(state.casos.casosAnswered) return;
    var correct=normalize(chosen.join(" "))===normalize(targetWords.join(" "));
    state.casos.casosAnswered=true;
    state.casos.casosTotal++; if(correct){state.casos.casosHits++;state.casos.casosStreak++;state.casos.casosWrongStreak=0;} else {state.casos.casosStreak=0;state.casos.casosWrongStreak=(state.casos.casosWrongStreak||0)+1; var missCase=casosCaseForQuestion(q); if(missCase) state.casos.casosCaseMisses[missCase]=(state.casos.casosCaseMisses[missCase]||0)+1;}
    logActivity("drillsDone",1); syncUp(); casosUpdateScore();
    fb.style.display="block";
    fb.style.background=correct?"var(--akk-bg)":"rgba(248,113,113,0.08)";
    fb.style.border="1px solid "+(correct?"var(--akk-line)":"rgba(248,113,113,0.25)");
    var tip=correct?"":casosFailureTip(q);
    fb.innerHTML='<div style="font-weight:900;color:'+(correct?'#4ade80':'#F87171')+';margin-bottom:6px;">'+(correct?'✓ Correcto':'✗ Casi')+'</div>'
      +'<div style="font-size:16px;font-weight:700;color:var(--text);line-height:1.5;">'+q.de+'</div>'
      +'<div style="margin-top:6px;font-size:13px;color:var(--text2);line-height:1.5;">'+q.why+'</div>'
      +(tip?'<div style="margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(245,166,35,0.10);border:1px solid rgba(245,166,35,0.24);color:var(--text);font-size:13px;line-height:1.45;font-weight:600;">💡 '+tip+'</div>':'')
      +'<button id="cs-nexttrad" style="margin-top:12px;width:100%;font-size:14px;font-weight:800;padding:10px 16px;border-radius:11px;border:0;background:var(--gold);color:#000;">Siguiente →</button>';
    document.getElementById("cs-nexttrad").onclick=function(){state.casos.casosIdx++;casosNextQ();};
  };
  clear.onclick=function(){ if(state.casos.casosAnswered) return; chosen=[]; render(); };
  // Hint toggle — same per-question rule reminder as multiple-choice mode (case derived from q.de)
  var hintBox=mk("div","","display:none;margin-top:8px;padding:10px 12px;border-radius:10px;background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);color:var(--text);font-size:12px;font-weight:600;line-height:1.45;animation:fadeUp 0.15s ease;");
  var hintBtn=mk("button","💡 Pista","margin-top:8px;background:transparent;border:1px dashed rgba(245,166,35,0.3);color:var(--gold-text);border-radius:8px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;");
  hintBtn.setAttribute("aria-expanded","false");
  hintBtn.onclick=function(){
    if(hintBox.style.display==="block"){hintBox.style.display="none";hintBtn.setAttribute("aria-expanded","false");return;}
    var css=casosCaseForQuestion(q);
    hintBox.textContent="💡 "+(CASOS_TIPS[css]||"Identifica la función (sujeto, objeto, receptor) para elegir el caso.");
    hintBox.style.display="block"; hintBtn.setAttribute("aria-expanded","true");
  };
  card.appendChild(answer); card.appendChild(bankEl); card.appendChild(hintBtn); card.appendChild(hintBox); row.appendChild(check); row.appendChild(clear); card.appendChild(row); card.appendChild(fb); mount.appendChild(card); render();
}

  lvlBar.appendChild(lvlFill); lvlBox.appendChild(lvlBar);
  var eff=state.session.saved.filter(function(p){return (p.box||0)>=2;}).length;
  var avgBx=state.session.saved.length?state.session.saved.reduce(function(s,p){return s+(p.box||0);},0)/state.session.saved.length:0;
  var gk=Object.keys(state.grammar.grammarStats||{}).length;
  var str=computeStreak();
  var breakdown=mk("div","","display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:8px;font-weight:500;");
  breakdown.appendChild(mk("span","Voc: "+eff+"→B1",""));

  breakdown.appendChild(mk("span","Gram: "+gk+"/"+GRAMMAR_TOPICS.length,""));
  breakdown.appendChild(mk("span","Racha: "+str+"d",""));
  lvlBox.appendChild(breakdown);
  el.appendChild(lvlBox);

  // ── Level History Chart (SVG) ──
  var histCard=document.createElement("div"); histCard.className="card";
  histCard.appendChild(mk("p","📈  NIVEL — HISTORIAL","font-size:10px;color:var(--gold-text);letter-spacing:2px;margin-bottom:12px;font-weight:700;"));
  histCard.appendChild(mk("p","Curva de porcentaje de nivel CEFR en el tiempo.","font-size:12px;color:var(--muted);line-height:1.45;margin-top:-6px;margin-bottom:10px;font-weight:500;"));
  var _pts=[];
  for(var _i=29;_i>=0;_i--){var _k=addDays(todayKey(),-_i);var _pct=state.session.levelLog&&state.session.levelLog[_k];if(typeof _pct==="number")_pts.push({date:_k,pct:_pct});}
  if(_pts.length>=2){
    var _cW=1000,_cH=200,_pT=20,_pR=20,_pB=30,_pL=40,_chW=_cW-_pL-_pR,_chH=_cH-_pT-_pB;
    var _mn=Math.max(0,Math.min.apply(null,_pts.map(function(p){return p.pct;}))-5);
    var _mx=Math.min(100,Math.max.apply(null,_pts.map(function(p){return p.pct;}))+5);
    var _rng=_mx-_mn||1;
    function _xS(i){return _pL+(i/(_pts.length-1))*_chW;}
    function _yS(v){return _pT+_chH-((v-_mn)/_rng)*_chH;}
    var _lnPts=_pts.map(function(p,i){return _xS(i)+","+_yS(p.pct);}).join(" ");
    var _arPts=_pL+","+_yS(_mn)+" "+_lnPts+" "+_xS(_pts.length-1)+","+_yS(_mn);
    var _sId="lgH"+Date.now();
    var _yLbls=[];
    for(var _yl=0;_yl<=100;_yl+=25){if(_yl>=_mn&&_yl<=_mx)_yLbls.push(_yl);}
    var _xLbls=_pts.filter(function(_,i){return i%Math.max(1,Math.floor(_pts.length/5))===0||i===_pts.length-1;});

// ── Insight Semanal ──
function getWeekKey(){
  var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  var w=Math.floor((d.getTime()-new Date(d.getFullYear(),0,4).getTime())/604800000);
  return d.getFullYear()+"-W"+(w<10?"0":"")+w;
}
function getInsightData(){
  var topLapses=[...state.session.saved].filter(function(p){return p.lapses>0;}).sort(function(a,b){return b.lapses-a.lapses;}).slice(0,5);
  var gram=state.grammar.grammarStats||{};
  var weakestGrammar=null, weakestRate=1;
  Object.keys(gram).forEach(function(k){var s=gram[k];var total=(s.right||0)+(s.wrong||0);if(total){var rate=(s.right||0)/total;if(rate<weakestRate){weakestRate=rate;weakestGrammar=k;}}});
  var wDays=0, weekReviews=0, weekDrills=0, weekMinutes=0;
  for(var i=6;i>=0;i--){ var k=addDays(todayKey(),-i); var e=state.session.dailyLog[k]||{}; if(e.minutes||e.phrasesReviewed||e.drillsDone) wDays++; weekMinutes+=(e.minutes||0); weekReviews+=(e.phrasesReviewed||0); weekDrills+=(e.drillsDone||0); }
  var learned="Esta semana estuviste activo "+wDays+" de 7 días: "+weekMinutes+" min, "+weekReviews+" flashcards y "+weekDrills+" drills.";
  var error=topLapses.length?"La tarjeta que más se repite es “"+topLapses[0].de+"” ("+(topLapses[0].lapses||0)+" fallos).":"Todavía no hay una palabra claramente problemática.";
  if(weakestGrammar) error+=" Gramática más débil: "+weakestGrammar+".";
  var tip=topLapses.length?"Hoy repasa primero las más falladas y después haz 1 ronda corta de gramática.":"Guarda 5 frases nuevas y haz una ronda de flashcards para crear historial real.";
  return {learned:learned, error:error, tip:tip};
}
function renderInsight(host){
  host.innerHTML="";
  host.style.maxHeight="2000px";
  var week=getWeekKey();
  var d=getInsightData();
  var learned=d.learned, error=d.error, tip=d.tip;
  host.innerHTML="<div style='padding:10px 0;'>"+
    "<div style='margin-bottom:12px;'><p style='font-size:11px;color:var(--teal-text);font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>📖 Qué hiciste</p><p style='font-size:14px;color:var(--text);font-weight:600;line-height:1.5;'>"+learned+"</p></div>"+
    "<div style='margin-bottom:12px;'><p style='font-size:11px;color:var(--red-text);font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>⚠️ Qué conviene reforzar</p><p style='font-size:14px;color:var(--text);font-weight:600;line-height:1.5;'>"+error+"</p></div>"+
    "<div style='background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);border-radius:12px;padding:12px;'><p style='font-size:11px;color:var(--gold-text);font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>💡 Próximo paso</p><p style='font-size:14px;color:var(--gold-text);font-weight:700;line-height:1.5;'>"+tip+"</p></div>"+
    "<p style='font-size:10px;color:var(--dim);margin-top:12px;'>Semana "+week+" · Datos locales de los últimos 7 días</p></div>";
}

  {de:"Ich lerne seit sechs Monaten Deutsch.",es:"Llevo seis meses aprendiendo alemán."},

];

function renderShadowing(){
  const el=document.getElementById("s-shadowing"); el.innerHTML="";
  const hdr=mk("div","","margin-bottom:16px;");
  hdr.appendChild(mk("p","SOMBRA — PRONUNCIACIÓN","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:2px;"));
  hdr.appendChild(mk("h2","Shadowing","font-size:20px;font-weight:800;color:var(--text);letter-spacing:-0.02em;"));
  hdr.appendChild(mk("p","Escucha en alemán, graba tu voz y compará la pronunciación. La transcripción usa alemán (de-DE).","font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;"));
  el.appendChild(hdr);

  // Init pool
  if(!state.shadowing||!state.shadowing.pool||!state.shadowing.pool.length){
    state.shadowing={pool:[],idx:0};
    state.shadowing.pool=SHADOWING_POOL.slice().sort(function(){return Math.random()-0.5;});
    state.shadowing.idx=0;
  }
  if(state.shadowing.idx>=state.shadowing.pool.length){state.shadowing.idx=0;state.shadowing.pool=SHADOWING_POOL.slice().sort(function(){return Math.random()-0.5;});}

  var sentence=state.shadowing.pool[state.shadowing.idx];

  // Counter
  el.appendChild(mk("p",(state.shadowing.idx+1)+" / "+state.shadowing.pool.length+"  ·  "+sentence.es,"color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px;"));

  // Sentence card
  var card=mk("div","","background:rgba(78,205,196,0.04);border:1px solid rgba(78,205,196,0.15);border-radius:16px;padding:22px;margin-bottom:14px;text-align:center;");
  card.appendChild(mk("p",sentence.de,"font-size:19px;font-weight:800;color:var(--text);line-height:1.55;margin-bottom:6px;letter-spacing:-0.01em;"));
  card.appendChild(mk("p",sentence.es,"font-size:13px;color:var(--muted);font-weight:500;"));
  el.appendChild(card);

  // Listen button
  var playRow=mk("div","","display:flex;gap:8px;margin-bottom:14px;");
  var playBtn=mk("button","▶  Escuchar","flex:1;padding:14px;border-radius:14px;border:none;background:rgba(78,205,196,0.12);color:var(--teal-text);font-size:15px;font-weight:800;cursor:pointer;transition:opacity 0.2s;");
  playBtn.onclick=function(){speak(sentence.de);};
  playRow.appendChild(playBtn);
  el.appendChild(playRow);

  // Score host (inserted by mic callback)
  var scoreHost=mk("div","","margin-bottom:10px;");
  el.appendChild(scoreHost);

  // Mic row
  var micRow=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  micRow.appendChild(mk("span","🎤  Repetir — graba tu voz","font-size:14px;color:var(--teal-text);font-weight:700;flex:1;"));
  var micBtn=makeMicBtn("#4ECDC4",function(transcript){
    renderPronScore(scoreHost, sentence.de, transcript, "#4ECDC4"); logActivity("drillsDone",1); syncUp();
    nextBtn.style.display="block";
  });
  micBtn.setAttribute("aria-label","Grabar tu voz para puntuar la pronunciación"); micRow.appendChild(micBtn);
  el.appendChild(micRow);

  // Next / AI buttons (initially hidden next)
  var bottomRow=mk("div","","display:flex;gap:8px;");
  var nextBtn=mk("button","Siguiente frase →","flex:1;padding:12px;border-radius:12px;border:none;background:rgba(245,166,35,0.1);color:var(--gold-text);font-size:13px;font-weight:800;cursor:pointer;display:none;");
  nextBtn.onclick=function(){state.shadowing.idx++;renderShadowing();};
  bottomRow.appendChild(nextBtn);
  var aiBtn=mk("button","🤖 Generar con IA","padding:12px 14px;border-radius:12px;border:1px solid rgba(167,139,250,0.25);background:rgba(167,139,250,0.08);color:var(--purple-text);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;");
  aiBtn.onclick=async function(){
    aiBtn.disabled=true;aiBtn.textContent="Generando...";
    try{
      var sys='You are a German teacher. Reply ONLY with valid JSON, no markdown. Generate ONE useful A2-B1 German sentence for shadowing practice (5-10 words). Format: {"de":"German sentence","es":"Spanish translation"}';
      var txt=await ai(sys,[{role:"user",content:"Generate a new shadowing sentence, different from the current ones."}],300);
      var cl=txt.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
      if(cl){var obj=JSON.parse(cl[0]);if(obj.de&&obj.es){state.shadowing.pool.splice(state.shadowing.idx+1,0,obj);showToast("Frase generada","success");renderShadowing();return;}}
      showToast("Error al generar","error");
    }catch(e){showToast("Error: "+e.message,"error");}
    aiBtn.disabled=false;aiBtn.textContent="🤖 Generar con IA";
  };
  bottomRow.appendChild(aiBtn);
  el.appendChild(bottomRow);

  // Reset button
  var resetBtn=mk("button","↻ Reiniciar frases","width:100%;background:transparent;border:1px dashed rgba(255,255,255,0.1);color:var(--muted);border-radius:12px;padding:10px;font-size:12px;font-weight:600;margin-top:12px;cursor:pointer;");
  resetBtn.onclick=function(){state.shadowing.pool=SHADOWING_POOL.slice().sort(function(){return Math.random()-0.5;});state.shadowing.idx=0;renderShadowing();};
  el.appendChild(resetBtn);
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Flush-on-close: si hay un sync debounced pendiente, dispararlo con keepalive
// (sobrevive al unload de la página y permite el header x-token, a diferencia de sendBeacon).
window.addEventListener("beforeunload",function(){
  // Flush siempre que haya sesión — el timer de minutos ya no sincroniza solo,
  // así que sin esto se perderían los minutos/dailyLog al cerrar durante un chat.
  if(!state.app.authToken) return;
  clearTimeout(state.app.syncTimer); state.app.syncTimer=null;
  try {
    fetch("/api/sync",{method:"POST",keepalive:true,headers:{"content-type":"application/json","x-token":state.app.authToken},body:syncPayload()});
  } catch(e){}
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&document.getElementById("login-screen").style.display!=="none"){ doAuth(); return; }
  var tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"){
    if(e.key==="Enter"&&e.ctrlKey){}else return;
  }
  if(e.key===" "){
    e.preventDefault();
    if(state.flashcards._flashcardEl&&document.getElementById("s-flashcards").classList.contains("active")) state.flashcards._flashcardEl.click();
  }
  if(e.key>="1"&&e.key<="4"){
    var idx=parseInt(e.key)-1;
    // Solo califica si la tarjeta está volteada (los botones de grade visibles)
    if(state.flashcards._gradeBtns&&state.flashcards._gradeBtns[idx]&&state.flashcards._gradeBtns[idx].offsetParent!==null&&document.getElementById("s-flashcards").classList.contains("active")) state.flashcards._gradeBtns[idx].click();
  }
  if(e.key==="Enter"&&e.ctrlKey){
    var inp=document.querySelector(".chat-input");
    if(inp&&document.getElementById("s-conversar").classList.contains("active")){
      var sb=document.querySelector(".send-btn");
      if(sb) sb.click();
    }
  }
  if(e.key==="Escape"){
    // 1º cierra el modal abierto; si no hay, corta el TTS
    var modal=document.querySelector(".modal-overlay,.surface-modal");
    if(modal){ if(modal._closeModal) modal._closeModal(); else modal.remove(); }
    else if(window.speechSynthesis) window.speechSynthesis.cancel();
  }
});

if(state.app.authToken) {
  document.getElementById("loading-screen").style.display="flex";
  fetch("/api/sync",{headers:{"x-token":state.app.authToken}}).then(function(r){return r.json();}).then(function(data){
    if(data.ok){ if(data.data) applyServerData(data.data); if(data.serverInfo) state.app.serverInfo=data.serverInfo; showApp(); }
    else {
      // Token inválido/expirado → volver a login
      state.app.authToken=null; state.app.authUser=null;
      localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
      document.getElementById("loading-screen").style.display="none";
      document.getElementById("login-screen").style.display="flex";
      showToast("Tu sesión expiró, iniciá de nuevo","info");
    }
  }).catch(function(){
    state.app.authToken=null; state.app.authUser=null;
    localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("login-screen").style.display="flex";
  });
} else {
  document.getElementById("loading-screen").style.display="none";
}
</script>
</body>
</html>
