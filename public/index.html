function casosShuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.random()*(i+1)|0;var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function casosBuildPool(){ state.casos.casosPool=casosShuffle(state.casos.casosQuizModo==='all'?CASOS_Q:CASOS_Q.filter(function(q){return q.modo===state.casos.casosQuizModo;})); state.casos.casosIdx=0; }
function casosUpdateScore(){
  var h=document.getElementById("cs-hit"); if(!h) return;
  h.textContent=state.casos.casosHits; document.getElementById("cs-tot").textContent=state.casos.casosTotal;
  document.getElementById("cs-streak").textContent=state.casos.casosStreak;
  document.getElementById("cs-pct").textContent=state.casos.casosTotal?Math.round(state.casos.casosHits/state.casos.casosTotal*100)+'%':'—';
}
function casosNextQ(){ if(state.casos.casosIdx>=state.casos.casosPool.length){ state.casos.casosPool=casosShuffle(state.casos.casosPool); state.casos.casosIdx=0; } var m=document.getElementById("cs-quiz-mount"); if(m) casosRenderQ(m); }

function casosRenderQ(mount){
  if(!state.casos.casosPool.length){ mount.innerHTML="<p style='color:var(--muted);font-size:13px;text-align:center;padding:20px;'>Sin preguntas en este modo.</p>"; return; }
  if(state.casos.casosIdx>=state.casos.casosPool.length){ state.casos.casosPool=casosShuffle(state.casos.casosPool); state.casos.casosIdx=0; }
  const q=state.casos.casosPool[state.casos.casosIdx]; state.casos.casosAnswered=false;
  if(q.modo==='traduccion'){ casosRenderTrad(q,mount); return; }
  const modoLbl={articulo:'Elige el artículo',caso:'¿Qué caso es?',mov:'Movimiento o ubicación'}[q.modo];
  const frase=q.frase.replace('___','<span class="cs-blank">___</span>');
  mount.innerHTML='<div style="border:1px solid var(--border);border-radius:14px;padding:16px;background:rgba(255,255,255,0.03);">'
    +'<div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">'+modoLbl+'</div>'
    +'<p style="font-size:18px;line-height:1.5;margin-bottom:4px;color:var(--text);">'+frase+'</p>'
    +(q.pista?'<p style="font-size:12px;color:var(--muted);margin-bottom:14px;">'+q.pista+'</p>':'<div style="margin-bottom:14px;"></div>')
    +'<div class="cs-opts" id="cs-opts"></div>'
    +'<div id="cs-fb" style="margin-top:14px;display:none;"></div>'
    +'<div id="cs-next" style="margin-top:14px;display:none;justify-content:flex-end;">'
    +'<button id="cs-nextbtn" style="font-size:14px;font-weight:700;padding:10px 18px;border-radius:11px;border:0;background:var(--gold);color:#000;">Siguiente →</button></div>'
    +'</div>';
  const opts=document.getElementById("cs-opts");
  q.op.forEach(function(o){
    const b=document.createElement("button"); b.className="cs-opt"; b.textContent=o;
    b.onclick=function(){casosChoose(q,o,opts,b);};
    opts.appendChild(b);
  });
  const nb=document.getElementById("cs-nextbtn"); if(nb) nb.onclick=function(){state.casos.casosIdx++;casosNextQ();};
}

function casosChoose(q,o,opts,btn){
  if(state.casos.casosAnswered) return; state.casos.casosAnswered=true;
  const correct=o===q.ok;
  state.casos.casosTotal++; if(correct){state.casos.casosHits++;state.casos.casosStreak++;} else {state.casos.casosStreak=0;}
  logActivity("drillsDone",1); syncUp();
  casosUpdateScore();
  Array.prototype.forEach.call(opts.children,function(b){
    if(b.textContent===q.ok) b.classList.add("correct");
    else if(b===btn) b.classList.add("wrong");
    else b.classList.add("dim");
    b.style.pointerEvents="none";
  });
  const fb=document.getElementById("cs-fb");
  const caseNames={nom:'Nominativ',akk:'Akkusativ',dat:'Dativ',gen:'Genitiv'};
  const tag=q.caso?'<span class="cs-tag '+q.caso+'">'+caseNames[q.caso]+'</span> ':'';
  fb.style.display="block";
  fb.style.cssText="margin-top:14px;display:block;border-radius:12px;padding:13px;font-size:14px;background:"+(correct?"var(--akk-bg)":"rgba(248,113,113,0.08)")+";border:1px solid "+(correct?"var(--akk-line)":"rgba(248,113,113,0.25)")+";";
  fb.innerHTML='<div style="font-weight:800;color:'+(correct?"#4ade80":"#F87171")+';margin-bottom:5px;">'+(correct?'✓ Correcto':'✗ Casi · la respuesta es '+q.ok)+'</div>'
    +'<div style="color:#cbd5e1;line-height:1.5;">'+tag+q.why+'</div>';
  document.getElementById("cs-next").style.display="flex";
}

function casosRenderTrad(q,mount){
  mount.innerHTML='<div style="border:1px solid var(--border);border-radius:14px;padding:16px;background:rgba(255,255,255,0.03);">'
    +'<div style="font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:8px;">Tradúcelo en tu cabeza</div>'
    +'<p style="font-size:18px;line-height:1.5;margin-bottom:14px;color:var(--text);">'+q.es+'</p>'
    +'<button id="cs-rev" style="font-size:14px;font-weight:700;padding:10px 16px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);">Ver respuesta</button>'

      +'<div style="font-size:16px;font-weight:600;color:var(--text);">'+q.de+'</div>'

        +'<button id="cs-got" style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);">La tenía ✓</button>'
        +'<button id="cs-miss" style="font-size:13px;font-weight:700;padding:9px 14px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);">Fallé</button>'
      +'</div></div></div>';
  document.getElementById("cs-rev").onclick=function(){
    document.getElementById("cs-ans").style.display="block"; this.style.display="none";
  };
  document.getElementById("cs-got").onclick=function(){state.casos.casosTotal++;state.casos.casosHits++;state.casos.casosStreak++;logActivity("drillsDone",1);syncUp();casosUpdateScore();state.casos.casosIdx++;casosNextQ();};

}

  const pct=state.session.weeklyGoal>0?Math.min(100, Math.round((wk/state.session.weeklyGoal)*100)):0;
  const goalBox=document.createElement("div");
  goalBox.style.cssText="background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.2);border-radius:16px;padding:16px 18px;margin-bottom:14px;";
  const gTop=mk("div","","display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;");
  const gL=mk("div","","");
  gL.appendChild(mk("p","🎯 META SEMANAL","font-size:10px;color:#4ECDC4;letter-spacing:2.5px;font-weight:700;"));
  gL.appendChild(mk("p",wk+" / "+state.session.weeklyGoal+" min","font-size:18px;font-weight:800;color:var(--text);margin-top:2px;letter-spacing:-0.01em;"));
  gTop.appendChild(gL);
  gTop.appendChild(mk("span",pct+"%","font-size:22px;font-weight:900;color:#4ECDC4;"));
  goalBox.appendChild(gTop);
  const bar=mk("div","","background:rgba(255,255,255,0.06);border-radius:8px;height:8px;overflow:hidden;");
  const fill=mk("div","","background:linear-gradient(90deg,#4ECDC4,#4ade80);height:100%;width:"+pct+"%;transition:width 0.4s;border-radius:8px;");
  bar.appendChild(fill); goalBox.appendChild(bar);
  el.appendChild(goalBox);

  [
    {label:"Frases exploradas", value:state.session.sessionPhrases, color:"#F5A623", icon:"📖"},
    {label:"Frases guardadas",  value:state.session.saved.length,   color:"#F87171", icon:"⭐"},
    {label:"Pendientes hoy",    value:reviewDueCount(), color:"#fbbf24", icon:"🎯"},
    {label:"Minutos practicados",value:state.session.sessionMinutes, color:"#4ECDC4", icon:"⏱️"},
    {label:"Chats guardados",   value:state.session.chatLogs.length, color:"#A78BFA", icon:"💬"}
  ].forEach(function(s,i){
    const row=document.createElement("div"); row.className="stat-row";
    row.style.borderColor=s.color+"22";
    row.style.animation="fadeUp 0.25s "+(i*0.05)+"s both";
    const left=mk("div","","display:flex;align-items:center;gap:10px;");
    left.appendChild(mk("span",s.icon,"font-size:20px;"));
    left.appendChild(mk("span",s.label,"font-size:14px;color:#cbd5e1;font-weight:600;"));
    const val=mk("span",String(s.value),"font-size:30px;font-weight:900;color:"+s.color+";letter-spacing:-0.03em;");
    row.appendChild(left); row.appendChild(val);
    el.appendChild(row);
  });

  // ── 7-Day Activity Chart ──
  const chartCard=document.createElement("div"); chartCard.className="card";
  chartCard.appendChild(mk("p","📈  ACTIVIDAD — 7 DIAS","font-size:10px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;font-weight:700;"));
  const days=[];
  for(let i=6;i>=0;i--){ const k=addDays(todayKey(),-i); days.push({key:k,label:["Do","Lu","Ma","Mi","Ju","Vi","Sa"][new Date(k+"T00:00:00").getDay()]}); }
  const maxAct=Math.max(1,...days.map(function(d){const e=state.session.dailyLog[d.key]; return e?(e.minutes||0)+(e.phrasesReviewed||0)+(e.drillsDone||0):0;}));
  const chartRow=mk("div","","display:flex;align-items:flex-end;gap:6px;height:100px;");
  days.forEach(function(d){
    const e=state.session.dailyLog[d.key]||{};
    const total=(e.minutes||0)+(e.phrasesReviewed||0)+(e.drillsDone||0);
    const h=Math.max(2,Math.round((total/maxAct)*80));
    const col=mk("div","","display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;");
    const val=mk("p",String(total),"font-size:10px;color:var(--muted);font-weight:700;min-height:14px;");
    const barEl=mk("div","","border-radius:4px 4px 0 0;height:"+h+"px;width:100%;transition:height 0.3s;background:"+(total>0?"linear-gradient(180deg,#F5A623,rgba(245,166,35,0.4))":"rgba(255,255,255,0.04)")+";");
    const lbl=mk("p",d.label,"font-size:10px;color:"+(d.key===todayKey()?"#F5A623":"var(--muted)")+";font-weight:"+(d.key===todayKey()?"800":"600")+";");
    col.appendChild(val); col.appendChild(barEl); col.appendChild(lbl);
    chartRow.appendChild(col);
  });
  chartCard.appendChild(chartRow);
  if(Object.values(state.session.dailyLog).every(function(e){return !e||(!e.minutes&&!e.phrasesReviewed&&!e.drillsDone);}))
    chartCard.appendChild(mk("p","Aun no hay actividad","font-size:12px;color:var(--muted);margin-top:8px;text-align:center;"));
  el.appendChild(chartCard);

  // ── SRS Distribution ──
  const srsCard=document.createElement("div"); srsCard.className="card";
  srsCard.appendChild(mk("p","📦  DISTRIBUCION SRS","font-size:10px;color:var(--purple);letter-spacing:2px;margin-bottom:12px;font-weight:700;"));
  const boxColors=["#F87171","#F5A623","#fbbf24","#4ECDC4","#4ade80","#22c55e"];
  const boxNames=["Nuevo","Basico","Intermedio","Avanzado","Dominado","Maestro"];
  const totalCards=state.session.saved.length||1;
  for(let b=0;b<=5;b++){
    const count=state.session.saved.filter(function(p){return p.box===b;}).length;
    const pct=Math.round((count/totalCards)*100);
    const row=mk("div","","display:flex;align-items:center;gap:8px;margin-bottom:6px;");
    row.title="B"+b+" · "+boxNames[b];
    const bLabel=mk("span","B"+b,"font-size:11px;color:var(--muted);font-weight:700;min-width:22px;");
    bLabel.title=boxNames[b];
    row.appendChild(bLabel);
    const barBg=mk("div","","flex:1;background:rgba(255,255,255,0.06);border-radius:4px;height:10px;overflow:hidden;");
    const barFill=mk("div","","background:"+boxColors[b]+";height:100%;width:"+pct+"%;transition:width 0.4s;border-radius:4px;");
    barBg.appendChild(barFill);
    row.appendChild(barBg);
    row.appendChild(mk("span",count+" ("+pct+"%)","font-size:11px;color:var(--muted);font-weight:600;min-width:60px;text-align:right;"));
    srsCard.appendChild(row);
  }
  if(!state.session.saved.length) srsCard.appendChild(mk("p","Sin datos","font-size:12px;color:var(--muted);margin-top:4px;"));
  el.appendChild(srsCard);

  // ── Top Lapses ──
  const topLapsed=[...state.session.saved].filter(function(p){return p.lapses>0;}).sort(function(a,b){return b.lapses-a.lapses;}).slice(0,5);
  const lapsCard=document.createElement("div"); lapsCard.className="card";
  lapsCard.appendChild(mk("p","⚠️  MAS FALLADAS","font-size:10px;color:#F87171;letter-spacing:2px;margin-bottom:12px;font-weight:700;"));
  if(topLapsed.length){
    topLapsed.forEach(function(p,i){
      const row=mk("div","","display:flex;align-items:center;gap:10px;padding:8px 0;"+(i<topLapsed.length-1?"border-bottom:1px solid rgba(255,255,255,0.04);":""));
      row.appendChild(mk("span",String(i+1),"font-size:13px;color:var(--muted);font-weight:700;min-width:18px;"));
      const txt=mk("div","","flex:1;");
      txt.appendChild(mk("p",p.de,"font-size:14px;color:var(--text);font-weight:700;"));
      txt.appendChild(mk("p",p.es,"font-size:12px;color:var(--muted);margin-top:1px;"));
      row.appendChild(txt);
      row.appendChild(mk("span",p.lapses+"x","font-size:16px;font-weight:900;color:#F87171;"));
      lapsCard.appendChild(row);
    });
  } else {
    lapsCard.appendChild(mk("p","Todavia no has fallado ninguna. ¡Sigue asi!","font-size:13px;color:var(--muted);line-height:1.5;"));
  }
  el.appendChild(lapsCard);

  const msg=state.session.sessionPhrases+state.session.saved.length+state.session.sessionMinutes===0
    ?"Empieza a practicar y aqui veras tu progreso!"
    :"Gut gemacht! La consistencia es la clave. Sigue adelante!";
  const tip=mk("div","","background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.18);border-radius:16px;padding:18px;margin-top:4px;display:flex;gap:12px;align-items:flex-start;");
  tip.appendChild(mk("span","💡","font-size:20px;flex-shrink:0;margin-top:1px;"));
  tip.appendChild(mk("p",msg,"font-size:14px;color:#4ECDC4;font-weight:600;line-height:1.55;"));
  el.appendChild(tip);

  // ── Insight Semanal ──
  var _insightShown=false;
  var insightCard=document.createElement("div"); insightCard.className="card";
  insightCard.style.cssText="margin-top:10px;";
  var insightHdr=mk("div","","display:flex;justify-content:space-between;align-items:center;cursor:pointer;");
  insightHdr.appendChild(mk("p","📊  INSIGHT SEMANAL","font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:700;"));
  var insightArrow=mk("span","▼","font-size:12px;color:var(--muted);transition:transform 0.2s;");
  insightHdr.appendChild(insightArrow);
  insightCard.appendChild(insightHdr);
  var insightBody=mk("div","","overflow:hidden;transition:max-height 0.3s;max-height:0;");
  insightCard.appendChild(insightBody);
  insightHdr.onclick=function(){
    _insightShown=!_insightShown;
    insightArrow.textContent=_insightShown?"▲":"▼";
    if(_insightShown) renderInsight(insightBody);
    else insightBody.style.maxHeight="0";
  };
  el.appendChild(insightCard);

  // ── Fehlerjournal ──
  if(state.session.errorJournal.length){
    var fjCard=document.createElement("div"); fjCard.className="card";
    fjCard.style.cssText="margin-top:10px;border:1px solid rgba(248,113,113,0.15);";
    var fjHdr=mk("div","","display:flex;justify-content:space-between;align-items:center;cursor:pointer;");
    fjHdr.appendChild(mk("p","📓  DIARIO DE ERRORES","font-size:10px;color:#F87171;letter-spacing:2px;font-weight:700;"));
    var fjArrow=mk("span","▼","font-size:12px;color:var(--muted);transition:transform 0.2s;");
    fjHdr.appendChild(fjArrow);
    fjCard.appendChild(fjHdr);
    var fjBody=mk("div","","overflow:hidden;transition:max-height 0.3s;max-height:0;");
    fjCard.appendChild(fjBody);
    var _fjShown=false;
    fjHdr.onclick=function(){
      _fjShown=!_fjShown;
      fjArrow.textContent=_fjShown?"▲":"▼";
      if(_fjShown){
        fjBody.style.maxHeight="2000px";
        fjBody.innerHTML="";
        // Group by source
        var groups={};
        state.session.errorJournal.slice(0,50).forEach(function(e){
          if(!groups[e.source]) groups[e.source]={items:[], count:0};
          groups[e.source].items.push(e); groups[e.source].count++;
        });
        var sourceLabels={grammar:"📐 Gramatica",genero:"🎯 Genero",chat:"💬 Chat",dictado:"🎧 Dictado",corrigeme:"✏️ Corrígeme"};
        Object.keys(groups).forEach(function(src){
          var g=groups[src];
          var sec=document.createElement("div"); sec.style.cssText="margin-top:10px;";
          sec.appendChild(mk("p",(sourceLabels[src]||src)+" ("+g.count+")","font-size:11px;color:var(--dim);font-weight:700;letter-spacing:1px;margin-bottom:4px;"));
          g.items.slice(0,10).forEach(function(e){
            var row=mk("div","","display:flex;justify-content:space-between;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:13px;");
            var left=mk("div","","flex:1;");
            left.appendChild(mk("span",e.original,"font-weight:700;color:var(--text);"));
            if(e.correction) left.appendChild(mk("span"," → "+e.correction,"font-weight:500;color:#F87171;"));
            row.appendChild(left);
            row.appendChild(mk("span",e.date,"font-size:10px;color:var(--dim);"));
            fjBody.appendChild(row);
          });
        });
      } else {
        fjBody.style.maxHeight="0";
      }
    };
    el.appendChild(fjCard);
  }
}

// ── Insight Semanal ──
function getWeekKey(){
  var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-(d.getDay()+6)%7);
  var w=Math.floor((d.getTime()-new Date(d.getFullYear(),0,4).getTime())/604800000);
  return d.getFullYear()+"-W"+(w<10?"0":"")+w;
}
function renderInsight(host){
  host.innerHTML="";
  host.style.maxHeight="2000px";
  var week=getWeekKey(), cacheKey="dl_insight_"+week;
  var cached=null;
  try{ cached=JSON.parse(localStorage.getItem(cacheKey)||"null"); }catch(e){}
  if(cached){
    host.innerHTML=cached.html;
    return;
  }
  host.appendChild(skelCard(3));
  // Gather stats
  var topLapses=[...state.session.saved].filter(function(p){return p.lapses>0;}).sort(function(a,b){return b.lapses-a.lapses;}).slice(0,5);
  var gStats=state.session.saved.filter(function(p){return (p.lapses||0)>=2||(p.box||0)<=1;}).slice(0,8);
  var gram=state.grammar.grammarStats||{};
  var gramKeys=Object.keys(gram);
  var gramInfo=gramKeys.length?gramKeys.map(function(k){return k+":"+(gram[k].right||0)+"/"+(gram[k].wrong||0);}).join(", "):"none practiced";
  var wDays=0;
  for(var i=6;i>=0;i--){ var k=addDays(todayKey(),-i); if(state.session.dailyLog[k]&&(state.session.dailyLog[k].minutes||state.session.dailyLog[k].phrasesReviewed||state.session.dailyLog[k].drillsDone)) wDays++; }
  var lapsesInfo=topLapses.length?topLapses.slice(0,3).map(function(p){return p.de+" ("+p.es+") x"+p.lapses;}).join(" | "):"none";
  var weakInfo=gStats.length?gStats.slice(0,4).map(function(p){return p.de+" → "+p.es;}).join(" | "):"none";
  var system="You are a German teacher giving a weekly progress report. Analyze the data, be honest and encouraging. Give ONE actionable tip for next week. Reply ONLY with valid JSON, no markdown: {learned:\"...\",error:\"...\",tip:\"...\"}. Keep each field under 80 chars.";
  var data="Week stats: "+wDays+"/7 days active. Total saved: "+state.session.saved.length+". Streak: "+computeStreak()+"d. Weak phrases (top lapses): "+lapsesInfo+". Struggling words: "+weakInfo+". Grammar: "+gramInfo+". Level: "+state.app.level+".";
  ai(system,[{role:"user",content:data}],600).then(function(txt){
    try{
      var clean=txt.replace(/```json|```/g,"").trim();
      var m=clean.match(/\{[\s\S]*\}/);
      var obj=JSON.parse(m?m[0]:clean);
      if(!obj||!obj.learned) throw "bad";
      var htmlStr="<div style='padding:10px 0;'>"+
        "<div style='margin-bottom:12px;'><p style='font-size:11px;color:var(--teal);font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>📖 Aprendiste</p><p style='font-size:14px;color:var(--text);font-weight:600;line-height:1.5;'>"+obj.learned+"</p></div>"+
        "<div style='margin-bottom:12px;'><p style='font-size:11px;color:#F87171;font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>⚠️ Error recurrente</p><p style='font-size:14px;color:var(--text);font-weight:600;line-height:1.5;'>"+obj.error+"</p></div>"+
        "<div style='background:rgba(245,166,35,0.08);border:1px solid rgba(245,166,35,0.2);border-radius:12px;padding:12px;'><p style='font-size:11px;color:var(--gold);font-weight:700;letter-spacing:1.5px;margin-bottom:4px;'>💡 Consejo</p><p style='font-size:14px;color:var(--gold);font-weight:700;line-height:1.5;'>"+obj.tip+"</p></div>"+
        "<p style='font-size:10px;color:var(--dim);margin-top:12px;'>Semana del "+week+" · Actualizado hoy</p></div>";
      try{ localStorage.setItem(cacheKey,JSON.stringify({html:htmlStr,ts:Date.now()})); }catch(e){}
      host.innerHTML=htmlStr;
    } catch(e){
      host.innerHTML="<p style='color:var(--muted);text-align:center;padding:12px;font-size:13px;'>Error generando insight. Intenta de nuevo.</p>";
    }
  });
}

// ── Init ──────────────────────────────────────────────────────────────────────
// Flush-on-close: si hay un sync debounced pendiente, dispararlo con keepalive
// (sobrevive al unload de la página y permite el header x-token, a diferencia de sendBeacon).
window.addEventListener("beforeunload",function(){
  // Flush siempre que haya sesión — el timer de minutos ya no sincroniza solo,
  // así que sin esto se perderían los minutos/dailyLog al cerrar durante un chat.
  if(!state.app.authToken) return;
  clearTimeout(state.app.syncTimer); state.app.syncTimer=null;
  try {
    fetch("/api/sync",{method:"POST",keepalive:true,headers:{"content-type":"application/json","x-token":state.app.authToken},body:syncPayload()});
  } catch(e){}
});

document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&document.getElementById("login-screen").style.display!=="none"){ doAuth(); return; }
  var tag=document.activeElement&&document.activeElement.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"){
    if(e.key==="Enter"&&e.ctrlKey){}else return;
  }
  if(e.key===" "){
    e.preventDefault();
    if(state.flashcards._flashcardEl&&document.getElementById("s-flashcards").classList.contains("active")) state.flashcards._flashcardEl.click();
  }
  if(e.key>="1"&&e.key<="4"){
    var idx=parseInt(e.key)-1;
    // Solo califica si la tarjeta está volteada (los botones de grade visibles)
    if(state.flashcards._gradeBtns&&state.flashcards._gradeBtns[idx]&&state.flashcards._gradeBtns[idx].offsetParent!==null&&document.getElementById("s-flashcards").classList.contains("active")) state.flashcards._gradeBtns[idx].click();
  }
  if(e.key==="Enter"&&e.ctrlKey){
    var inp=document.querySelector(".chat-input");
    if(inp&&document.getElementById("s-conversar").classList.contains("active")){
      var sb=document.querySelector(".send-btn");
      if(sb) sb.click();
    }
  }
  if(e.key==="Escape"){
    // 1º cierra el modal abierto; si no hay, corta el TTS
    var modal=document.querySelector(".modal-overlay");
    if(modal){ modal.remove(); }
    else if(window.speechSynthesis) window.speechSynthesis.cancel();
  }
});

if(state.app.authToken) {
  document.getElementById("loading-screen").style.display="flex";
  fetch("/api/sync",{headers:{"x-token":state.app.authToken}}).then(function(r){return r.json();}).then(function(data){
    if(data.ok){ if(data.data) applyServerData(data.data); if(data.serverInfo) state.app.serverInfo=data.serverInfo; showApp(); }
    else {
      // Token inválido/expirado → volver a login
      state.app.authToken=null; state.app.authUser=null;
      localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
      document.getElementById("loading-screen").style.display="none";
      document.getElementById("login-screen").style.display="flex";
      showToast("Tu sesión expiró, iniciá de nuevo","info");
    }
  }).catch(function(){
    state.app.authToken=null; state.app.authUser=null;
    localStorage.removeItem("dl_token"); localStorage.removeItem("dl_user");
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("login-screen").style.display="flex";
  });
} else {
  document.getElementById("loading-screen").style.display="none";
}
</script>
