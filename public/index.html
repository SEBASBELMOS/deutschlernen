<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeutschLernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #F5A623;
  --teal: #4ECDC4;
  --red: #F87171;
  --purple: #A78BFA;
  --green: #4ade80;
  --bg: #07070f;
  --surface: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.08);
  --text: #e2e8f0;
  --muted: #64748b;
  --dim: #334155;
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
body::before {
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 60% 50% at 10% 10%, rgba(245,166,35,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 90% 90%, rgba(78,205,196,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 50% 50%, rgba(167,139,250,0.02) 0%, transparent 70%);
  pointer-events:none;
  z-index:0;
}
button,input,textarea { font-family:'Inter',system-ui,sans-serif; cursor:pointer; }
#app {
  max-width:620px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  position:relative;
  z-index:1;
}

/* ── TAB NAV ─────────────────────────────────────────────────────────────── */
.tab-nav { display:flex; align-items:center; padding:12px 8px 0; gap:4px; }
.tab-arrow {
  flex-shrink:0;
  background:none;
  border:none;
  color:var(--muted);
  font-size:22px;
  padding:0 6px;
  line-height:1;
  transition:color 0.2s;
}
.tab-arrow:hover { color:#94a3b8; }
.tab-bar { display:flex; overflow-x:auto; gap:6px; scrollbar-width:none; flex:1; }
.tab-bar::-webkit-scrollbar { display:none; }
.tab {
  flex-shrink:0;
  border:none;
  border-radius:20px;
  padding:7px 13px;
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  transition:background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
  letter-spacing:0.01em;
}
.tab.on {
  background:var(--gold);
  color:#000;
  box-shadow:0 2px 14px rgba(245,166,35,0.4);
}
.tab.off {
  background:rgba(255,255,255,0.06);
  color:var(--muted);
}
.tab.off:hover { background:rgba(255,255,255,0.1); color:#94a3b8; }
.tab:active { transform:scale(0.95); }

/* ── CONTENT ─────────────────────────────────────────────────────────────── */
.content { flex:1; padding:18px; overflow-y:auto; }
.screen { display:none; }
.screen.active {
  display:block;
  animation:screenIn 0.22s cubic-bezier(0.16,1,0.3,1);
}
@keyframes screenIn {
  from { opacity:0; transform:translateY(10px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ── CARDS ───────────────────────────────────────────────────────────────── */
.card {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:10px;
  transition:border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color:rgba(255,255,255,0.13); box-shadow:0 4px 24px rgba(0,0,0,0.2); }

/* ── COMMON BUTTONS ──────────────────────────────────────────────────────── */
.btn-back {
  background:rgba(255,255,255,0.07);
  border:none;
  color:#94a3b8;
  border-radius:10px;
  padding:7px 14px;
  font-size:13px;
  font-weight:600;
  transition:background 0.2s;
}
.btn-back:hover { background:rgba(255,255,255,0.12); }
.icon-btn { background:none; border:none; font-size:18px; padding:2px 4px; transition:transform 0.15s, opacity 0.15s; }
.icon-btn:hover { opacity:0.75; transform:scale(1.15); }

/* ── TOPIC GRID ──────────────────────────────────────────────────────────── */
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.sit-btn {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  padding:18px 12px 14px;
  color:var(--text);
  font-size:12px;
  font-weight:600;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  transition:background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
  line-height:1.3;
}
.sit-btn:hover {
  background:rgba(245,166,35,0.07);
  border-color:rgba(245,166,35,0.25);
  transform:translateY(-1px);
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
}
.sit-btn:active { transform:scale(0.97); }
.sit-icon { font-size:22px; line-height:1; }

/* ── LOADING ─────────────────────────────────────────────────────────────── */
.loading-box { text-align:center; padding:52px 0; }
.dots { display:flex; gap:6px; align-items:center; justify-content:center; }
.dot { width:8px; height:8px; border-radius:50%; }

/* ── STAT ROWS ───────────────────────────────────────────────────────────── */
.stat-row {
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-radius:16px;
  padding:18px 22px;
  margin-bottom:10px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  transition:transform 0.2s;
}
.stat-row:hover { transform:translateX(2px); }

/* ── ERROR ───────────────────────────────────────────────────────────────── */
.err { color:#ef4444; font-size:13px; text-align:center; margin-top:10px; }

/* ── CHAT ────────────────────────────────────────────────────────────────── */
.chat-win {
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:16px 16px 0 0;
  padding:14px 12px;
  height:340px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
  scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,0.08) transparent;
}
.chat-bar {
  display:flex;
  gap:8px;
  align-items:center;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);
  border-top:none;
  border-radius:0 0 16px 16px;
  padding:10px;
}
.chat-input {
  flex:1;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(78,205,196,0.2);
  border-radius:10px;
  padding:10px 14px;
  font-size:14px;
  color:#fff;
  outline:none;
  transition:border-color 0.2s;
}
.chat-input:focus { border-color:rgba(78,205,196,0.5); }
.send-btn {
  background:var(--teal);
  color:#000;
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-size:16px;
  font-weight:800;
  transition:background 0.2s, transform 0.1s;
}
.send-btn:hover { background:#5dd8cf; }
.send-btn:active { transform:scale(0.93); }
.send-btn:disabled { background:rgba(255,255,255,0.07); color:rgba(255,255,255,0.2); }
.bubble-row { display:flex; }
.bubble-row.user { justify-content:flex-end; }
.bubble-row.bot { justify-content:flex-start; }

/* ── MIC BUTTON ──────────────────────────────────────────────────────────── */
.mic-btn {
  width:44px; height:44px;
  border-radius:50%;
  font-size:9px;
  font-weight:800;
  letter-spacing:0.05em;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  border:2px solid var(--teal);
  background:rgba(78,205,196,0.08);
  color:var(--teal);
  transition:background 0.2s, border-color 0.2s, color 0.2s;
}

/* ── LOGIN SCREEN ────────────────────────────────────────────────────────── */
#login-screen {
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  padding:24px;
}
#login-screen::before {
  content:'';
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse 70% 60% at 30% 20%, rgba(245,166,35,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 70% at 80% 80%, rgba(78,205,196,0.06) 0%, transparent 60%);
  pointer-events:none;
}
.login-box { width:100%; max-width:340px; position:relative; z-index:1; }
.login-logo-wrap {
  margin-bottom:32px;
}
.login-logo {
  font-size:32px;
  font-weight:900;
  letter-spacing:-0.02em;
  line-height:1;
  margin-bottom:6px;
}
.login-logo span { color:var(--gold); }
.login-subtitle {
  font-size:11px;
  color:var(--dim);
  letter-spacing:3px;
  font-weight:600;
}
.login-card {
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:20px;
  padding:24px;
  backdrop-filter:blur(12px);
}
.login-input {
  width:100%;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;
  padding:13px 16px;
  font-size:15px;
  color:#fff;
  outline:none;
  margin-bottom:10px;
  display:block;
  transition:border-color 0.2s, background 0.2s;
}
.login-input:focus {
  border-color:rgba(245,166,35,0.6);
  background:rgba(255,255,255,0.08);
}
.login-btn {
  width:100%;
  background:var(--gold);
  color:#000;
  border:none;
  border-radius:12px;
  padding:14px;
  font-size:15px;
  font-weight:800;
  margin-bottom:10px;
  letter-spacing:0.01em;
  transition:background 0.2s, transform 0.1s, box-shadow 0.2s;
  box-shadow:0 4px 20px rgba(245,166,35,0.3);
}
.login-btn:hover { background:#f7b84b; box-shadow:0 6px 24px rgba(245,166,35,0.4); }
.login-btn:active { transform:scale(0.98); }
.login-toggle {
  width:100%;
  background:rgba(255,255,255,0.04);
  color:#94a3b8;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px;
  padding:12px;
  font-size:13px;
  font-weight:500;
  transition:background 0.2s;
}
.login-toggle:hover { background:rgba(255,255,255,0.08); }
.login-err {
  color:#ef4444;
  font-size:13px;
  text-align:center;
  margin-bottom:12px;
  min-height:18px;
  font-weight:500;
}

/* ── FLASHCARD ───────────────────────────────────────────────────────────── */
@keyframes flipIn { from{transform:rotateY(90deg) scale(0.95);opacity:0} to{transform:rotateY(0) scale(1);opacity:1} }
.flashcard {
  background:linear-gradient(135deg, rgba(245,166,35,0.09) 0%, rgba(245,166,35,0.03) 100%);
  border:1px solid rgba(245,166,35,0.2);
  border-radius:22px;
  padding:36px 28px;
  text-align:center;
  margin-bottom:16px;
  animation:flipIn 0.35s cubic-bezier(0.16,1,0.3,1);
  cursor:pointer;
  transition:border-color 0.25s, box-shadow 0.25s, transform 0.15s;
  box-shadow:0 8px 32px rgba(0,0,0,0.3);
}
.flashcard:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(0,0,0,0.35); }
.flashcard:active { transform:scale(0.98); }

/* ── SECTION HEADER ──────────────────────────────────────────────────────── */
.section-title {
  font-size:20px;
  font-weight:800;
  color:#fff;
  margin-bottom:4px;
  letter-spacing:-0.02em;
}
.section-sub {
  font-size:13px;
  color:var(--muted);
  margin-bottom:16px;
  font-weight:500;
}

/* ── SCENARIO BUTTONS ────────────────────────────────────────────────────── */
.scenario-btn {
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(78,205,196,0.12);
  border-radius:14px;
  padding:14px 16px;
  text-align:left;
  color:var(--text);
  font-size:14px;
  font-weight:500;
  margin-bottom:8px;
  transition:background 0.2s, border-color 0.2s, transform 0.15s;
}
.scenario-btn:hover {
  background:rgba(78,205,196,0.07);
  border-color:rgba(78,205,196,0.3);
  transform:translateX(3px);
}
.scenario-icon { font-size:20px; flex-shrink:0; }

/* ── ANIMATIONS ──────────────────────────────────────────────────────────── */
@keyframes bounce { 0%,80%,100%{transform:scale(0.4);opacity:0.3} 40%{transform:scale(1);opacity:1} }
@keyframes ring { 0%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)} 70%{box-shadow:0 0 0 10px rgba(239,68,68,0)} 100%{box-shadow:0 0 0 0 rgba(239,68,68,0)} }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
@keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo-wrap">
      <div class="login-logo">Deutsch<span>Lernen</span></div>
      <div class="login-subtitle">GERMAN WITH AI</div>
    </div>
    <div class="login-card">
      <div id="login-err" class="login-err"></div>
      <input id="login-user" class="login-input" placeholder="Username" type="text" autocomplete="username"/>
      <input id="login-pass" class="login-input" placeholder="Password" type="password" autocomplete="current-password"/>
      <button class="login-btn" id="login-btn" onclick="doAuth()">Iniciar sesion</button>
      <button class="login-toggle" onclick="toggleAuthMode()">No tienes cuenta? Registrate</button>
      <p id="auth-mode-lbl" style="text-align:center;font-size:11px;color:var(--dim);margin-top:10px;font-weight:500;">Modo: Login</p>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">

  <!-- HEADER -->
  <div style="padding:20px 18px 0;display:flex;align-items:center;gap:10px;">
    <div>
      <h1 style="font-size:22px;font-weight:900;letter-spacing:-0.03em;line-height:1;">
        Deutsch<span style="color:var(--gold);">Lernen</span>
      </h1>
      <p style="font-size:9px;color:var(--dim);letter-spacing:3px;margin-top:2px;font-weight:600;">GERMAN WITH AI</p>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <div id="badge" style="display:none;background:rgba(245,166,35,0.1);border:1px solid rgba(245,166,35,0.25);border-radius:20px;padding:4px 11px;">
        <span style="font-size:12px;color:var(--gold);font-weight:700;">&#9733; <span id="badge-n">0</span></span>
      </div>
      <div id="user-chip" style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:5px 10px 5px 13px;">
        <span id="user-lbl" style="font-size:12px;color:#94a3b8;font-weight:600;"></span>
        <button onclick="doLogout()" title="Cerrar sesion" style="background:none;border:none;padding:0;display:flex;align-items:center;opacity:0.45;cursor:pointer;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.45'">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- DIVIDER -->
  <div style="margin:12px 18px 0;height:1px;background:linear-gradient(90deg,rgba(245,166,35,0.2),rgba(78,205,196,0.1),transparent);"></div>

  <!-- TABS -->
  <div class="tab-nav">
    <button class="tab-arrow" onclick="scrollTabs(-1)">&#8249;</button>
    <div class="tab-bar" id="tabs"></div>
    <button class="tab-arrow" onclick="scrollTabs(1)">&#8250;</button>
  </div>

  <!-- SCREENS -->
  <div class="content">
    <div id="s-frases" class="screen"></div>
    <div id="s-conversar" class="screen"></div>
    <div id="s-corrigeme" class="screen"></div>
    <div id="s-noentendi" class="screen"></div>
    <div id="s-dictado" class="screen"></div>
    <div id="s-gramatica" class="screen"></div>
    <div id="s-flashcards" class="screen"></div>
    <div id="s-guardadas" class="screen"></div>
    <div id="s-resumen" class="screen"></div>
  </div>
</div>

<script>
// ── AI proxy ──────────────────────────────────────────────────────────────────
async function ai(system, messages, maxTokens) {
  const res = await fetch("/api/chat", {
    method:"POST", headers:{"content-type":"application/json"},
    body:JSON.stringify({model:"mimo-v2-flash",max_tokens:maxTokens||1000,temperature:0.7,
      messages:[{role:"system",content:system}].concat(messages)})
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error.message||JSON.stringify(data.error));
  if (!data.choices||!data.choices.length) throw new Error("Empty response");
  return data.choices[0].message.content;
}

// Extrae y parsea el primer array JSON válido del texto del AI
function parseJSONArray(text) {
  const clean = text.replace(/```json|```/g,"").trim();
  // Busca el array aunque haya texto extra antes/después
  const match = clean.match(/\[[\s\S]*\]/);
  if (!match) throw new Error("No JSON array found");
  try {
    return JSON.parse(match[0]);
  } catch(e) {
    // Intenta truncar en el último objeto completo si el JSON fue cortado
    const truncated = match[0].replace(/,?\s*\{[^}]*$/, "]");
    const parsed = JSON.parse(truncated);
    if (!parsed.length) throw new Error("JSON vacío después de reparar");
    return parsed;
  }
}

// ── TTS ───────────────────────────────────────────────────────────────────────
let _deVoice = null;
function loadDeVoice() {
  _deVoice = window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");}) || null;
}
if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadDeVoice;
  loadDeVoice();
}
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "de-DE"; u.rate = 0.82;
  const voice = _deVoice || window.speechSynthesis.getVoices().find(function(v){return v.lang.startsWith("de");});
  if (voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

// ── AssemblyAI ────────────────────────────────────────────────────────────────
async function transcribe(blob, mimeType) {
  if (!blob || blob.size < 1000) throw new Error("Audio muy corto, habla un poco mas.");
  const headers = {"content-type": mimeType || "audio/webm"};

  const upRes = await fetch("/api/upload", {method:"POST", headers:headers, body:blob});
  const up = await upRes.json();
  if (!up.upload_url) throw new Error("Error al subir el audio: "+(up.error||JSON.stringify(up)));

  const txRes = await fetch("/api/transcript", {
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify({audio_url:up.upload_url, language_code:"de"})
  });
  const tx = await txRes.json();
  if (!tx.id) throw new Error("Error al iniciar transcripcion: "+(tx.error||JSON.stringify(tx)));

  for (let i=0; i<25; i++) {
    await new Promise(function(r){setTimeout(r,2500);});
    const p = await (await fetch("/api/transcript/"+tx.id)).json();
    if (p.status==="completed") return p.text || "";
    if (p.status==="error") throw new Error("AssemblyAI error: "+(p.error||"desconocido"));
  }
  throw new Error("Timeout: la transcripcion tardo demasiado.");
}

// ── Mic ───────────────────────────────────────────────────────────────────────
let mr=null, chunks=[];

// Elige el mejor formato de audio soportado por este browser/dispositivo
function getBestMimeType() {
  const types = ["audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus","audio/mp4","audio/aac",""];
  for (let i=0; i<types.length; i++) {
    if (!types[i] || MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}

function makeMicBtn(color, cb) {
  const btn = document.createElement("button");
  btn.className="mic-btn";
  btn.style.borderColor=color||"#4ECDC4";
  btn.style.color=color||"#4ECDC4";
  btn.style.background="rgba("+hexToRgb(color||"#4ECDC4")+",0.08)";
  btn.textContent="MIC";
  btn.onclick=async function(){
    if (mr&&mr.state==="recording") { mr.stop(); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      const mimeType = getBestMimeType();
      mr = mimeType ? new MediaRecorder(stream, {mimeType:mimeType}) : new MediaRecorder(stream);
      mr.ondataavailable=function(e){ if(e.data&&e.data.size>0) chunks.push(e.data); };
      mr.onstop=async function(){
        stream.getTracks().forEach(function(t){t.stop();});
        btn.textContent="..."; btn.style.borderColor="#64748b"; btn.style.color="#64748b"; btn.style.animation="none";
        const usedType = mr.mimeType || mimeType || "audio/webm";
        try {
          const blob = new Blob(chunks, {type:usedType});
          const text = await transcribe(blob, usedType);
          btn.textContent="MIC"; btn.style.borderColor=color||"#4ECDC4"; btn.style.color=color||"#4ECDC4";
          if (text && text.trim() && cb) cb(text.trim());
          else if (!text || !text.trim()) showMicError(btn, color, "No se detecto voz. Intenta de nuevo.");
        } catch(err) {
          showMicError(btn, color, err.message);
        }
      };
      mr.start(250); // timeslice de 250ms para capturar chunks continuamente
      btn.textContent="STOP"; btn.style.borderColor="#ef4444"; btn.style.color="#ef4444"; btn.style.animation="ring 1.2s infinite";
    } catch(e){
      alert("Permite el acceso al microfono en tu browser.");
    }
  };
  return btn;
}

// Mic button that records, transcribes, then scores against a target phrase.
// Renders the score inline inside `host`.
function makePronMicBtn(color, targetPhrase, host){
  const btn=document.createElement("button");
  btn.className="mic-btn";
  btn.style.borderColor=color; btn.style.color=color;
  btn.style.background="rgba("+hexToRgb(color)+",0.08)";
  btn.style.minWidth="60px";
  btn.textContent="MIC";
  btn.onclick=async function(){
    if(mr&&mr.state==="recording"){ mr.stop(); return; }
    try {
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[];
      const mimeType=getBestMimeType();
      mr = mimeType ? new MediaRecorder(stream,{mimeType:mimeType}) : new MediaRecorder(stream);
      mr.ondataavailable=function(e){ if(e.data&&e.data.size>0) chunks.push(e.data); };
      mr.onstop=async function(){
        stream.getTracks().forEach(function(t){t.stop();});
        btn.textContent="..."; btn.style.borderColor="#64748b"; btn.style.color="#64748b"; btn.style.animation="none";
        const usedType=mr.mimeType||mimeType||"audio/webm";
        try {
          const blob=new Blob(chunks,{type:usedType});
          const transcript=await transcribe(blob, usedType);
          btn.textContent="MIC"; btn.style.borderColor=color; btn.style.color=color;
          renderPronScore(host, targetPhrase, transcript||"", color);
        } catch(err){ showMicError(btn, color, err.message); }
      };
      mr.start(250);
      btn.textContent="STOP"; btn.style.borderColor="#ef4444"; btn.style.color="#ef4444"; btn.style.animation="ring 1.2s infinite";
    } catch(e){ alert("Permite el acceso al microfono."); }
  };
  return btn;
}

function renderPronScore(host, target, transcript, color){
  // Remove previous score block if any
  const old=host.querySelector(".pron-score"); if(old) old.remove();
  function norm(s){ return (s||"").toLowerCase().replace(/[.,!?¿¡;:"'()]/g,"").replace(/\s+/g," ").trim(); }
  const tw=norm(target).split(" "); const uw=norm(transcript).split(" ");
  const total=tw.length||1; let correct=0;
  const wordSpans=[];
  tw.forEach(function(w,i){
    const got=uw[i]||"";
    const ok=got===w;
    if(ok) correct++;
    wordSpans.push({w:w, got:got, ok:ok});
  });
  const score=Math.round((correct/total)*100);
  const box=document.createElement("div");
  box.className="pron-score";
  box.style.cssText="margin-top:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:12px;";
  const top=mk("div","","display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;");
  top.appendChild(mk("span","Pronunciacion","font-size:11px;color:var(--muted);letter-spacing:1.5px;font-weight:700;"));
  top.appendChild(mk("span",score+"%","font-size:20px;font-weight:900;color:"+(score>=80?"#4ade80":score>=50?"#fbbf24":"#F87171")+";"));
  box.appendChild(top);
  const p=mk("p","","font-size:14px;line-height:1.6;font-weight:600;");
  wordSpans.forEach(function(s){
    const sp=document.createElement("span");
    sp.textContent=(s.got||"_")+" ";
    sp.style.color=s.ok?"#4ade80":"#F87171";
    sp.style.textDecoration=s.ok?"none":"underline";
    p.appendChild(sp);
  });
  box.appendChild(p);
  if(transcript) box.appendChild(mk("p","Detectado: "+transcript,"font-size:11px;color:var(--muted);margin-top:6px;font-weight:500;"));
  host.appendChild(box);
}

function hexToRgb(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return r+","+g+","+b;

// ── SRS / activity helpers ────────────────────────────────────────────────────
function todayKey(){
  const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
function addDays(dateStr, n){
  const d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const dd=String(d.getDate()).padStart(2,"0");
  return y+"-"+m+"-"+dd;
}
const BOX_INTERVALS=[0,1,3,7,14,30];
function ensureSrsFields(ph){
  if(typeof ph.box!=="number") ph.box=0;
  if(!ph.nextReview) ph.nextReview=todayKey();
  if(typeof ph.lapses!=="number") ph.lapses=0;
  if(!ph.added) ph.added=new Date().toISOString();
  if(!ph.source) ph.source="manual";
  return ph;
}
function srsUpdate(ph, grade){
  // grade: "fail" | "hard" | "good" | "easy"
  ensureSrsFields(ph);
  if(grade==="fail"){ ph.box=0; ph.lapses=(ph.lapses||0)+1; }
  else if(grade==="hard"){ /* same box */ }
  else if(grade==="good"){ ph.box=Math.min(5, ph.box+1); }
  else if(grade==="easy"){ ph.box=Math.min(5, ph.box+2); }
  const interval=BOX_INTERVALS[ph.box]||0;
  ph.nextReview=addDays(todayKey(), interval);
  ph.lastReviewed=new Date().toISOString();
  return ph;
}
function logActivity(kind, amount){
  // kind: "minutes" | "phrasesReviewed" | "drillsDone"
  const k=todayKey();
  if(!dailyLog[k]) dailyLog[k]={minutes:0,phrasesReviewed:0,drillsDone:0};
  dailyLog[k][kind]=(dailyLog[k][kind]||0)+(amount||1);
}
function computeStreak(){
  let streak=0; let cursor=todayKey();
  // If today has activity, count it; else start from yesterday
  const todayHas=dailyLog[cursor]&&(dailyLog[cursor].minutes>0||dailyLog[cursor].phrasesReviewed>0||dailyLog[cursor].drillsDone>0);
  if(!todayHas){ cursor=addDays(cursor,-1); }
  for(let i=0;i<400;i++){
    const e=dailyLog[cursor];
    if(e&&(e.minutes>0||e.phrasesReviewed>0||e.drillsDone>0)){ streak++; cursor=addDays(cursor,-1); }
    else break;
  }
  return streak;
}
function weeklyMinutes(){
  let sum=0; let cursor=todayKey();
  for(let i=0;i<7;i++){
    const e=dailyLog[cursor]; if(e) sum+=(e.minutes||0);
    cursor=addDays(cursor,-1);
  }
  return sum;
}
function reviewDueCount(){
  const t=todayKey();
  return saved.filter(function(p){ensureSrsFields(p);return p.nextReview<=t;}).length;
}

function applyServerData(data) {
  if (Array.isArray(data.saved)) { saved=data.saved; saved.forEach(ensureSrsFields); }
  if (Array.isArray(data.chatLogs)) chatLogs=data.chatLogs;
  if (data.totalPhrases) sessionPhrases=data.totalPhrases;
  if (data.totalMinutes) sessionMinutes=data.totalMinutes;
  if (data.dailyLog && typeof data.dailyLog==="object") dailyLog=data.dailyLog;
  if (data.shownPhrases && typeof data.shownPhrases==="object") shownPhrases=data.shownPhrases;
  if (data.weeklyGoal) weeklyGoal=Number(data.weeklyGoal)||60;
}

  const t=todayKey();
  const indices=[];
  saved.forEach(function(p,i){ ensureSrsFields(p); if(p.nextReview<=t) indices.push(i); });
  // Order: lowest box first, then oldest nextReview
  indices.sort(function(a,b){
    const A=saved[a], B=saved[b];
    if(A.box!==B.box) return A.box-B.box;
    return (A.nextReview||"").localeCompare(B.nextReview||"");
  });
  return indices;
}

function exportSavedCsv(){
  if(!saved.length) return;
  function esc(s){ s=String(s||""); if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"'; return s; }
  const lines=["de,es,tip,box,nextReview"];
  saved.forEach(function(p){ ensureSrsFields(p); lines.push([esc(p.de),esc(p.es),esc(p.tip||""),p.box,p.nextReview].join(",")); });
  const blob=new Blob([lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download="deutschlernen-frases-"+todayKey()+".csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
}

    }
    if(!(r.errors||[]).length && !(r.vocab||[]).length && !(r.suggestedPhrases||[]).length){
      box.appendChild(mk("p","🎉 Sin observaciones. Sigue asi.","color:#4ade80;font-size:14px;text-align:center;padding:20px 0;font-weight:600;"));
    }
    const ok=mk("button","Cerrar","width:100%;background:#F5A623;color:#000;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;margin-top:8px;");
    ok.onclick=function(){overlay.remove();}; box.appendChild(ok);
  } catch(e){
    loading.remove();
    box.appendChild(mk("p","No pude analizar: "+e.message,"color:#ef4444;font-size:13px;text-align:center;padding:20px 0;font-weight:500;"));
    const ok=mk("button","Cerrar","width:100%;background:rgba(255,255,255,0.06);color:#94a3b8;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;margin-top:4px;");
    ok.onclick=function(){overlay.remove();}; box.appendChild(ok);
  }
  _postChatRunning=false;
}

// ── DICTADO ───────────────────────────────────────────────────────────────────
let _dictadoTarget=null;
function renderDictado() {
  const el=document.getElementById("s-dictado"); el.innerHTML="";
  const hdr=mk("div","","margin-bottom:16px;");
  hdr.appendChild(mk("p","ENTRENA TU OIDO","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:2px;"));
  hdr.appendChild(mk("h2","Dictado","font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.02em;"));
  hdr.appendChild(mk("p","Escucha en aleman y escribe lo que oyes.","font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;"));
  el.appendChild(hdr);

  const card=document.createElement("div"); card.className="card";
  card.style.cssText+=";padding:18px;border-color:rgba(78,205,196,0.2);";
  const playBtn=document.createElement("button");
  playBtn.style.cssText="width:100%;background:#4ECDC4;color:#000;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:800;box-shadow:0 4px 16px rgba(78,205,196,0.3);margin-bottom:12px;";
  playBtn.textContent="▶  Escuchar frase";
  card.appendChild(playBtn);

  const ta=document.createElement("textarea"); ta.rows=3; ta.placeholder="Escribe lo que escuchaste...";
  ta.style.cssText="width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(78,205,196,0.2);border-radius:12px;padding:12px;font-size:14px;color:#fff;outline:none;resize:none;font-family:inherit;font-weight:500;margin-bottom:10px;";
  card.appendChild(ta);

  const actions=mk("div","","display:flex;gap:8px;");
  const checkBtn=mk("button","Comprobar","flex:1;background:#F5A623;color:#000;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:800;box-shadow:0 4px 14px rgba(245,166,35,0.3);");
  const newBtn=mk("button","Otra frase","background:rgba(255,255,255,0.05);color:#94a3b8;border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px 16px;font-size:13px;font-weight:700;");
  actions.appendChild(checkBtn); actions.appendChild(newBtn); card.appendChild(actions);
  el.appendChild(card);

  const result=document.createElement("div"); result.style.marginTop="14px"; el.appendChild(result);

  async function pickTarget(){
    result.innerHTML="";
    ta.value="";
    playBtn.textContent="Generando..."; playBtn.disabled=true;
    try {
      if(saved.length>=5 && Math.random()<0.6){
        // Prefer cards with lower box (más difíciles para Sebastian)
        const pool=saved.slice().sort(function(a,b){ensureSrsFields(a);ensureSrsFields(b);return a.box-b.box;}).slice(0, Math.max(5, Math.floor(saved.length/2)));
        _dictadoTarget=pool[Math.floor(Math.random()*pool.length)];
      } else {
        const sys='Reply ONLY with valid JSON: {"de":"...","es":"..."}. Generate ONE A2-B1 German phrase, 4-9 words, useful, common. No markdown.';
        const text=await ai(sys,[{role:"user",content:"random topic, seed: "+Date.now()}], 200);
        const m=text.replace(/```json|```/g,"").trim().match(/\{[\s\S]*\}/);
        _dictadoTarget=JSON.parse(m[0]);
      }
      playBtn.textContent="▶  Escuchar frase";
    } catch(e){
      playBtn.textContent="▶  Escuchar frase";
      result.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
    }
    playBtn.disabled=false;
  }

  playBtn.onclick=function(){ if(_dictadoTarget) speak(_dictadoTarget.de); };
  newBtn.onclick=pickTarget;
  checkBtn.onclick=function(){
    if(!_dictadoTarget) return;
    const user=ta.value.trim();
    if(!user) return;
    result.innerHTML="";
    const target=_dictadoTarget.de.trim();
    // Word-level comparison (normalize: lowercase, strip punctuation)
    function norm(s){ return s.toLowerCase().replace(/[.,!?¿¡;:"'()]/g,"").replace(/\s+/g," ").trim(); }
    const tWords=norm(target).split(" "); const uWords=norm(user).split(" ");
    const total=tWords.length; let correct=0;
    const wrap=document.createElement("div");
    wrap.style.cssText="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;margin-bottom:10px;";
    wrap.appendChild(mk("p","TU RESPUESTA","font-size:10px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:6px;"));
    const wrapWords=mk("p","","font-size:16px;line-height:1.6;font-weight:600;");
    tWords.forEach(function(w,i){
      const got=uWords[i]||"";
      const ok=got===w;
      if(ok) correct++;
      const sp=document.createElement("span");
      sp.textContent=(got||"_")+" ";
      sp.style.color=ok?"#4ade80":"#F87171";
      sp.style.textDecoration=ok?"none":"underline";
      wrapWords.appendChild(sp);
    });
    wrap.appendChild(wrapWords);
    result.appendChild(wrap);

    const score=Math.round((correct/total)*100);
    const sBox=document.createElement("div");
    sBox.style.cssText="background:rgba(74,222,128,0.06);border:1px solid rgba(74,222,128,0.2);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;";
    sBox.appendChild(mk("div","Score","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;"));
    sBox.appendChild(mk("span",score+"%","font-size:28px;font-weight:900;color:"+(score>=80?"#4ade80":score>=50?"#fbbf24":"#F87171")+";"));
    result.appendChild(sBox);

    const orig=document.createElement("div");
    orig.style.cssText="background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.2);border-radius:14px;padding:14px;";
    orig.appendChild(mk("p","ORIGINAL","font-size:10px;color:#4ECDC4;letter-spacing:2px;font-weight:700;margin-bottom:6px;"));
    orig.appendChild(mk("p",target,"font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.01em;"));
    if(_dictadoTarget.es) orig.appendChild(mk("p",_dictadoTarget.es,"font-size:13px;color:#94a3b8;margin-top:4px;font-weight:500;"));
    result.appendChild(orig);

    logActivity("phrasesReviewed",1);
    syncUp();
  };

  pickTarget();
}

// ── GRAMATICA ─────────────────────────────────────────────────────────────────
const GRAMMAR_TOPICS=[
  {label:"Articulos der/die/das", icon:"🔤", key:"articles"},
  {label:"Perfekt (haben/sein)",  icon:"⏪", key:"perfekt"},
  {label:"Wortstellung",          icon:"🔀", key:"wortstellung"},
  {label:"Adjektivendungen",      icon:"🎯", key:"adjendings"},
  {label:"Verbos separables",     icon:"✂️", key:"separable"},
  {label:"Praeteritum",           icon:"📜", key:"praeteritum"}
];
let _gramDrills=[], _gramIdx=0, _gramCorrect=0;

function renderGramatica() {
  const el=document.getElementById("s-gramatica"); el.innerHTML="";
  const hdr=mk("div","","margin-bottom:16px;");
  hdr.appendChild(mk("p","DRILLS DE GRAMATICA","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:2px;"));
  hdr.appendChild(mk("h2","Gramatica","font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.02em;"));
  hdr.appendChild(mk("p","Elige un tema y resuelve 5 ejercicios.","font-size:13px;color:var(--muted);margin-top:4px;font-weight:500;"));
  el.appendChild(hdr);
  const grid=document.createElement("div"); grid.className="grid2";
  GRAMMAR_TOPICS.forEach(function(t){
    const btn=document.createElement("button"); btn.className="sit-btn";
    btn.appendChild(mk("span",t.icon,"font-size:22px;line-height:1;"));
    btn.appendChild(mk("span",t.label,"font-size:12px;font-weight:600;color:var(--text);"));
    btn.onclick=function(){loadGrammarDrills(t);};
    grid.appendChild(btn);
  });
  el.appendChild(grid);
}

async function loadGrammarDrills(topic){
  const el=document.getElementById("s-gramatica"); el.innerHTML="";
  const top=mk("div","","display:flex;align-items:center;gap:10px;margin-bottom:16px;");
  const back=document.createElement("button"); back.className="btn-back"; back.textContent="← Volver";
  back.onclick=renderGramatica;
  top.appendChild(back);
  top.appendChild(mk("span",topic.label,"font-size:13px;color:var(--text);font-weight:700;"));
  el.appendChild(top);

  const loading=document.createElement("div"); loading.className="loading-box";
  const dw=mk("div","","display:flex;justify-content:center;margin-bottom:12px;"); dw.appendChild(makeDots("#A78BFA"));
  loading.appendChild(dw);
  loading.appendChild(mk("p","Generando ejercicios...","color:var(--muted);font-size:13px;font-weight:500;"));
  el.appendChild(loading);

  try {
    const sys='Generate 5 German grammar multiple-choice drills for topic: '+topic.label+'. Reply ONLY with a valid JSON array, no markdown: [{"prompt":"German sentence with ___ blank","options":["a","b","c","d"],"answer":"correct option exactly","explain":"<15 words Spanish"}]. Level A2-B1. Options must be plausible distractors.';
    const text=await ai(sys,[{role:"user",content:"topic: "+topic.label}], 1400);
    _gramDrills=parseJSONArray(text);
    _gramIdx=0; _gramCorrect=0;
    el.removeChild(loading);
    renderDrillStep(el, topic);
  } catch(e){
    if(loading.parentNode) el.removeChild(loading);
    el.appendChild(mk("p","Error: "+e.message,"color:#ef4444;font-size:13px;text-align:center;font-weight:500;"));
  }
}

function renderDrillStep(el, topic){
  // Clear all but the top nav
  while(el.children.length>1) el.removeChild(el.lastChild);

  if(_gramIdx>=_gramDrills.length){
    const done=document.createElement("div");
    done.style.cssText="background:rgba(167,139,250,0.06);border:1px solid rgba(167,139,250,0.2);border-radius:16px;padding:24px;text-align:center;";
    done.appendChild(mk("div","🎉","font-size:48px;margin-bottom:8px;"));
    done.appendChild(mk("p","Terminaste!","font-size:18px;font-weight:800;color:#fff;margin-bottom:6px;"));
    done.appendChild(mk("p",_gramCorrect+" / "+_gramDrills.length+" correctas","font-size:14px;color:#A78BFA;font-weight:700;"));
    el.appendChild(done);
    const again=mk("button","Otra ronda","width:100%;background:#A78BFA;color:#000;border:none;border-radius:14px;padding:13px;font-size:14px;font-weight:800;margin-top:12px;");
    again.onclick=function(){loadGrammarDrills(topic);};
    el.appendChild(again);
    logActivity("drillsDone", _gramDrills.length); syncUp();
    return;
  }

  const d=_gramDrills[_gramIdx];
  const counter=mk("p","Ejercicio "+(_gramIdx+1)+" / "+_gramDrills.length,"color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px;letter-spacing:0.5px;");
  el.appendChild(counter);

  const card=document.createElement("div"); card.className="card"; card.style.cssText+=";padding:18px;border-color:rgba(167,139,250,0.2);";
  card.appendChild(mk("p",d.prompt,"font-size:18px;font-weight:800;color:#fff;line-height:1.4;margin-bottom:14px;letter-spacing:-0.01em;"));
  const opts=mk("div","","display:flex;flex-direction:column;gap:8px;");
  let answered=false;
  d.options.forEach(function(opt){
    const b=document.createElement("button");
    b.style.cssText="text-align:left;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:#e2e8f0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;transition:background 0.15s,border-color 0.15s;cursor:pointer;";
    b.textContent=opt;
    b.onclick=function(){
      if(answered) return; answered=true;
      const ok=opt===d.answer;
      if(ok){ _gramCorrect++; b.style.background="rgba(74,222,128,0.12)"; b.style.borderColor="#4ade80"; b.style.color="#4ade80"; }
      else { b.style.background="rgba(248,113,113,0.12)"; b.style.borderColor="#F87171"; b.style.color="#F87171"; }
      // Mark correct option green
      Array.prototype.slice.call(opts.children).forEach(function(other){
        if(other.textContent===d.answer && other!==b){ other.style.background="rgba(74,222,128,0.12)"; other.style.borderColor="#4ade80"; other.style.color="#4ade80"; }
      });
      const ex=mk("p","💡 "+(d.explain||""),"font-size:12px;color:var(--muted);margin-top:10px;font-style:italic;line-height:1.5;font-weight:500;");
      card.appendChild(ex);
      const next=mk("button",(_gramIdx+1<_gramDrills.length?"Siguiente →":"Ver resultado"),"width:100%;background:#A78BFA;color:#000;border:none;border-radius:12px;padding:11px;font-size:13px;font-weight:800;margin-top:10px;");
      next.onclick=function(){ _gramIdx++; renderDrillStep(el, topic); };
      card.appendChild(next);
    };
    opts.appendChild(b);
  });
  card.appendChild(opts);
  el.appendChild(card);
}

// ── RESUMEN ───────────────────────────────────────────────────────────────────
function renderResumen() {
  const el=document.getElementById("s-resumen"); el.innerHTML="";
  const hdr=mk("div","","margin-bottom:16px;");
  hdr.appendChild(mk("p","TU PROGRESO","font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700;margin-bottom:2px;"));
  hdr.appendChild(mk("h2","Resumen","font-size:20px;font-weight:800;color:#fff;letter-spacing:-0.02em;"));
  el.appendChild(hdr);

  // Streak banner
  const streak=computeStreak();
  const streakBox=document.createElement("div");
  streakBox.style.cssText="background:linear-gradient(135deg,rgba(245,166,35,0.12),rgba(248,113,113,0.06));border:1px solid rgba(245,166,35,0.25);border-radius:16px;padding:16px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px;";
  streakBox.appendChild(mk("span","🔥","font-size:32px;flex-shrink:0;"));
  const sCol=mk("div","","flex:1;");
  sCol.appendChild(mk("p","RACHA","font-size:10px;color:#F5A623;letter-spacing:2.5px;font-weight:700;"));
  sCol.appendChild(mk("p",streak+(streak===1?" dia":" dias")+" seguidos","font-size:20px;font-weight:900;color:#fff;letter-spacing:-0.02em;margin-top:2px;"));
  if(streak===0) sCol.appendChild(mk("p","Practica hoy para empezar","font-size:12px;color:var(--muted);margin-top:2px;font-weight:500;"));
  streakBox.appendChild(sCol);
  el.appendChild(streakBox);

  // Weekly goal
  const wk=weeklyMinutes();
  const pct=Math.min(100, Math.round((wk/weeklyGoal)*100));
  const goalBox=document.createElement("div");
  goalBox.style.cssText="background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.2);border-radius:16px;padding:16px 18px;margin-bottom:14px;";
  const gTop=mk("div","","display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;");
  const gL=mk("div","","");
  gL.appendChild(mk("p","🎯 META SEMANAL","font-size:10px;color:#4ECDC4;letter-spacing:2.5px;font-weight:700;"));
  gL.appendChild(mk("p",wk+" / "+weeklyGoal+" min","font-size:18px;font-weight:800;color:#fff;margin-top:2px;letter-spacing:-0.01em;"));
  gTop.appendChild(gL);
  gTop.appendChild(mk("span",pct+"%","font-size:22px;font-weight:900;color:#4ECDC4;"));
  goalBox.appendChild(gTop);
  const bar=mk("div","","background:rgba(255,255,255,0.06);border-radius:8px;height:8px;overflow:hidden;");
  const fill=mk("div","","background:linear-gradient(90deg,#4ECDC4,#4ade80);height:100%;width:"+pct+"%;transition:width 0.4s;border-radius:8px;");
  bar.appendChild(fill); goalBox.appendChild(bar);
  el.appendChild(goalBox);

  [
    {label:"Frases exploradas", value:sessionPhrases, color:"#F5A623", icon:"📖"},
    {label:"Frases guardadas",  value:saved.length,   color:"#F87171", icon:"⭐"},
    {label:"Pendientes hoy",    value:reviewDueCount(), color:"#fbbf24", icon:"🎯"},
    {label:"Minutos practicados",value:sessionMinutes, color:"#4ECDC4", icon:"⏱️"},
    {label:"Chats guardados",   value:chatLogs.length, color:"#A78BFA", icon:"💬"}
  ].forEach(function(s,i){
    const row=document.createElement("div"); row.className="stat-row";
    row.style.borderColor=s.color+"22";
    row.style.animation="fadeUp 0.25s "+(i*0.05)+"s both";
    const left=mk("div","","display:flex;align-items:center;gap:10px;");
    left.appendChild(mk("span",s.icon,"font-size:20px;"));
    left.appendChild(mk("span",s.label,"font-size:14px;color:#cbd5e1;font-weight:600;"));
    const val=mk("span",String(s.value),"font-size:30px;font-weight:900;color:"+s.color+";letter-spacing:-0.03em;");
    row.appendChild(left); row.appendChild(val);
    el.appendChild(row);
  });

  const msg=sessionPhrases+saved.length+sessionMinutes===0
    ?"Empieza a practicar y aqui veras tu progreso!"
    :"Gut gemacht! La consistencia es la clave. Sigue adelante!";
  const tip=mk("div","","background:rgba(78,205,196,0.06);border:1px solid rgba(78,205,196,0.18);border-radius:16px;padding:18px;margin-top:4px;display:flex;gap:12px;align-items:flex-start;");
  tip.appendChild(mk("span","💡","font-size:20px;flex-shrink:0;margin-top:1px;"));
  tip.appendChild(mk("p",msg,"font-size:14px;color:#4ECDC4;font-weight:600;line-height:1.55;"));
  el.appendChild(tip);
}
